<main><div class="reader-width reader-top"><a class="back-link" href="index.html">← Színvakság</a></div><header class="reader-width reader-header fade-in"><p class="eyebrow gold">Szürke</p><h1 class="display-title">A bizonyosság szürke színe</h1></header><div class="reader-width"><div class="rule"></div></div><textarea id="story-source" class="story-source" aria-hidden="true">## A tárgyalás

– Hányszor ütötte meg magát?

A fiatalasszony egy ideig nem válaszolt. A tárgyalóterem magas ablakain át ferdén esett be a délelőtti fény, végigfutott a kőpadlón, és a szemközti fal tövében ülő emberek lábánál ért véget. A padsorok megteltek; a faluból többen már jóval a kezdés előtt megérkeztek, néhányan állva maradtak hátul, mások a nyitott ajtó közelében próbáltak helyet találni, ahonnan legalább hallani lehetett.

A bíró megismételte a kérdést.

– Nem tudom – mondta végül az asszony. – Sokszor.

– Az utolsó alkalommal mi történt?

A nő lesütötte a szemét. Fiatalabbnak látszott annál, mint amennyinek a jegyzőkönyv szerint lennie kellett volna, sötét haját egyszerűen összefogta a tarkóján, néhány rövidebb tincs azonban kiszabadult, és a füle mellett maradt. Amikor beszélt, ezeket időnként hátrasimította, aztán a kezét ismét az ölébe tette.

– Ivott. Mire hazajött, már alig állt a lábán. Valamiért haragudott. Nem tudom, miért.

– Összevesztek?

– Beszéltünk.

– Miről?

– Pénzről. Azt hiszem. Meg arról, hogy megint nem volt otthon egész nap.

– És utána?

Az asszony hosszabban hallgatott.

– Megütött.

A bíró előtt fekvő lapra az írnok tollának sercegése hallatszott.

– Egyszer?

– Nem.

– Tudja, hányszor?

A nő megrázta a fejét.

– A földre kerültem. Utána már nem számoltam.

A padsorok felől valaki megmozdult, egy pad megnyikordult, aztán újra csend lett.

– Milyen sérülései voltak?

– Felrepedt a szám. Az egyik szemem napokig nem nyílt ki rendesen. Az oldalam is fájt.

– Tört el valamije?

– Nem tudom. Nem mentem gyógyítóhoz.

– Miért?

Erre már gyorsabban felelt.

– Elmentem apámhoz.

A bíró egy pillanatra felnézett a jegyzeteiből. A nő kezei összezáródtak az ölében, de a hangja nyugodt maradt.

– Még azon az éjszakán?

– Igen.

– A férje megpróbálta visszatartani?

– Nem.

– Követte?

– Nem tudom. Nem néztem hátra.

Az írnok tovább írt.

– Meddig maradt az apjánál?

– Egy hétig.

– Ez alatt találkozott a férjével?

– Nem.

– Beszélt vele?

– Üzent.

– Mit?

A nő ekkor először nézett közvetlenül a bíróra.

– Azt, hogy sajnálja. Hogy többé nem iszik annyit, és nem emel rám kezet.

– Elhitte?

Az asszony tekintete egy pillanatra megállt rajta.

– Azt mondtam apámnak, hogy visszamegyek.

A bíró néhány másodpercig nem kérdezett tovább.

– Ezt nem kérdeztem.

– Tudom.

– Elhitte?

A nő lassan vett levegőt.

– Azt akartam, hogy igaz legyen.

A padsorokban megint megmozdult valaki. A bíró tekintete röviden odafordult, aztán vissza a nőre.

– Mit mondott az apja, amikor közölte vele, hogy visszamegy?

– Kért, hogy ne menjek.

– Hogyan?

– Ahogy egy apa kér valamit.

– Pontosan mit mondott?

– Hogy maradjak nála. Hogy a férjem már egyszer megígérte ugyanezt. Hogy ha most visszamegyek, megint meg fog történni.

– Maga mit válaszolt?

Az asszony az ajkát összeszorította, mintha keresné a saját szavait.

– Azt mondtam, hogy megígérte, hogy többé nem teszi.

– Mást?

– Azt is, hogy többé nem fogom hagyni, hogy még egyszer ezt tegye velem.

Az írnok keze megállt egy pillanatra, aztán folytatta.

A bíró nem nézett le.

– Mit értett ezen?

– Azt, amit mondtam.

– Mit tett volna, ha ismét megüti?

– Eljöttem volna.

A bíró csak ekkor pillantott a papírra.

– Aznap visszament hozzá?

– Nem. Apám azt kérte, hogy ha már eldöntöttem, legalább azt az utolsó estét töltsem még vele.

– És maga maradt.

– Igen.

– Mikor feküdt le?

– Nem tudom pontosan. Már sötét volt.

– Az apja akkor otthon volt?

– Igen.

– Látta még aznap éjjel?

– Nem.

– Reggel?

– Igen.

– Mondott valamit arról, hogy éjszaka elment?

A nő most az apja felé nézett.

Az idősebb férfi néhány lépéssel távolabb ült, egy külön pad szélén. Erős testalkatú ember volt, haja már nagyobbrészt ősz, a kezét a térdén tartotta, ujjai mozdulatlanul feküdtek egymás mellett.

– Reggel mondta, hogy elment hozzá – felelte a nő.

– A férjéhez?

– Igen.

– Mit mondott, miért?

– Beszélni akart vele.

– És beszélt?

– Azt mondta, nem találta otthon.

A bíró az apára nézett, majd vissza a nőre.

– Maga mikor indult el?

– Reggeli után.

– Egyedül?

– Igen.

– Mi történt, amikor hazaért?

Az asszony ujjai ekkor először kezdtek mozogni; hüvelykujja végigsimított a másik kéz bütykén, egyszer, aztán még egyszer.

– Az ajtó nem volt bezárva.

– Ez szokatlan volt?

– Nem mindig zárta.

– Bement.

– Igen.

– Hol találta meg a férjét?

– A hátsó szobában.

– Élt még?

– Nem.

A bíró hagyta, hogy a csend néhány pillanatig ott maradjon közöttük.

– Mihez nyúlt?

– Semmihez.

A nő rögtön javított.

– Hozzá nyúltam.

– Hogyan?

– Megfogtam a vállát. Aztán megláttam…

Nem fejezte be.

– Mit látott?

– A fejszét.

A teremben megint nyikordult egy pad.

– Hol volt?

– Mellette.

– A testében?

– Nem. A földön.

– Megfogta?

– Nem.

– Mit tett ezután?

– Átfutottam a szomszédhoz.

A bíró még néhány kérdést feltett arról, mikor indult el otthonról, mennyi idő alatt érhetett a férje házához, látott-e valakit az úton, hallott-e bármit a ház körül. Az asszony mindenre ugyanúgy válaszolt: nem látott senkit, nem hallott semmit, az időt pedig nem tudta pontosabban megmondani annál, hogy már reggel volt, amikor elindult.

Amikor visszaült, a bíró tekintete még néhány pillanatig rajta maradt, aztán az apát szólította.

Az idősebb férfi felállt.

Nem nézett a lányára, amikor a kijelölt helyre lépett.

– Ellenezte, hogy visszamenjen a férjéhez?

– Igen.

– Miért?

– Mert láttam, hogyan jött hozzám.

A hangja mély volt, de nem kellett megemelnie, hogy a terem végében is hallják.

– Korábban is tudta, hogy a veje megüti?

– Tudtam, hogy előfordult.

– És nem tett semmit?

Az apa állkapcsa egy pillanatra megfeszült.

– A lányom mindig visszament hozzá.

– Ez válasz a kérdésemre?

– Amit megtehettem, megtettem.

– Mit?

– Mondtam neki, hogy maradjon nálam. Beszéltem a férjével is korábban.

– Mikor?

– Többször.

– Megfenyegette valaha?

– Nem.

– Megütötte?

– Nem.

– A halála előtti este miért ment el hozzá?

Az apa most először nézett a lányára.

– Mert másnap vissza akart menni.

– Ezt már hallottuk. Mit akart a vejétől?

– Beszélni vele.

– Miről?

– Arról, hogy ha még egyszer kezet emel rá, ne számítson arra, hogy úgy teszek, mintha semmi nem történt volna.

– Ezt mondta volna neki?

– Igen.

– De nem mondta.

– Nem volt otthon.

– Mikor ért oda?

– Nem tudom pontosan.

– Mennyi ideig maradt?

– Vártam egy darabig.

– Mennyi ideig?

– Talán fél órát. Lehet, hogy kevesebbet.

– Bement a házba?

– Nem.

– Kopogott?

– Igen.

– Az ajtó nyitva volt?

Az apa elgondolkodott.

– Nem próbáltam.

– Miért nem?

– Mert nem volt dolgom odabent, ha ő nincs ott.

A bíró egy ideig nézte.

– Honnan tudta, hogy nincs ott?

– Nem válaszolt senki. Sötét volt.

– Nem lehetett aludni?

– Lehetett.

– Nem lehetett részeg?

Az apa szeme összeszűkült.

– Az is lehetett.

– Mégis hazament.

– Igen.

– Találkozott valakivel útközben?

– Nem.

– Látta valaki, amikor hazaért?

– Nem tudom.

– A lánya?

– Aludt.

– Maga honnan tudja?

Az apa most először nem válaszolt azonnal.

– Csend volt a szobájában.

A bíró bólintott az írnoknak, aki feljegyezte a mondatot.

A következő tanú a szomszédasszony volt.

Azt vallotta, hogy reggel a fiatal nő rohant át hozzá, mezítláb, bár arra nem emlékezett, vajon eleve cipő nélkül indult-e el otthonról, vagy útközben vesztette el. Sírt, de nem tudta pontosan elmondani, mi történt, csak azt ismételte, hogy a férje meghalt. A szomszéd vele ment vissza, belépett a házba, látta a férfit a földön, aztán kihívta a többieket.

– Hozzányúlt a testhez? – kérdezte a bíró.

– Nem.

– A fejszéhez?

– Nem.

– Látott valakit a ház körül?

– Nem.

– Hallott valamit az előző éjszaka?

– Nem.

– Tudta, hogy rossz volt a házasságuk?

Az asszony elhúzta a száját.

– A faluban mindenki tudta.

– Mit tudott mindenki?

– Hogy ivott. Hogy verte.

– Azt is tudta mindenki, hogy az asszony egy hétre elköltözött?

– Igen.

– És azt, hogy vissza akar menni?

A szomszédasszony röviden a padsorok felé pillantott.

– Mire reggel megtalálták, már mindenki tudta.

Néhány halk hang mozdult végig a termen.

A bíró megvárta, amíg elhallgatnak.

– Mikor tudta meg maga?

– Előző nap délután.

– Kitől?

– A pék feleségétől.

– Ő honnan tudta?

– Nem kérdeztem.

A szomszédasszony vallomása után egy fogadóst hívtak.

A férj gyakran járt hozzá inni. A tartozását rendszeresen késve rendezte, az utolsó hónapokban pedig többször kért hitelt, amit a fogadós végül már nem adott neki.

– Másnak is tartozott? – kérdezte a bíró.

– Mindenkinek, akitől még kapott valamit.

A padsorokban néhányan elmosolyodtak.

– Neveket.

A fogadós sorolt néhányat. Egy hentest, egy kereskedőt, egy lovast, aztán megállt.

– És annak az erdei embernek.

– Milyen erdei embernek?

– Akiről azt mondják, hogy a többiek fölött áll.

– Milyen többiek fölött?

A fogadós vállat vont.

– Akik az erdőben élnek.

– Banditák?

– Ezt beszélik.

– Maga találkozott vele?

– Nem.

– Látta valaha?

– Nem.

– Tudja, hogy valóban tartozott neki a halott?

– A halott mondta.

– Mikor?

– Néhány héttel azelőtt. Részeg volt.

– Mit mondott pontosan?

A fogadós összeráncolta a homlokát.

– Hogy ha nem fizet, még elviszik a bőrét is. Valami ilyesmit.

– Valami ilyesmit, vagy ezt?

– Nem emlékszem szó szerint.

– Látott idegeneket a faluban a halála előtti napokban?

– Mindig vannak idegenek.

– Olyat, akit ehhez az emberhez tud kötni?

– Nem.

A bíró visszadőlt a székében.

Az írnok még írt néhány sort, aztán megállt a toll.

A teremben azok maradtak, akik reggel óta ott ültek: a fiatalasszony, az apa, a szomszédok, a falu emberei, és a bíró előtt az egymásra rakott vallomások, amelyekből egyik sem mondott többet annál, amit az, aki kimondta, látott, hallott vagy emlékezni vélt.

A bíró becsukta a legfelső ívet.

– Holnap délelőtt folytatjuk.

A terem lassan megmozdult körülötte.

## A bíró

A terem lassan megmozdult körülötte. A padsorokból egyszerre emelkedtek fel az emberek, a kövön cipők csúsztak, kabátok suhogtak, halk beszéd indult az ajtó felé, és mire az írnok az utolsó lap fölött is elfújta a fölösleges port, a délelőtt óta összezárt levegőbe beáramlott a folyosó hűvöse. A bíró még a helyén maradt, előtte egymásra rakva feküdtek a vallomások, a felső íven a szomszédasszony nevével, alatta az apa szögletesebb betűkkel lejegyzett mondatai, legalul pedig a fiatalasszony vallomása.

A nő a padsorok között haladt kifelé, vállára terített kendője hozzáért egy ülés támlájához, aztán a mögötte érkező asszony félrehúzódott, hogy elengedje. A bejáratnál egy pillanatra világosabb lett körülötte a kép, mert a folyosó ablaka éppen oda vetette a délutáni fényt, megcsillant a haján, végigfutott az arcán, majd eltűnt vele együtt az ajtó túloldalán. Az apa néhány emberrel később indult utána, lassabban, széles vállával utat hagyva egy idős asszonynak, aki előtte próbált kijutni.

Az írnok összerendezte a lapokat.

– Magával viszi, uram?

A bíró végigsimított a legfelső ív szélén.

– Csak ezt a köteget hagyja itt.

Az írnok bólintott, a többi iratot a hóna alá vette, és amikor ő is kiment, a nagyteremben már csak a délutáni fény, a megürült padok és a falakon maradó halk visszhang töltötte ki a helyet. A bíró néhány percig még az asztalnál ült, aztán összekötötte a vallomásokat, felvette a kabátját, és a köteget a karja alá fogva elindult hazafelé.

A város a tárgyalás végére már túl volt a nap zajosabb részén. A piactéren néhány árus kezdte leszedni a ponyvát, a mészáros előtt vizet öntöttek a kövezetre, a pékség nyitott ajtajából friss kenyér illata szállt ki, és az egyik sarkon két fiú olyan komolysággal gurított maga előtt egy hordóabroncsot, mintha egész vagyonuk függne attól, hogy elér-e a következő kapuig. A bíró megszokott útján ment, időnként biccentett annak, aki köszöntötte, a hóna alatt pedig minden lépésnél hozzáért a kabátjához a vallomásokat tartó kemény fedél.

A háza a templom mögötti utcában állt, keskeny homlokzatával az út felé, mögötte apró kerttel, amelyet magas fal választott el a szomszédoktól. Mire belépett, a konyha felől már hallatszott az edények halk csörrenése, és a cseléd az előszobában átvette tőle a kabátot, miközben ő a dolgozószoba felé indult, hogy az iratokat az íróasztalra tegye.

A délutáni fény ott már csak keskeny csíkban feküdt a padlón. Az asztalon előző napról ott maradt egy lezárt levél, mellette három könyv, a tintatartó és egy kis bronz súly, amelyet a pergamenek sarkára szokott tenni, ha az ablak nyitva állt. A bíró a vallomásokat a könyvek mellé helyezte, végighúzta rajtuk az ujját, majd átment az ebédlőbe.

A vacsorához ketten terítettek. A hosszú asztal egyik végén ült, előtte leves gőzölgött, utána sült szárnyast hoztak gyökérzöldséggel, kenyérrel és kevés borral. A nyitott ablakon át beszűrődött az utca esti zaja; valaki még szekeret hajtott végig a kövezeten, távolabbról kutya ugatott, aztán megszólalt a templom harangja, mélyen és lassan, mire a cseléd belépett, elvette az üres tányért, és friss vizet tett a helyére.

A bíró a kenyérhéját törte le, belemártotta a hús szaftjába, közben a szemközti falon függő festményt nézte, amelyen egy régi családi birtok állt nyár közepén, világos homlokzattal és olyan fákkal körülvéve, amelyek azóta talán kétszer is kinőhettek volna ugyanott. A pohár mellett egy apró morzsa maradt, a kés pengéjén megült a gyertya fénye, az utcáról pedig egy nő nevetése szállt fel az ablakig, majd gyorsan elhalt, ahogy a társaság továbbment.

A vacsora után a dolgozószobában már két gyertya égett.

A bíró levette a polcról a vastag törvénykönyvet. A fedél bőre az évek alatt kifényesedett a széleken, a sarkok lekerekedtek, a gerincen futó aranyozásból több betű elkopott, belül azonban ugyanazok a sűrű sorok sorakoztak egymás alatt, amelyeket pályája során százszor, talán ezerszer olvasott.

A könyvet az asztalra fektette, ujjával végigment a lapok szélén, aztán megállt annál a résznél, amelyet keresett.

A rendelkezés egyetlen rövid bekezdést foglalt el.

Aki szándékosan embert öl, életével fizet érte.

A bíró végigolvasta, majd a fölötte álló rendelkezésre emelte a tekintetét, utána az alatta következőre, végül újra visszatért ugyanahhoz az egyetlen mondathoz. A sorok körül széles margó maradt, rajta régi ceruzajelek, apró megjegyzések más ügyekből, halvány vonások, amelyeket évekkel korábban húzott oda valaki, talán még az elődje.

Az asztal másik oldalán fekvő vallomásokból elővette a nőét.

Lassan olvasta.

Az apa kérte, hogy maradjon még egy estét.

A bíró ezen a részen megállt, ujját a sor mellett tartva, aztán tovább olvasott.

A következő ív az apáé volt.

Az idősebb férfi ellenezte a visszatérést, aznap este elment a vejéhez, beszélni akart vele, a ház sötét volt, válasz nem érkezett, valameddig várt, aztán hazatért. A bíró újra elolvasta az időre vonatkozó kérdéseket, a fél órát, amely lehetett kevesebb is, az ajtót, amelyet az apa állítása szerint ki sem próbált, a szobát, ahol reggel csendet hallott.

A szomszédasszony vallomása rövidebb volt.

A fogadósé még rövidebb.

Az erdei emberről szóló néhány mondat a lap alján húzódott, két javítással és az írnok apró beszúrásával ott, ahol a tanú először mást mondott, aztán pontosította, hogy a halott részeg volt, amikor a tartozásáról beszélt.

A bíró visszatette az íveket egymásra, és ismét maga elé húzta a törvénykönyvet.

A gyertyák kanóca közben hosszabbra nőtt, az egyik láng megremegett, amikor odakint szél futott végig az utcán, megmozdította az ablak keretét, majd végigsöpört a kert fái között. A szobában bőr, viasz, tinta és a régi könyvek száraz illata keveredett, a fal mellett álló óra pedig egyenletesen ütötte a másodperceket.

A bíró még egyszer elolvasta a rendelkezést.

Aki szándékosan embert öl, életével fizet érte.

Ezután becsukta a könyvet, tenyere néhány pillanatig a bőrborítón maradt, majd felállt az asztaltól.

A szoba másik végében álló karosszék régi darab volt, széles karfával és mélyre ült párnázással; a bőr halk roppanással engedett a súlya alatt, amikor beleereszkedett. Az egyik gyertya innen már csak az asztal szélét világította meg, a másik fényében a törvénykönyv sötét tömbje rajzolódott ki, mellette a vallomások keskeny kötege.

A bíró hátradőlt, egyik kezét a karfára fektette, a másikat lazán az ölében hagyta.

Az óra tovább járt a fal mellett.

## A végzetes tett

A férfi tenyere úgy csapódott az asszony arcának, hogy a fejét oldalra fordította az ütés. A szája sarkában azonnal megjelent a vér íze, meleg és sós, a nyelve hegyével végigért a felszakadt bőrön, miközben a férje még mondott valamit a pénzről, a vacsoráról, az egész napról, amelyet megint úgy töltött el, hogy mindenki követelt tőle valamit.

Az asszony a konyhaasztal szélébe kapaszkodott.

A férfi inge kigombolva lógott a mellkasán, arcát kipirosította az ital, leheletén bor és pálinka kesernyés szaga ült. A sarokban álló korsó mellett még ott maradt a vacsorából egy darab kenyér, az asztal lapjára kiömlött bor keskeny csíkban indult a perem felé, majd egy csepp a földre hullott.

– Nézz rám, amikor beszélek hozzád.

Az asszony felemelte a fejét.

A következő ütés ököllel érkezett.

A válla nekicsapódott a falnak, a polcról megzörrent két tányér, egyikük lassan elfordult a másikon. A férfi odalépett hozzá, megragadta a karját, és olyan közelről kiabált az arcába, hogy a szavai elveszítették értelmüket. Maradt belőlük a hang ereje, a nyál apró cseppjei az asszony arcán, az ujjak szorítása a felkarján.

Az asszony a férfi vállán túl az ajtót nézte.

Egyetlen lépés választotta el az asztaltól. Onnan még három az ajtóig.

Amikor a férfi elengedte, a nő megindult.

A férfi utánakapott, ujjai végigkarcolták a ruha hátát, az anyag egy pillanatra megfeszült a vállán, aztán kisiklott a kezéből. Az asszony feltépte az ajtót, végigszaladt az udvaron, a kaput vállal lökte ki maga előtt, és mire a férfi megjelent a küszöbön, már a keskeny utcán futott.

A kövek keményen ütötték a talpát a vékony cipőn keresztül. A szeme könnyezett, az egyik oldalon egyre szűkebbre húzódott körülötte a világ, az oldala minden lélegzetnél belenyilallt. Az első házak ablakaiban még fény égett, aztán ritkultak a kerítések, megnyílt előtte az út, amelyet gyerekkora óta ismert.

Apja házának kapuja ugyanazzal a mély, rekedt hanggal nyílt ki, mint évekkel korábban.

Az öregember a konyhában ült.

A kés még a kezében volt, amikor felnézett a hagymából, amelyet vacsorához szeletelt. Néhány pillanatig mozdulatlanul tartotta a pengét a deszka fölött. A leánya haja kibomlott futás közben, az egyik tincs az arcára tapadt, a szája vérzett, szeme körül már duzzadni kezdett a bőr.

Apa letette a kést.

– Gyere ide.

A leánya két lépést tett felé, aztán az öregember karjába hajtotta a fejét.

Apa sokáig tartotta.

Tenyerét a leánya tarkójára fektette, ujjai belemélyedtek a hajába, és miközben a nő vállában lassan elcsendesedett a remegés, az Apa tekintete a nyitott ajtón át az udvar sötétjére tévedt.

Az ő kislánya.

Aki valaha a két tenyerében elfért, amikor először emelte fel az anyja mellől. Aki ötévesen a diófa legalsó ágáról is úgy kiabált neki, mintha hegytetőt hódított volna meg. Aki egyszer elesett a pataknál, felszakította a térdét, ő pedig hazáig vitte a karjában, miközben a gyerek minden ötödik lépésnél megkérdezte, marad-e heg a helyén.

Apa minden reggel korábban kelt.

A nő átnyúlt az asztalon, kezét az apjáéra tette.

– Tudom, mennyit tettél értem.

Az öregember lefelé nézett a két egymáson fekvő kézre.

– Maradj még holnapig.

A leány elmosolyodott.

– Reggel akarok menni.

– Akkor reggelig.

A nő megszorította az apja kezét.

Ezt az egy estét megadhatta neki. Egyetlen este abból a sokból, amelyet az öregember neki adott, mióta világra jött. A férje várhatott reggelig. Apa pedig megérdemelte, hogy az utolsó közös vacsorájuk után még hallja a leánya lépteit a házban, reggel pedig ő tölthesse tele a bögréjét.

– Reggelig – mondta.

A férje ugyanabban az órában a fogadó hátsó asztalánál ült.

Előtte félig üres korsó állt. A fogadós kétszer is elment mellette, harmadszor már ott maradt az asztalnál.

– Ezt ma kifizeted.

A férfi belenyúlt a zsebébe, néhány érmét tett a fára.

A fogadós végignézett rajtuk.

– A fele sincs.

– Holnap lesz.

– Tegnap is holnap volt.

A férfi felvette a korsót.

– Holnap hazajön az asszony.

A fogadós arcán halvány mosoly futott át.

– Attól lesz pénzed?

– Lesz minden.

A korsó szája hozzáért a fogához.

A férfi az elmúlt hét minden estéjén egyedül ment haza. Az elsőn dühösen rúgta félre a küszöbnél maradt cipőt, a másodikon a falhoz hajította az üres bögrét, a harmadikon hosszú ideig ült ugyanazon a széken, amelyen a felesége szokott varrni. A negyedik este már arra gondolt, milyen könnyű lenne odamenni érte.

Az ötödiken megírta a levelet.

A hatodikon újra elolvasta, mielőtt elküldte volna.

A hetediken biztos volt benne, hogy az asszony hazajön.

– Az erdeiek is holnapig várnak?

A férfi letette a korsót.

A hang körülötte ugyanaz maradt, a kockák koppantak a szomszéd asztalon, valaki hátul nevetett, a tűzhely mellől felálló vendég széke végigkarcolta a padlót.

– Az az én dolgom.

– Akkor legyen a te dolgod, de valahol máshol.

A férfi kiitta a bort.

Az ajtó előtt hűvös levegő fogadta. A piactér fölött már sötét volt az ég, a házak felső ablakai között keskeny csíkban látszottak a csillagok. Elindult hazafelé, két utcával később pedig megállt, mert a túloldalon két idegen férfi támaszkodott egy bezárt műhely falának.

Az egyik ráemelte a fejét.

A férj továbbment.

Az idegenek még egy darabig ott maradtak.

Az erdő szélén álló házak között már régen kialudtak a fények, amikor a férfi elindult a falu felé. Vastag köpönyege alatt széles vállát alig mozdította járás közben, csizmája talpa tompán ért a kemény földre, a keskeny ösvény pedig hamarosan belefutott abba az útba, amelyen nappal szekerek hordták a fát és a faszenet a piactérre.

Az emberek az erdei banda vezetőjeként emlegették. A nevét ritkábban mondták ki, mint a történeteket, amelyek hozzá tapadtak; tartozásokról, eltűnt lovakról, az út mellett megállított kereskedőkről, olyan adósságokról, amelyekért egyszer mindig eljött valaki. A férj pénzzel tartozott neki, és a határidő már elmúlt.

A férfi végighaladt az alvó falun. A piactéren üresen álltak az árusok asztalai, közöttük káposztaleveleket görgetett a szél, a templom tornya pedig fekete árnyékként emelkedett az ég elé. Az egyik mellékutcánál befordult, elhaladt a kút mellett, aztán annál a háznál állt meg, amelyet keresett.

Az ablak sötét négyszöge visszaverte a hold halvány fényét.

A férfi fellépett a küszöbre, ökölbe zárta a kezét, és háromszor rávert az ajtóra.

Apa még egy darab fát tett a tűzre.

A leány az asztalnál ült, két tenyerével körülfogta a meleg bögrét, és a lángokat nézte a nyitott tűzhely vasrácsa mögött. Az este már régen túlnyúlt a vacsorán; a tányérok elmosva száradtak a polcon, az asztalon néhány morzsa maradt, a korsóban pedig annyi víz, amennyit reggelig egyikük sem fog elfogyasztani.

Apa visszaült vele szemben.

– Emlékszel arra a nyárra, amikor azt hitted, eltűnt a folyó?

A leány elmosolyodott.

– Hatéves voltam.

– Hét.

– Hat.

Apa a szakállába mosolygott.

– Akkor hétnek mondtad magad.

Holnap visszatér a férjéhez, az este pedig ettől különös értéket kapott. Apa minden története olyan lett, mint valami, amit magával vihet, és a leány arra gondolt, milyen természetes könnyedséggel adta neki ez az ember egész életében mindazt, amije volt: időt, munkát, ételt, helyet maga mellett, s most egy egész hetet is, amely alatt egyetlen kérdést sem kellett megválaszolnia addig, amíg maga nem akart beszélni.

– Jó éjszakát, kislányom.

– Megölték a férjemet.

## Az ítélet

A hajnal szürke fénye már végighúzódott a szemközti házak tetején, amikor a bíró felkelt a karosszékből. Az asztalon csonkig égtek a gyertyák, az egyik kanóc körül fekete viaszgyűrű ült, a másik lángja aprón reszketett minden alkalommal, amikor a kinti szél megérintette az ablakot.

A törvénykönyv ugyanott feküdt, ahol este hagyta. Mellette a vallomások összekötött kötege, a felső lap széle kissé felkunkorodott a gyertya melegétől.

A bíró eloltotta a lángot, felvette az iratokat, és átment a hálószobába.

A mosdótál vizét a cseléd már kikészítette. Megmosta az arcát, végighúzta a nedves tenyerét a tarkóján, aztán a tükör elé állt. Borotvája lassan járt az állán, minden húzás után leöblítette a pengét, megtörölte, és ugyanazzal a gondossággal folytatta, ahogyan minden tárgyalási napon.

Fehér inget vett elő.

Begombolta a mandzsettát, megigazította a gallért, felvette a sötét mellényt, majd a kabátot. A tükör előtt két ujjal kisimította a vállán az anyagot, végigsimított az egyik hajtókán, aztán az asztal szélére készített bírói jelvényt a mellére tűzte.

Az ebédlőben kenyér, sajt és egy csésze forró ital várta.

A bíró leült az asztal végéhez. A ház körül lassan ébredt a város. Az utcán végiggördült egy szekér, a kövezet egyenetlenségein megzörrentek rajta az üres ládák; valahol redőnyt csaptak fel, majd a templom felől megszólalt az első harang.

A kenyérből egyetlen szeletet evett.

A csészét két kézzel fogta, amíg a gőz elvékonyodott fölötte, aztán felállt, magához vette az iratokat és elindult.

A piactéren már állították az árusok asztalait. Egy asszony friss zöldséget pakolt kosarakból, a pék előtt két ember várakozott, egy fiú seprűvel hajtotta maga előtt az előző napról maradt szalmát és port. A bíró végighaladt közöttük, a templomnál befordult a bíróság felé vezető utcába.

A terem előtt már sokan vártak.

Amikor megjelent a folyosó végén, a beszélgetések sorra elhalkultak. Néhányan félreálltak az útjából, mások meghajoltak, ő pedig ugyanazzal a rövid biccentéssel fogadta mindegyiküket.

Az írnok az ajtónál várta.

– Mindenki itt van, uram.

A bíró átadta neki a vallomásokat.

– Tegye az asztalra.

Az ajtó kitárult.

Odabent a padsorok ismét megteltek. Ugyanazok az emberek ültek bennük, akik előző nap is végighallgatták a vallomásokat, mellettük olyanok is helyet szorítottak maguknak, akik reggel érkeztek a hírére. A fal mellett állók vállai majdnem összeértek, a hátsó sorból valaki előrehajolt, hogy lásson a többiektől.

A fiatalasszony elöl ült.

Ugyanazt a sötét ruhát viselte, haját ismét összefogta a tarkóján, két kezét egymásba kulcsolta az ölében. Amikor a bíró belépett, felállt a többiekkel, tekintete egy pillanatra találkozott az övével.

Az apa néhány lépéssel távolabb állt.

Nagy kezei most is a teste mellett lógtak, ősz haja rendezetten simult hátra, arca komoran fordult a bíró felé.

A bíró elfoglalta a helyét.

Az írnok letette elé a vallomásokat, melléjük a törvénykönyvet, aztán a terem szélén álló kis asztalhoz ült, tintába mártotta a tollat, és várakozva a papír fölé tartotta.

A padsorok zaja lassan elült.

A bíró kinyitotta a törvénykönyvet.

Ujja megtalálta ugyanazt a bekezdést, amely fölött az éjszaka olyan sokáig időzött.

Aki szándékosan embert öl, életével fizet érte.

A lapot maga előtt hagyta.

– Tegnap meghallgattuk mindazokat, akik ennek az ügynek valamely részéről tudtak beszélni – kezdte. – Hallottuk a feleséget, az apját, a szomszédot és azokat, akik az elhunyt életének más körülményeiről tudtak számot adni.

Az írnok tolla megindult a papíron.

– Meghallgattuk, milyen életet élt a házaspár. Mit tett a férj a feleségével. Mit mondott a feleség, amikor elhagyta. Mit mondott, amikor úgy döntött, hogy visszatér. Hallottuk azt is, ki merre járt azon az éjszakán, és mit tudott elmondani a következő reggelről.

A fiatalasszony ujjai szorosabban fonódtak egymásba.

A bíró tekintete végigsiklott a termen.

– Az éjszaka során újra elolvastam valamennyi vallomást. Egymás mellé tettem mindazt, amit hallottunk. Újra átnéztem a törvény rendelkezését, amely alapján ebben az ügyben döntenem kell.

A teremben olyan csend lett, hogy az ablakon túlról behallatszott egy kocsi kerekeinek zakatolása a kövezeten.

A bíró becsukta a törvénykönyvet.

Tenyerét néhány pillanatig a fedelén tartotta.

Aztán az apára emelte nehéz szemét, és úgy mondta, mintha csak neki szólna:

– Egyértelmű lett számomra, mi történt.</textarea><article id="story-body" class="reader-width story-body"></article><div class="reader-width reader-return"><a class="back-link" href="index.html">← Vissza a Színvaksághoz</a></div></main>
