I. A régi ember
Gellért akkor fordult be a trónteremhez vezető hosszú folyosóra, amikor a délelőtti nap már elérte a nyugati szárny magas ablakait, és a ferdén beeső fény végigcsúszott a páncélja mellrészén, megakadt a vállát borító aranyozott lemezek vésett szélein, majd továbbfutott a mögötte lebegő fehér köpenyen, amelynek két hosszú szárnya járás közben hol közelebb simult egymáshoz, hol szétnyílt a csizmája mögött, mintha minden lépésnél egyetlen pillanatra megmozdulna rajta a hímzett angyalszárny. A köpenyt évekkel korábban készítették számára, amikor átvette a királyi testőrség parancsnokságát, azóta háromszor cserélték rajta a bélést, egyszer az egész alsó szegélyt, a bal vállnál pedig alig észrevehetően sötétebb volt a kelme ott, ahol a páncél csatja esős időben újra és újra hozzáért, mégis ugyanaz maradt a szabása, ugyanaz a széles, ezüstözött kapocs fogta össze a nyakánál, és ugyanaz a két szárny futott végig rajta finom, gyöngyházszín fonallal, amelyek messziről egyszerű fehér mintának látszottak, közelről azonban minden tolluk külön kirajzolódott.
Nem sietett, de nem is sétált, a lába minden lépésnél ugyanakkora távolságot vitt előre, a csizmája sarka határozottan érte a követ, aztán a talp teljes súlya ránehezedett, mielőtt a másik láb elindult volna, és ebben a járásban nem volt semmi abból a kapkodásból, amelyet az ember akkor vesz fel, ha attól fél, hogy elkésik, sem abból a ráérős lassúságból, amellyel az udvar néhány magas rangú embere szerette megmutatni, hogy mások ideje kevésbé fontos az övénél. Gellért pontosan tudta, mikorra várják, tudta, mennyi idő kell a folyosó végéig, hány lépcső vezet a váróteremhez, és azt is, hogy az ajtónálló már akkor jelezni fogja az érkezését, amikor ő még a második boltív alatt jár, ezért nem nézett az ablakokra, nem gyorsított a szolgák között, és nem lassított akkor sem, amikor valamelyik udvari ember félrehúzódott előle.
Ötven felé járt, bár azok, akik először látták páncélban, gyakran néhány évvel fiatalabbnak gondolták, mert a háta még mindig egyenes volt, a vállait nem húzta előre a mellvért súlya, és a derekán viselt kard sem billentette félre a járását, ahogyan azoknál szokta, akik csak ünnepi alkalmakkor öltöttek fegyvert. Az arca hosszúkás volt, az állkapcsa szélesebb, mint fiatalkorában, a borotvált állon már délre megjelent a sötétebb árnyék, amelybe az utóbbi években egyre több ősz vegyült, az orra nyergén pedig egy vékony, világos vonal húzódott ferdén a bal szem irányába, olyan régi seb helye, amelyre ő maga már ritkán gondolt, de amelyet a hozzá közel állók még akkor is észrevettek, ha egyébként alig néztek rá.
A haja sötétbarna maradt a tarkóján és a füle fölött, a halántékán azonban már széles ősz sáv futott hátrafelé, és hiába fésülte minden reggel ugyanabba az irányba, a homloka jobb oldalán mindig kiszabadult egy keskeny tincs, amely néhány órával később előrehajolt, különösen akkor, ha sokáig viselte a sisakot. Most is ott feküdt ferdén a homlokán, alig egy ujjnyira a szemöldökétől, és amikor a folyosó egyik nyitott ablakán át hűvösebb levegő érkezett, a tincs megmozdult, majd visszaült ugyanoda. Gellért nem nyúlt hozzá.
A szeme szürkésbarna volt, olyan színű, amely gyenge fényben sötétnek látszott, napfényben azonban világosabb gyűrű jelent meg a pupilla körül, és amikor valakit nézett, ritkán pislogott közben. Nem bámulta az embereket, nem tartotta rajtuk fölöslegesen a tekintetét, egyszerűen addig nézett, amíg szükségesnek érezte, majd továbbfordult, és ezt a testőrök már az első hetekben megtanulták, mert Gellért pillantása mögött nem kellett hangos kérdésnek következnie ahhoz, hogy valaki észrevegye a ferdén becsatolt övet, a rosszul illeszkedő vállvértet vagy azt, hogy az őrségváltás előtt néhány perccel még mindig nincs a helyén.
A folyosó falán hosszú, sötét szövetek lógtak, rajtuk régi vadászatok, csaták és királyi eskük képei, de Gellért úgy haladt el mellettük, ahogyan az ember a saját házának bútorai mellett megy végig, észlelve őket anélkül, hogy külön figyelmet adna nekik. A harmadik falikárpit előtt két fiatal testőr állt, egyikük arca még alig barnult meg a nyári őrségektől, a másik valamivel idősebb lehetett, és amikor Gellért közeledett, mindketten egyszerre húzták ki magukat. A fiatalabb lábfeje egy árnyalattal kifelé fordult, a kardhüvely pedig túl elöl lógott az övén, így a markolat minden nagyobb lépésnél hozzáért volna az alkarjához, Gellért tekintete egyetlen pillanatra lecsúszott rá, aztán vissza az arcára, a fiú pedig még azelőtt hátrébb igazította a hüvelyt, hogy a parancsnok elhaladt volna mellette.
Gellért továbbment, mert az ilyen apróságoknak megvolt a helyük, ahogyan megvolt a helye a reggeli fegyverellenőrzésnek, a váltások pontos idejének és annak is, hogy a trónterem előtt álló őrök csizmája tiszta legyen még esős napon is. A testőrségben eltöltött harminc év alatt számtalan szabály változott, néhányat ő maga módosított, másokról kiderült, hogy már semmi szükség rájuk, de azt soha nem szerette, ha valaki a rendet a szabályok számával keverte össze, mert számára a rend inkább abból látszott, hogy a megfelelő ember a megfelelő pillanatban tudta, mit kell tennie, és nem kellett minden alkalommal megvárnia, amíg valaki külön megmondja neki.
A jobb kezét menet közben lazán a kard markolatának közelében tartotta, nem rajta, csak olyan távolságban, ahonnan egyetlen mozdulattal elérhette, a bal karja valamivel merevebben mozgott a teste mellett, amit az avatatlan szem talán észre sem vett volna. A bal váll alatt, a mellvért széle mögött régi sérülés húzódott végig a lapockája felé, hideg időben tompán sajgott, hosszabb lovaglás után pedig néha úgy érezte, mintha a régi seb belülről újra megfeszülne, de a mozdulatai ehhez alkalmazkodtak az évek alatt, és már maga sem tudta volna megmondani, mikor kezdte kissé kisebb ívben lendíteni azt a karját.
A váróterem előtti lépcsőnél egy udvari szolga érkezett vele szemben irattekercsekkel a kezében, meglátta Gellértet, félreállt, és olyan gyorsan hajtotta le a fejét, hogy a felső tekercs majdnem lecsúszott a többiről. Gellért egy pillanatra odanyúlt, két ujjal visszatolta a helyére, majd ugyanabban a mozdulatban továbbment, a szolga pedig még néhány másodpercig mozdulatlan maradt mögötte, mielőtt folytatta volna az útját.
A váróteremben többen ültek a fal mellé állított hosszú padokon, mások az ablakok közelében álltak, és azok közül, akik a király elé készültek, néhányan azonnal elhallgattak, amikor Gellért belépett, míg mások csak halkabbra fogták a hangjukat. Egy távolabbi ablaknál két férfi beszélt egymással, egyikük köpenyén még ott ült az út pora, a másik keskeny irattekercset tartott a kezében, és Gellért már túlhaladt rajtuk, amikor az egyik mondatuk vége még utolérte.
A nagyúr végül bevette a déli várost, méghozzá szinte veszteség nélkül, mondta az egyik, mire a másik valamit kérdezett a falakról és arról, meddig maradnak ott a katonák, de Gellért addigra már az ajtónálló előtt állt, aki egyenesebbre húzta magát, majd meghajolt előtte.
A parancsnok itt megállt először azóta, hogy elindult a saját szobájából, és a megállás ugyanolyan pontos volt, mint a járása, egyik lába sem csúszott előrébb, a köpeny szárnyai még egy pillanatig tovább mozdultak mögötte, aztán lassan visszahullottak a páncél két oldalára. Közelről látszott rajta, hogy a mellvértet nem erre az alkalomra fényesítették ki először, az aranyozott szegély néhol vékonyabb lett az évek alatt, a jobb oldalán egy alig észrevehető horpadás maradt egy régi ütés után, a válllemez egyik szegecse pedig valamivel sötétebb volt a többinél, mert azt már egyszer cserélni kellett. A mellkas közepén a királyi címer kisebb változata ült, körülötte az őrség jelével, két egymás felé forduló szárnnyal, és bár a páncél ünnepélyesebb volt annál, amit a közönséges testőrök viseltek, Gellért ugyanebben lovagolt, ugyanebben állt őrséget hosszabb utak során, és ha szükség volt rá, ugyanebben rántott kardot.
Az ajtónálló benyitott, röviden szólt valakinek odabent, majd visszatért, és félreállt az útból.
Gellért megigazította a bal vállán a fehér köpeny csatját, nem azért, mert elmozdult volna, hanem mert minden alkalommal ezt tette, mielőtt belépett a királyhoz, aztán egy pillanatra végighúzta hüvelykujját a kard markolatának simára kopott bőrén, és átlépett a küszöbön.
A trónterem tágasabb volt a folyosóknál, a magas ablakokon több fény érkezett be, a kövek világosabbak voltak, az emberek hangja pedig elveszett a mennyezet alatt, de Gellért ebből először csak azt látta, amit mindig keresett, amikor belépett valahová: az ajtók helyét, az őröket, az ablakokat, a falak mellett álló embereket és azt a széles, világos teret, amely a bejárattól a terem túlsó végéig vezetett.
Aztán fölemelte a tekintetét Márton király felé, és elindult hozzá ugyanazzal a nyugodt, határozott lépéssel, amellyel végigjött a vár folyosóin.

II. A rend
Márton nem ült a trónon, amikor Gellért odaért hozzá, hanem néhány lépéssel előtte állt az egyik hosszú asztal mellett, amelyre az aznapi jelentéseket és kérvényeket készítették ki, egyik kezében felbontott levéllel, a másikkal az asztal szélére támaszkodva, és bár a terem végében várakozók számára még mindig ugyanaz az uralkodó volt, akinek jelenlétében halkabbra fogták a hangjukat, Gellért már messziről észrevette rajta azokat az apró változásokat, amelyek fölött mások könnyen átsiklottak. A király bal lábára valamivel több súlyt tett, mint a jobbra, mert az utóbbi hetekben fájt a térde, az olvasáshoz közelebb emelte a levelet az arcához, a vörös köpeny alatt pedig egyszerűbb ruhát viselt annál, amit a délelőtti audienciákra szoktak ráadni, mintha az öltöztetője már tudná, hogy Márton előbb-utóbb úgyis leveti a nehezebb felső réteget, ha túl sokáig kell az asztalok között állnia.
Gellért néhány lépéssel előtte megállt, meghajtotta a fejét, és csak addig maradt így, ameddig a tisztelet megkívánta, mert köztük régen nem volt szükség hosszabb szertartásra. Márton letette a levelet, ráemelte a tekintetét, és az arcán egy pillanatra megjelent az a halvány, alig észrevehető változás, amelyet Gellért másoktól talán észre sem vett volna, nála azonban pontosan ismert: a szem körüli izmok meglazultak, a száj sarka kissé feljebb mozdult, aztán a király már intett is az asztal mellett álló írnoknak, hogy várjon odébb.
Gellért az éjszakai őrségről, a keleti kapunál történt váltási hibáról és két újonnan érkezett testőr kiképzéséről beszélt, röviden, fölösleges részletek nélkül, úgy, ahogyan évek óta tette, és Márton ugyanúgy hallgatta, ahogyan más jelentéseket is, csak Gellért mellett ritkábban kérdezett vissza, mert tudta, hogy ha valami hiányzik, annak oka van. Az egyik fiatal őr az előző este késve érkezett a helyére, mert a konyha mögötti udvarban összeverekedett egy szolgával, a másik váltás ezért néhány percig nem volt teljes, és mire Gellért megtudta, már mindkettőjüket leváltották, a későt pedig három napra a külső fal éjszakai őrségébe osztotta, ahol a szél még nyáron is végigfutott a kövek között, ősszel pedig úgy ült bele az ember ruhájába, hogy reggelre a csontjai is hidegek lettek.
Márton rövid ideig nézte, mintha mondani akarna valamit, aztán csak arra kérdezett rá, hogy a másik fiú miért maradt szolgálatban, Gellért pedig elmondta, hogy ő időben érkezett, és nem volt oka ugyanúgy büntetni. A király bólintott, majd visszanyúlt a levélhez, amelyet érkezésekor olvasott, a jelentés ezzel véget ért, és Gellért már fél lépéssel hátrébb húzódott, amikor Márton mégis megállította azzal, hogy a külső falnál éjszakára esőt jósolnak, mire Gellért csak annyit felelt, hogy a fiú kapott viaszolt köpenyt.
A király erre már valóban elmosolyodott, aztán továbbengedte.
Az ilyen beszélgetésekből az udvarban gyakran többet értettek bele azok, akik csak a végét látták, mint amennyi valójában történt, mert Gellért nem magyarázott hosszan, Márton pedig ritkán javította ki előtte mások előtt, így azok, akik a terem széléről figyelték őket, könnyen azt gondolhatták, hogy közöttük minden kérdésben teljes egyetértés van. Gellért maga sem gondolta ezt így, csak azt tudta, hogy a király döntéseit nem az ő dolga vitatni, az ő feladata az volt, hogy a döntések mögött legyen valaki, aki végrehajtja őket, és ha Márton valamiben enyhébb volt, mint ő lett volna, azt ugyanúgy elfogadta, ahogyan azt is, amikor fiatalabb korukban a király egyetlen mondattal küldött három embert börtönbe, akiknek az ügyét más talán napokig vizsgálta volna.
Az udvarban azonban az emberek gyorsan tanultak abból, amit láttak, és még gyorsabban abból, amit nem láttak. A testőrök tudták, hogy Gellért nem szereti a késést, ezért a váltások idővel egyre pontosabbak lettek, a kisebb tisztek tudták, hogy a parancsnok nem fogadja el a részegséget szolgálat előtt, ezért egyre ritkábban kellett emiatt embert leváltani, és amikor egy őr néhány nappal később elaludt az északi toronyban, a szolgálatvezető már maga szabott ki rá büntetést anélkül, hogy Gellért elé vitte volna az ügyet. A büntetés szigorúbb lett annál, amit a testőrparancsnok talán első alkalommal választott volna, de amikor a jelentésben meglátta, nem javította át, mert az alvó őr valóban hibázott, és a toronyból éjszaka olyan utat lehetett belátni, amelyen ellenség ugyan évek óta nem járt, de attól még őrizni kellett.
Márton ugyanabban az időben elengedte egy istállófiú büntetésének felét, mert a gyerek három napja alig aludt egy beteg ló mellett, és amikor a fáradtságtól elejtett egy ezüstveretes kantárt, amelynek egyik csatja eltört, a gazdasági felügyelő kártérítést akart levonni a béréből. A király a törött csatot maga is megnézte, meghallgatta az istállómestert, aztán a javítást a királyi számlára íratta, a fiút pedig visszaküldte a ló mellé, mert az állat még mindig lázas volt. Az ügy estére már úgy terjedt a szolgák között, hogy Márton jó kedvében volt azon a napon, a testőrök között viszont senki nem kapcsolta össze azzal, ahogyan Gellért néhány órával korábban három nap hideg őrséget adott a késő fiúra.
Gellért sem kapcsolta össze.
A király kegyelmét mindig a király jogának tartotta, ugyanúgy, ahogyan a maga feladatának azt, hogy ne minden apró vétség jusson el a trónig. Ha Mártonnak kellett volna döntenie minden elalvó őrről, minden elveszett kulcsról, minden késve érkező szolgáról és minden összeverekedő katonáról, nem maradt volna ideje arra, amiért király volt, ezért Gellért természetesnek vette, hogy az ilyen ügyeket azok rendezik, akik közelebb állnak hozzájuk, és azt is, hogy a rendnek olykor keményebbnek kell lennie annál, mint amilyennek az uralkodó egyetlen ember arcát látva választaná.
A testőrparancsnok saját emberei között sem tett kivételt. Ha a hajnali gyakorlathoz ő adott időpontot, ő érkezett elsőként, ha esőben kellett végigjárni a külső falakat, köpenye ugyanúgy átázott, mint a többieké, ha pedig valamelyik fiatalabb testőr panaszkodott a hosszú szolgálatra, Gellért nem azért hallgattatta el, mert élvezte a fáradtságát, hanem mert maga is ugyanannyi órát töltött fegyverben, és nehezen értette, miért kérne másnak olyasmit, amit önmagától nem követelne meg. A bal vállában ilyenkor gyakran erősebben jelentkezett a régi fájdalom, különösen hideg hajnalokon, amikor a köpeny alatt is megült a nedvesség, mégsem látta értelmét annak, hogy ezt bárkinek megemlítse, mert a seb régen begyógyult, a karja működött, és ami működött, arról nem kellett beszélni.
Márton ezt a tulajdonságát mindig is becsülte benne.
A király az évek során sok olyan embert látott maga körül, aki a kötelességről nagyobb hangon beszélt, mint amilyen súlyt valójában elbírt belőle, Gellért azonban ritkán mondta ki magát a szót, és amikor a király hosszabb útra indult, ő ellenőrizte utoljára a lovakat, ő nézte végig a szállásokat, ő maradt ébren akkor is, amikor mások már lefeküdtek, és ha valami baj történt, Márton gyakran csak akkor tudta meg, amikor már megoldották. Ettől a király számára Gellért jelenléte az évek alatt olyan lett, mint az ajtó mögötti zár vagy a falban futó gerenda, amelyre nem gondol minden nap az ember, mert éppen az bizonyítja a működését, hogy nem kell gondolni rá.
A testőrparancsnok ezt másképp látta. Számára Márton nem az az öregedő férfi volt, aki délutánonként néha megdörzsölte fájó térdét az asztal alatt, vagy aki egy istállófiúnak elengedett néhány heti bért, hanem ugyanaz az ember, akihez harminc évvel korábban felesküdött, csak több ősz hajjal és több teherrel a vállán. Gellért emlékezett arra, milyen gyorsan tudott a fiatal király dühbe jönni, milyen keményen büntette az árulást, mennyire gyűlölte a gyávaságot, és bár azóta Márton ritkábban emelte föl a hangját, Gellért ezt nem gyengeségnek vagy változásnak látta, hanem annak, hogy az uralkodónak már nincs szüksége arra, hogy minden alkalommal maga mutassa meg, hol húzódik a határ.
A határokat mások tartották meg helyette.
Gellért ezek közül az egyik volt.
Így telt el az ősz első része, az udvaron új emberek jelentek meg és mások távoztak, követek érkeztek a környező birtokokról, a váróteremben reggelente ugyanúgy megteltek a padok, és a folyosókon ugyanazok a félbehagyott beszélgetések maradtak az ember mögött, amikor továbbment. Egy délelőtt Gellért két írnok mellett haladt el, akik iratkötegeket vittek a déli szárny felé, és az egyik éppen arról beszélt, hogy a folyóparton megint két halott fiatalt találtak, egymástól alig néhány ölnyire, a másik valamit kérdezett arról, hogy ugyanaz a révész találta-e meg őket, mint az előzőt, de Gellért addigra már a lépcsőn járt, ahol az egyik új testőr rossz kézzel tartotta a lándzsát, ezért egy pillanatra megállt mellette, elfordította a fegyver nyelét a fiú markában, majd folytatta az útját.
Néhány nappal később Márton ugyanazon a folyosón haladt végig, csak lassabban, mert két követ várta a váróteremben, előtte pedig még beszélni akart a gazdasági felügyelővel. A testőrök tisztelegtek, a szolgák félrehúzódtak, a király pedig közben megállt egy asszonynál, aki kérvényt szorongatott a kezében, mert az asszony olyan gyorsan próbált meghajolni előtte, hogy majdnem elejtette a papírt. Márton fölemelte neki, néhány szót váltott vele, aztán a kérvényt saját kezével adta az egyik írnoknak, és amikor továbbment, mögötte az asszony még mindig ugyanott állt, mintha nem értené, hogyan került vissza ilyen gyorsan a papír nélküli keze a teste mellé.
Gellért a folyosó túlsó végéről látta mindezt, és mire a király odaért hozzá, már arról beszélt neki, hogy az északi őrséghez két új ember kell, mert az egyik testőr apja meghalt, és a férfi néhány napra hazament a temetésre. Márton arra kérte, hagyja annyi ideig, ameddig szükséges, Gellért pedig bólintott, mert számára az ilyen kérés nem változtatott meg semmit abból, amit a rendről gondolt; a fiú apja egyszer hal meg, az őrséget pedig addig is be lehet tölteni mással.
A következő héten azonban egy másik testőr engedély nélkül hagyta el a várat, mert hírt kapott arról, hogy a felesége vajúdik, és mire visszatért, Gellért már tudta, hogy az éjszakai szolgálatát valaki másnak kellett átvennie. A férfi nem tagadta, hová ment, és nem próbált kifogást keresni, Gellért pedig végighallgatta, majd egy hónapra elvette tőle a kapuőrséget, és a raktárak mellé osztotta szolgálatra, ahol kevesebb bizalmat igénylő feladat várt rá, hosszabb órákkal és kevesebb megbecsüléssel.
Az ügy nem jutott Márton elé.
Amikor mégis meghallotta néhány nappal később az egyik tiszttől, csak azt kérdezte, megszületett-e a gyermek, aztán amikor megtudta, hogy fiú lett és mindketten jól vannak, annyit mondott, küldjenek valamit a családnak a konyháról. A tiszt ezt továbbadta Gellértnek is, aki gondoskodott róla, hogy kenyér, hús és egy kis korsó bor eljusson hozzájuk, miközben a férfi büntetésén nem változtatott, mert az egyiknek semmi köze nem volt a másikhoz.
Az udvarban azonban ezek az apró történetek egymás mellé kerültek, a király ajándékot küldött a gyermeknek, a testőrparancsnok egy hónapra levette az apát a kapuról, és mire a történet eljutott a konyháig, már úgy szólt, hogy Márton kegyes volt, Gellért pedig rendet tartott, mintha a kettő ugyanannak a döntésnek két természetes része volna.
A tél közeledtével egyre kevesebben emlékeztek arra, melyikük mit mondott valójában.

III. A kéz
A tél első heteiben a várudvar korábban sötétedett el, a kapuknál már délután meggyújtották a fáklyákat, a szolgák vastagabb köpenyben vitték át a vizet egyik épületből a másikba, a konyhából erősebben érződött a főtt hús és a fűszerek illata, a raktárak ajtajai pedig egyre rövidebb időre maradtak nyitva, mert minden felnyitásnál hideg levegő tört be a száraz gabona, a sózott hús és a liszteszsákok közé, ahol a gazdasági emberek már hetek óta számolták, mennyi marad tavaszig, melyik birtokról érkezhet még szállítmány, és miből kell takarékosabban osztani, ha a hó hamarabb zárja el az utakat.
Az eltűnt készletet először egy raktári írnok vette észre, néhány font szárított hús és két kisebb zsák liszt hiányzott, olyan mennyiség, amely egyetlen napi számadásban könnyen elveszhetett volna, ha másnap nem hiányzik újabb adag, majd harmadnap egy kisebb korsó zsír is, és mire az ügy Gellérthez került, a raktáros már végignézte a kulcsokat, a szolgálati beosztást és azokat az embereket, akik az esti zárás után a hátsó folyosón járhattak. A nyom végül egy fiatal testőrhöz vezetett, aki három éve szolgált a várban, kétszer teljesített őrséget a király közvetlen lakosztálya előtt, egyszer részt vett egy hegyi úton, ahol két napig hóban kellett vezetniük a lovakat, és akiről addig egyetlen olyan feljegyzés sem készült, amelyet Gellértnek meg kellett volna jegyeznie.
A férfi nem tagadta a lopást, amikor elé állították, és nem próbált másra mutatni, csak annyit mondott, hogy a falon kívül élő anyja és két húga hetek óta alig jutott húshoz, a tél pedig hamarabb érkezett, mint számították, ezért először egy kevés lisztet vitt ki a köpenye alatt, aztán amikor semmi nem történt, visszament még egyszer, később harmadszor is. Gellért végighallgatta, megkérdezte, adott-e belőle másnak, eladott-e bármit, segített-e neki valaki a raktárban majd, amikor a férfi mindenre felelt, elküldte, és a délután hátralévő részében ugyanúgy folytatta a munkáját, ahogyan más napokon, ellenőrizte a kapuőrség névsorát, végignézett két új lándzsát, amelyek nyele túl könnyűnek tűnt, aztán egy rövid jelentést íratott az ügyről, amely másnap reggelre Márton asztalára került.
A király aznap a kisebb tanácsteremben dolgozott, ahol a falak közelebb húzódtak egymáshoz, mint a trónteremben, az ablakok alatt vastag párkány futott végig, a kandallóban pedig olyan erősen égett a tűz, hogy a helyiség egyik fele meleg volt, a másikban mégis megmaradt a kőfal hidege. Márton az asztalnál ült, előtte három felbontott levél, két viaszos tábla és egy keskeny térkép feküdt, amelynek egyik sarkát bronzpénzzel nehezítették le, a jobb kezén pedig vékony tintafolt húzódott végig a mutatóujj oldalán, mert az írnok érkezése előtt maga javított bele az egyik levél szövegébe.
Gellért a szokott időben lépett be hozzá, díszes páncélja fölött most vastagabb fehér köpenyt viselt, amelynek bélése a nyaknál kissé felgyűrődött, és amikor megállt az asztal előtt, a bal vállát egy alig látható mozdulattal hátrébb húzta, ahogyan hideg napokon gyakran tette. Márton a jelentés fölött nézett rá, előbb az arcára, aztán arra a régi, szinte észrevétlen tartásra, amelyet más talán egy rosszul illeszkedő páncél számlájára írt volna, ő azonban pontosan tudta, honnan ered.
Gellért röviden elmondta a lopást, az eltűnt készletet, a vallomást és azt is, hogy a férfi családjához került az étel, majd ugyanazzal a hanggal, amellyel máskor szolgálati váltásról vagy őrhelycseréről számolt be, közölte, hogy a királyi raktár ismételt meglopásáért a rend szerint a jobb kéz elvesztése jár, a végrehajtást délre tűzte ki, mert addig még van idő megváltoztatni az ítéletet, ha Márton úgy kívánja.
A király keze a viaszos tábla fölött maradt, a hüvelykujja éppen egy mélyebbre nyomott betű szélét érintette, miközben Gellért előtte állt, nyugodtan, egyenes háttal, a kardja a megszokott helyen, a fehér köpeny két szárnya mozdulatlanul hullott alá mögötte, és a bal vállánál a vastagabb anyag alatt még mindig kirajzolódott az a kis különbség a két oldal között, amelyet Márton harminc éve ismert.
Akkor még nem volt rajta fehér köpeny, csak sötétkék posztóruha és könnyebb mellvért, a haja feketébb volt a szénnél és hosszabban ért a homlokába, ahol ugyanaz a makacs tincs hajlott előre, amelyet később az ősz sem tudott megszelídíteni, a szája keskenyebbnek látszott a fiatalabb arcon, a szeme pedig világosabb volt, mert a szem körüli bőr még simán feküdt, és amikor Márton először meglátta őt a nagy udvaron, Gellért olyan gyorsan mozgott a többiek között, mintha a páncélja nem súlyt, hanem formát adna neki.
Márton maga is alig múlt huszonöt, sűrű, sötétbarna haja a füle fölött göndörödött, a tarkóján túl hosszúra hagyták, mert nem tűrte, hogy az udvari borbély minden héten hozzányúljon, a homlokának bal oldalán pedig egy vékony hajtincs újra és újra a szemébe hullott, amelyet türelmetlen mozdulattal söpört hátra, majd néhány perc múlva ugyanott talált. Az arca még keskenyebb volt, az állán csak rövid szakállt viselt, mert attól idősebbnek gondolta magát, a szeme sötétebbnek látszott a fiatal arc élénksége mellett, és olyan gyorsan fordította a fejét minden új hang felé, mintha attól tartana, hogy egyetlen pillanat alatt történhet valami, amiről neki tudnia kell. A kardot mindig maga hordta, akkor is, ha a tanácsba ment, a köpenyét gyakran levette és egy székre dobta, ha melege lett, és amikor dühös volt, nem emelte sokáig a hangját, mert rendszerint hamarabb mondta ki a döntést annál, hogy bárki végighallgathatta volna, milyen érvek vezettek hozzá.
Azon a napon a nagyudvar megtelt lovakkal és emberekkel, követek készültek indulni, az északi kapu felől fegyveresek érkeztek, a fal mellett szolgák vitték át a ládákat, és Márton éppen egy idősebb főúrral beszélt, amikor az első kiáltás valahonnan a kapu mögül érkezett. A hangot előbb csak néhány fej követte, aztán valaki félrelökött egy őrt, fém villant két ember között, és mire Márton teljesen odafordult, már látta a férfit, aki olyan gyorsan tört előre a tömegen keresztül, hogy senkinek nem maradt ideje megérteni, honnan került oda.
A király keze a kardjához indult, de a penge még félig sem hagyta el a hüvelyt, amikor Gellért oldalról elé lépett, nem kiáltott, nem fordult vissza hozzá, csak egyetlen hosszú mozdulattal közéjük került, és a támadó kardja a bal vállánál csúszott be a mellvért széle alá. A fém hangja tompább volt, mint Márton addig bármikor hallotta, Gellért teste félfordulatnyit mozdult az ütéstől, a fekete hajába belekapott a szél, aztán a jobb kezével már kirántotta a saját kardját, miközben a bal karja lefelé zuhant, és mire a körülöttük álló őrök elérték a támadót, a fiatal testőr még mindig a király előtt állt.
Márton később sok részletre nem emlékezett abból, ami utána történt, csak arra, hogy Gellért vére végigfolyt a mellvért oldalán, aztán a könyökénél csöpögni kezdett a kövekre, a feje egy pillanatra hátrabillent, amikor két ember megfogta, és a makacs hajtincs, amely egész délelőtt a homlokába hullott, akkor rátapadt az izzadt bőrére. Emlékezett arra is, hogy amikor lefektették, Gellért még megpróbált fölülni, mert Márton túl közel állt hozzá, és az első kérdése nem a saját sebe volt, hanem az, hogy a király megsérült-e.
Három napig nem tudták biztosan, életben marad-e.
Márton mindhárom napon bement hozzá, néha hajnalban, néha éjszaka, amikor már senki nem várta volna, hogy ott legyen, és látta a mindig egyenes férfit mozdulatlanul feküdni a fehér lepedők között, a vállát vastag kötés borította, az arca sápadtabb volt a párnánál, a haja pedig először feküdt rendezetlenül úgy, hogy senki nem próbálta visszasimítani. A király akkor még alig értette, hogyan lehet valaki egyik pillanatban erősebbnek látszó ember mindenkinél az udvarban, a következőben pedig annyira törékeny, hogy egy gyógyító azt mondja róla, reggelig talán már nem lesz szüksége új kötésre.
Gellért a negyedik reggelen lázas volt, de élt, egy héttel később már felült, két hónap múlva visszatért könnyebb szolgálatra, és amikor Márton először látta újra páncélban, a bal karját még szorosabban tartotta a testéhez, mint most harminc évvel később, a válla fölött azonban ugyanúgy állt a feje, a szeme ugyanúgy nézett rá, és semmi nem volt benne abból, hogy úgy tekintene arra a napra, mint valamire, amiért a király tartozik neki.
Márton gondolt rá így.
Az évek alatt ritkábban, aztán megint gyakrabban, amikor Gellért valamelyik régi sebe megfájdult, amikor hosszabb út után észrevette rajta a merevebb mozdulatot, vagy amikor a parancsnok levette a mellvértjét, és a bal váll fölött még mindig látható volt a széles, szabálytalan heg, amelyet a kard hagyott rajta. Márton soha nem kérdezte meg, bánja-e, hogy elé állt, mert a kérdés értelmetlennek tűnt annak az embernek a közelében, aki azóta is úgy viselkedett, mintha azon a napon egyszerűen azt tette volna, amit tennie kellett.
A kandallóban egy fahasáb megroppant, és Márton tekintete visszatért a kisebb tanácsteremhez, a viaszos táblához, a bronzpénzzel lefogott térképhez és ahhoz a helyhez az asztal előtt, ahol Gellért állt.
Csakhogy Gellért már nem volt ott.
Az ajtó zárva volt, az asztal mellett várakozó írnok ismét a kezében tartotta az iratokat, és a király néhány pillanatig úgy nézett a helyre, mintha csak azt próbálná felidézni, mikor hajtotta meg a fejét a parancsnok és mikor engedte el, aztán az udvar felől rövid zaj hallatszott, néhány ember hangja, egy ajtó csapódása, majd ugyanaz a téli csend állt vissza, amelyben a kinti lépések keményebben verődtek vissza a kövekről.
Márton felállt az asztaltól, a jobb térde egy pillanatra megfeszült, amikor ránehezedett, aztán az ablakhoz ment, ahol a vastag üveg mögött szürkén feküdt a várudvar, a falak tövében megmaradt az előző esti hó, középen emberek indultak szét kisebb csoportokban, és két testőr között egy fiatal férfit vezettek át a gyengélkedő felé, a jobb karját vastag, sötétedő kötésben tartva a mellkasához.
Gellért néhány lépéssel mögötte haladt, fehér köpenye világosan mozgott a téli udvar szürkeségében, a bal vállánál ugyanazzal a kissé rövidebb mozdulattal lendülve, amelyet Márton harminc éve ismert, majd a parancsnok a gyengélkedő ajtajánál megállt, megvárta, amíg a férfit bevezetik, és csak azután fordult vissza a testőrség épülete felé.
A király még egy ideig az ablaknál maradt, aztán visszament az asztalhoz, ahol az írnok már a következő levelet tartotta készen, a viaszos táblán pedig a délelőtti ügyek közül még hat sor várt rá.

IV. Ami működik
A tél hátralévő részében az udvar élete ugyanúgy folyt tovább, ahogyan addig, a kapuk reggel kinyíltak, este bezárultak, a konyhák füstje ráült a hideg levegőre, a testőrök váltották egymást a falakon, az írnokok viasztáblákat és tekercseket vittek egyik szobából a másikba, és mire az első hó elolvadt a déli fal tövében, az a fiatalember, akinek jobb kezét a királyi raktár meglopásáért levágták, már ritkábban került szóba annál, mint amit az első napokban bárki gondolt volna. A raktárból nem tűnt el több étel, az őrség tagjai pontosabban adták át a kulcsokat, a szolgálati naplókban kevesebb javítás maradt, és amikor Gellért egy reggelen végignézte az előző hónap fegyelmi ügyeit, három olyan sort talált, amely mellé korábban valamilyen büntetés került volna, most azonban csak egy figyelmeztetés, egy helycsere és egy elmaradt kimenő szerepelt, mert a legtöbb ember már azelőtt rendbe tette a maga dolgát, hogy abból ügy lett volna.
A testőrség folyosóin halkabban jártak éjszaka, a váltás előtt senki nem maradt a konyha környékén, a raktári ajtóknál két ember ellenőrizte egymás után a zárat, és azok a fiatalabb tisztek, akik korábban még minden kisebb vétséggel Gellérthez fordultak, lassan maguk kezdtek dönteni, mert a parancsnok évek óta ugyanazokat a határokat tartotta előttük, és egy idő után már nem kellett minden esetnél külön megkérdezni, meddig lehet elmenni. Gellért ezt jó jelnek tekintette, nem azért, mert kevesebbet kellett foglalkoznia az embereivel, hanem mert szerinte egy jól működő őrségben annak is tudnia kell a dolgát, aki éppen nincs a parancsnok szeme előtt, és ha valaki csak akkor viselkedik rendesen, amikor figyelik, akkor még nem tanulta meg, miért viseli a király jelét a mellén.
A saját napjai közben ugyanúgy teltek, mint korábban, hajnalban végigjárta a külső őrhelyeket, délelőtt jelentett Mártonnak, délután a kiképzést nézte, este pedig még egyszer végigment azon a folyosón, amely a király lakosztályához vezetett, és ahol az őrök már messziről fölismerték a járását a csizma egyenletes koppanásáról. A fehér köpeny télen vastagabb bélést kapott, tavasszal újra könnyebbre cserélték, a bal vállánál a csat ugyanott feküdt, a homlokára hulló keskeny tincs egyre több ősz hajszálat vitt magával, és amikor hosszabb ideig állt egyhelyben, néha a jobb lábára helyezte a súlyát, hogy a régi sérülés kevésbé húzza a vállát, aztán ugyanazzal a mozdulattal indult tovább, mintha a testében minden fájdalomnak meglenne a maga helye, amelyet nem kell külön megnevezni.
Márton közben egyre több olyan ügyet engedett el, amelyet fiatalabb korában talán tovább vitt volna, egy kereskedőt, aki késve fizette be az udvarnak járó vámot, részletekben hagyott törleszteni, egy szolgát, aki részegen tört össze két drága tálat, visszaküldött a konyhára azzal, hogy a kárt majd levonják a béréből, egy idős katonának pedig, aki harmadszor kérte ugyanazt a földdarabot a fia számára, végül maga íratott olyan levelet, amelyet az intézők már nem tudtak félretenni. Ezek az ügyek külön-külön futottak végig az udvaron, egyikből beszélgetés lett a konyhán, másikból elégedetlen morgás az írnokok között, a harmadikat néhány nap alatt elfelejtették, és Gellért számára egyik sem változtatott azon, hogy a király dolga kegyelmet gyakorolni ott, ahol annak helye van, az övé pedig az, hogy addig is olyan rendet tartson, amelyben Mártonnak ne kelljen minden reggel ugyanazokat a hibákat újra meghallgatnia.
Az udvarban mások is így látták, csak valamivel egyszerűbben fogalmazták meg maguknak, és mire a következő nyár elérte a várfalakat, a fiatal testőrök már úgy tanulták meg az első hetekben, hogy Gellért mellett nincs késés, nincs részeg szolgálat, nincs elhagyott őrhely, mintha ezek mindig is ugyanilyen természetes szabályai lettek volna a királyi udvarnak. A régebbi szolgák közül néhányan még emlékeztek Márton fiatalabb éveire, arra, amikor egy rossz hír után végig lehetett hallani a hangját a trónterem előtti folyosón, vagy amikor egyetlen délután alatt három tisztet váltott le, mert valamelyik határvidéki erőd ellátása késett, de az újabbak már csak azt a királyt ismerték, aki inkább kétszer kérdezett vissza, mielőtt döntött, ritkán emelte föl a hangját, és mégis olyan udvarban éltek, ahol a legtöbb ember biztos volt benne, hogy a király a rend dolgában nem tűr engedményt.
Gellért ennek a rendnek látható alakja lett anélkül, hogy valaha is így gondolt volna magára, és a fehér köpeny lassan többet jelentett azoknak, akik a folyosón szembejöttek vele, mint a páncélon viselt rangjelzés, mert a köpenyt messziről észre lehetett venni, a szolgák már a sarkon túl felismerték, a fiatal őrök egyenesebben álltak, ha meglátták, az udvari tisztek pedig tudták, hogy ha Gellért egyszer valamit lezárt, ritkán érdemes ugyanazzal az üggyel másnap újra elé állni. Ő ebből leginkább annyit érzékelt, hogy kevesebben magyarázkodnak, több jelentés fér rá egy délelőttre, és az emberei egyre gyakrabban oldják meg maguk között azt, amit korábban még neki kellett.
Egy alkalommal egy szolgálatvezető két napra a külső kapuhoz osztott egy testőrt, mert az a gyakorlótéren tréfából meglökte a társát egy lándzsanyéllel, és a másik elesett, miközben a király éppen az udvar másik oldalán haladt át. Márton látta, hogyan vezetik el a fiút a gyakorlótérről, később megkérdezte az egyik tiszttől, mi történt, majd amikor meghallotta, annyit mondott, hogy legalább senki nem sérült meg komolyabban, és továbbment. A szolgálatvezető estére már úgy adta tovább az esetet, hogy a király tudott róla és nem emelt kifogást, Gellért másnap csak a szolgálati jegyzékben látta a helycserét, a fiatal testőr pedig két nap múlva visszatért a gyakorlótérre, ahol többé nem lökött meg senkit lándzsával.
Márton időnként észrevette, hogy olyan döntéseket is hozzá kötnek, amelyeket nem ő hozott, de ezek többnyire olyan apróságok voltak, amelyek miatt nem akart külön embert magához rendelni, mert akkor még több szó esett volna róluk, mint amennyit megértek. Egy alkalommal az egyik udvari szakács azzal köszönte meg neki, hogy Gellért nem záratta be három napra a borospincébe, mintha Márton személyesen járta volna ki a büntetés enyhítését, máskor egy fiatal írnok hajolt meg előtte túl mélyen azért, mert a testőrparancsnok engedte, hogy az apja temetésére egy nappal korábban induljon el, és a király mindkét alkalommal csak bólintott, mert nem látta értelmét annak, hogy az udvar folyosóján magyarázza el, ki döntött miről.
Gellért közben ugyanezeket az apró királyi gesztusokat úgy látta, ahogyan mindig: Márton megőrizte magának azt a jogot, hogy ott legyen kegyes, ahol a körülmények indokolják, ő pedig azért tartotta szigorúbban a határokat, hogy a kegyelem ne váljon azzá, amire mindenki előre számít. Ebben semmi ellentmondást nem érzett, ahogyan abban sem, hogy a fiatal testőr családja, amely miatt a lopás történt, a következő hónapokban rendszeresen kapott lisztet a királyi konyháról, mert Márton utólag meghallotta, milyen helyzetben élnek, és úgy rendelkezett, hogy a tél végéig segítsék őket. Gellért maga ellenőrizte, hogy a szállítmányok eljutnak-e hozzájuk, a raktári írnok minden alkalommal aláíratta az átvételt, a készletet pontosan vezették, és ettől kezdve senkinek nem kellett titokban kivinnie belőle semmit.
A félkezű fiatalember tavasszal már új munkát kapott a várban, mert kardot és lándzsát ugyan nem tudott úgy használni, mint korábban, a számokhoz viszont értett, és a raktár egyik idősebb írnoka mellé került, ahol a bal kezével lassabban ugyan, de megtanulta vezetni a viaszos táblákat, később a pergamenre is olvasható betűket rajzolt, és amikor valaki először tréfát próbált csinálni abból, hogy éppen ott dolgozik, ahonnan egykor lopott, a raktáros olyan pillantást vetett rá, hogy a mondat félbemaradt. Gellért néhány hét múlva találkozott vele a folyosón, a férfi félreállt előle, bal kezével ügyetlenebbül tisztelgett, mint korábban a jobbal, Gellért pedig megállt egy pillanatra, megnézte az iratköteget a hóna alatt, megkérdezte, boldogul-e vele, majd amikor azt hallotta, hogy igen, továbbment.
A király ezt a találkozást nem látta.
A nyár végén Márton és Gellért együtt indultak egy közeli birtokra, ahol a folyó áradása két hidat is megrongált, és a háromnapos út alatt többször maradtak kettesben annál, mint az előző hónapokban összesen, mégsem került szóba a kézlevágás, ahogyan annyi más régi ügy sem, amelyet mindketten ismertek. Beszéltek az utak állapotáról, a testőrség lovairól, az egyik új tisztről, akinek túl sokáig tartott dönteni, a király térdéről, amely hosszabb lovaglás után megdagadt, és Gellért válláról is, mert egy esős reggelen Márton észrevette, hogy nehezebben emeli a bal karját a kengyelhez. Gellért erre csak annyit mondott, hogy hidegfront jön, Márton pedig nevetett azon, hogy a parancsnok vállából lassan jobb időjós lett, mint az udvari csillagászokból.
Aznap este egy kisebb fogadó udvarán vacsoráztak, mert a következő birtokig már nem értek volna el sötétedés előtt, és Márton sokáig nézte Gellértet a tűz túloldaláról, ahogy a férfi a jobb kezével kenyeret tört, a bal karját pedig valamivel közelebb tartotta a testéhez, miközben a fehér köpeny a pad háttámláján feküdt, az angyalszárnyak hímzése összegyűrődve futott végig rajta. Gellért észrevette a pillantást, kérdőn fölemelte a szemöldökét, Márton azonban csak a boroskancsó felé nyúlt, töltött mindkettőjüknek, és másról kezdett beszélni.
A következő években az udvarban egyre kevesebben szolgáltak azok közül, akik még látták a fiatal királyt és a fiatal Gellértet, a régi történetek rövidebbek lettek, a részletek lekoptak róluk, a merényletből annyi maradt, hogy a testőrparancsnok egyszer megmentette Márton életét, a vállán viselt heg pedig azoknak, akik hallottak róla, ugyanúgy hozzátartozott a férfihoz, mint a fehér köpeny vagy a homlokára hulló tincs. Az új testőrök már úgy érkeztek, hogy Gellért nevét előbb ismerték, mint az arcát, a királyról pedig azt tanulták, hogy igazságos, de a szolgálat dolgában szigorú, és amikor valamelyikük megkérdezte, honnan tudják ezt, rendszerint valaki egy korábbi büntetést, egy régi esetet vagy egyszerűen Gellért nevét mondta válaszul.
Márton haja közben szinte teljesen ősz lett a halántékánál, a homlokára hulló régi tincs vékonyabbá vált, de még mindig ugyanoda esett, ha sokáig hajolt a levelek fölé, és egyre gyakrabban tolta vissza lassú mozdulattal ahelyett, hogy türelmetlenül félresöpörte volna, ahogyan fiatalon tette. Gellért haja is világosodott, a szürkésbarna szem körül mélyebb vonalak jelentek meg, a szája két oldalán pedig olyan ráncok futottak lefelé, amelyek még nyugalomban is komolyabbá tették az arcát, miközben a járása ugyanaz maradt, nem sietett és nem időzött, csak valamivel több idő telt el két lépés között, ha hosszabb nap állt mögötte.
Az udvar rendje ekkorra már úgy működött körülöttük, hogy egyiküknek sem kellett minden részét külön figyelnie, a testőrök pontosan váltottak, a raktárak zárva maradtak éjszaka, a kisebb tisztek maguk intézték a vétségeket, és Márton egyre ritkábban találkozott olyan üggyel, amelyben közvetlenül a szolgálat fegyelméről kellett döntenie. A király több időt tölthetett földekkel, adókkal, követekkel, özvegyek kérvényeivel és azokkal az emberekkel, akik egyenként kerültek elé, Gellért pedig továbbra is úgy látta, hogy éppen ezért van szükség arra, hogy valaki mögötte változatlanul tartsa azt, aminek változatlannak kell maradnia.

V. Két öregember
Az idő először csak apró engedményeket kért tőlük, olyanokat, amelyeket egyikük sem tartott érdemesnek számon tartani, Gellért reggelente valamivel tovább maradt a szobájában, mielőtt fölcsatolta volna a mellvértet, mert a bal vállát hideg időben előbb át kellett mozgatnia, Márton pedig a hosszabb tanácskozások közben egyre gyakrabban ült le, még akkor is, ha a többiek állva maradtak körülötte, és amikor a lépcsőkön mentek föl a felső szárnyba, egyikük sem szólt a másiknak arról, hogy a korábbi évekhez képest lassabban érnek föl, csak Gellért maradt mindig fél lépéssel a király mögött, ahonnan szükség esetén elérhette volna, Márton pedig egy-egy fordulónál néha rövidebben támaszkodott a korlátra, mielőtt továbbindult.
Gellért fehér köpenyén közben újra kicserélték a bélést, az ezüstözött csat egyik szélét meg kellett erősíteni, a gyöngyházszín angyalszárnyak fonala néhol megkopott, és a szabó egyszer azt javasolta, készítsenek teljesen újat, mert egyszerűbb lenne, mint újra szétszedni a régit, Gellért azonban visszaküldte azzal, hogy a köpeny még használható, így a következő héten ugyanaz került vissza hozzá, gondosan kijavítva, a régi foltokkal és azokkal az apró eltérésekkel együtt, amelyekből ő már anélkül is tudta, melyik oldalát fogja meg, hogy odanézett volna. A haja addigra szinte teljesen ősz lett a halántékánál, a tarkóján azonban még megmaradt néhány sötétebb sáv, a homlokára hulló tincs pedig vékonyabb ugyan, de ugyanúgy kiszabadult minden reggel, és amikor Márton egyszer egy hosszabb audiencia után megjegyezte, hogy azt a néhány szálat már igazán feladhatná, Gellért végighúzta rajta két ujját, hátrasimította, majd alig fél órával később újra ugyanott feküdt.
Márton haja ekkorra már majdnem teljesen fehér volt, csak a tarkóján maradt benne némi barnás árnyalat, a szakállát rövidebbre vágatta, mert az ősz szálak rendezetlenebbül álltak, a szeme körül pedig olyan mélyre futottak a ráncok, hogy mosolygás nélkül is megmaradt bennük valami a korábbi derűből. A jobb térde rosszabbodott, hidegebb napokon bottal járt a hosszabb folyosókon, bár a trónterembe továbbra sem vitte magával, ott inkább lassabban lépett, és amikor fölállt, egy pillanatig az ülés karfáján hagyta a kezét, amíg a lába teljesen megtartotta. Gellért ezt ugyanúgy észrevette, ahogyan harminc éve észrevette volna a rosszul álló kardhüvelyt egy fiatal testőrön, de nem ajánlotta föl a karját, csak olyan helyre állt, ahol Márton szükség esetén elérhette volna.
Az udvar újabb emberekkel telt meg, olyan tisztekkel, írnokokkal és szolgákkal, akiknek a szülei még gyermekek voltak, amikor Gellért a király elé állt azon a régi napon, és közülük egyre többen úgy beszéltek a két férfiról, mint akik mindig is ugyanazon a helyen álltak, Márton a trónon, Gellért néhány lépéssel mögötte, fehér köpenyben, és már kevesen tudták, milyen volt az a fiatal király, aki karddal az oldalán rohant le a lépcsőkön, vagy az a fekete hajú testőr, aki még két kézzel olyan könnyen forgatta a nehezebb pengét, mintha nem fém lenne a kezében. Az új testőrök Gellértet úgy ismerték, ahogyan az ember egy régi falat vagy kaput ismer meg, amelynek eredetét nem kérdezi, mert mire megérkezik, már régóta ott áll, és a parancsnok szabályai ugyanígy kerültek eléjük, kész rendként, amelyhez igazodni kellett.
Gellért egy ideig még maga vezette a reggeli gyakorlatokat, később csak végignézte őket, a hidegebb hónapokban pedig egyre többször küldte maga helyett az egyik idősebb tisztet, és eleinte minden alkalommal utána kérdezett, ki hogyan teljesített, később már elég volt számára a rövid jelentés, mert a tisztek többsége olyan ember volt, akit ő maga nevelt föl a testőrségben. A kardját ettől még minden nap fölcsatolta, akkor is, amikor már ritkán húzta ki a hüvelyből, és a páncélját sem cserélte könnyebb ünnepi viseletre, bár a mellvért alatt vastagabb bőrréteget kellett hordania, hogy kevésbé nyomja a vállát, a csatokat pedig egy fiatal szolga segített meghúzni a háta mögött, mert a bal karja már nem ért olyan magasra, mint korábban.
Márton ezt is tudta, ahogyan azt is, hogy Gellért néhány hónapja egyre többször hagyja érintetlenül a borát vacsoránál, mert a gyógyító szerint rosszabbul alszik tőle, és azt is észrevette, hogy hosszabb beszélgetések közben a parancsnok néha a jobb kezével megfogja a bal csuklóját, mintha ezzel levenne valamennyi súlyt a válláról, de ugyanúgy nem tett róla megjegyzést, ahogyan Gellért sem kérdezte meg, miért maradt gyertya a király dolgozószobájában jóval éjfél után, vagy miért kellett egyre gyakrabban újra elolvasnia azt a sort, amelyen néhány pillanattal korábban már végigment a szeme.
Esténként néha kettesben vacsoráztak a kisebb szobában, amelynek egyik ablakából a belső udvarra lehetett látni, és ilyenkor a szolgákat hamarabb elküldték, az étel egyszerűbb volt, a borból kevesebb került az asztalra, a beszélgetés pedig olyan dolgokra terelődött, amelyeknek semmi helyük nem lett volna a tanácsban. Egyik este egy régi lóról beszéltek, amely Márton alatt egyszer a folyó közepén megállt és sehogy sem lehetett mozdulásra bírni, máskor arról, hogy Gellért első szolgálati évében milyen rosszul főzött az őrség szakácsa, és a történetekből idővel eltűntek azok az emberek, akikre már egyikük sem emlékezett pontosan, a helyükön pedig megmaradt egy gesztus, egy rosszul felszerszámozott ló, egy leesett fazék vagy az a délután, amikor mindketten három órán át áztak egy erdő szélén, mert a követ, akit vártak, másik úton érkezett.
A kézlevágásról egyik este sem beszéltek.
A félkezű férfi közben évről évre biztosabban dolgozott a raktárban, a bal kezével már gyorsan írt, később ő ellenőrizte a fiatalabb írnokok számadásait, és amikor a raktárvezető meghalt, a helyére nem ő került, mert a ranghoz olyan feladatok is tartoztak, amelyeket nehezebben tudott volna ellátni, de saját asztalt kapott az ablak mellett, ahová a legfontosabb készletjegyzékeket vitték. Gellért néha találkozott vele, mindig ugyanúgy köszöntötték egymást, a férfi bal kézzel tisztelgett, a parancsnok pedig biccentett, és egyikük sem maradt tovább a másik mellett annál, amennyit az adott ügy kívánt.
Márton ritkábban látta, és amikor mégis, többnyire csak az udvar túlsó oldalán vagy egy ajtóban, iratokkal a bal hóna alatt, a jobb kabátujjat könyök alatt gondosan visszahajtva és egy keskeny bőrszíjjal rögzítve, hogy ne akadjon bele semmibe. A király szeme minden alkalommal egy pillanatra tovább maradt rajta, aztán ugyanúgy továbbment, mint bárki más mellett, mert körülötte mindig várt valaki, egy követ, egy kérvény, egy tiszt, egy szolga, és az ember élete ritkán ad olyan üres folyosót, ahol csak azzal lehet foglalkozni, amit évekkel korábban nem mondott ki.
Gellért hatvanadik életévéhez közeledve először engedte át a teljes napi szolgálat irányítását másnak, amikor egy téli reggelen úgy ébredt, hogy a bal karját alig tudta megemelni, és bár délre már fölvette a páncélt, Márton még azelőtt értesült róla, hogy belépett volna hozzá. A király aznap nem fogadta a szokott helyén, hanem a dolgozószobájában várta, ahol Gellért érkezésekor az ablak mellett állt, botját az asztalnak támasztva, és amikor a parancsnok megjelent, először végignézett rajta, aztán az üres székre mutatott.
Gellért leült.
Talán ez volt az első alkalom, hogy szolgálati jelentést ülve adott elő neki, és a helyzet mindkettőjük számára annyira szokatlan volt, hogy Márton az első néhány mondat után elmosolyodott, Gellért pedig egy pillanatra elhallgatott, mintha ellenőrizné, rajta nevet-e, aztán a király csak annyit mondott, hogy így legalább végre nem kell fölfelé néznie rá. Gellért szájának sarka erre megmozdult, a jelentést pedig ugyanonnan folytatta, ahol abbahagyta.
Néhány héttel később kinevezte maga mellé helyettesnek azt a tisztet, aki addig a legtöbb feladatát vitte, tavasszal már ritkábban ment föl a külső falakra, nyáron pedig először maradt a várban egy hosszabb királyi út alatt, mert a gyógyító nem tanácsolta a többnapos lovaglást. Márton indulás előtt ugyanúgy találkozott vele, mint máskor, Gellért végignézte az útvonalat, az őrséget és a lovak számát, és csak akkor bólintott, amikor mindent rendben talált, mintha valójában nem ő lenne az egyetlen olyan elem a régi rendből, amely ezúttal nem indul velük.
A király négy nap múlva tért vissza, és még a lováról sem szállt le teljesen, amikor megtudta, hogy Gellért előző este rosszul lett a saját szobájában. Vacsora után elfáradt, lefeküdt, hajnalban pedig a szolgája nem tudta fölébreszteni. A gyógyító szerint a szíve lehetett, talán már hónapok óta gyengébben dolgozott, talán évekkel korábban elkezdődött valami, amit akkor még nem lehetett észrevenni, és mire Márton belépett hozzá, a szobában már nyitva állt az ablak, mert valaki úgy gondolta, friss levegő kell.
Gellért az ágyon feküdt, páncél nélkül kisebbnek látszott annál, mint amilyennek Márton egész életében ismerte, a haja rendezetten feküdt a párnán, csak a homloka jobb oldalán maradt előrehajolva az a vékony ősz tincs, amelyet annyi reggelen hiába simítottak hátra, a szája pedig nyugodtan zárult össze, mintha csak valami hosszabb beszélgetés közben hallgatna. A bal válla alatt nem volt ott a mellvért, amely évtizedeken át eltakarta a régi sérülést, így a hálóing nyakánál éppen látszott a heg felső része, halvány, szabálytalan vonalként a bőrön, és Márton egy ideig ugyanott tartotta rajta a szemét, ahol évekkel korábban a kisebb tanácsteremben.
A fehér köpeny a szék háttámláján feküdt összehajtva, az ezüstcsatot valaki gondosan ráhelyezte, az angyalszárnyakból csak néhány gyöngyházszín toll látszott az összehajtott anyag szélén.
Márton sokáig maradt a szobában, a szolgákat kiküldte, a botját az ajtó mellé támasztotta, aztán leült ugyanarra a székre, amelyen a köpeny feküdt volna, ha valaki előtte át nem tette volna az ágy végéhez, és nézte Gellért kezét, amely lazán feküdt a takarón, azt a jobb kezet, amely egykor kardot rántott előtte, a balt pedig, amely később mindig valamivel közelebb maradt a testéhez. Nem nyúlt hozzá, nem beszélt, és amikor végül fölállt, ugyanolyan lassan igazította vissza maga mellé a széket, ahogyan Gellért igazította volna el, ha ő marad utoljára a szobában.
A temetésen a fehér köpenyt a koporsóra terítették, teljes hosszában kibontva, így az angyalszárnyak újra láthatóvá váltak, a megkopott fonallal, a javított szegéllyel, az egyik vállnál sötétebb kelmével és mindazzal együtt, amit az évek rajta hagytak, a testőrök pedig két sorban álltak körülötte, közöttük olyan férfiakkal, akiket Gellért még maga tanított kardot tartani, és olyanokkal is, akiknek már csak a rangját adta át valaki más. Márton az első sorban állt, bot nélkül, egyik kezét a másikba fogva maga előtt, és amikor a koporsót elvitték mellette, a tekintete egy darabig követte a fehér szárnyakat, amíg azok el nem tűntek a kápolna ajtajában.
A következő hetekben a testőrség ugyanúgy váltotta az őrséget, a kapuk ugyanabban az időben nyíltak és csukódtak, az új parancsnok ugyanazokat a jelentéseket vitte Márton elé, és az első néhány alkalommal még megállt azon a helyen, ahol Gellért szokott, később azonban egy lépéssel közelebb húzódott az asztalhoz, mert neki az tűnt természetesnek. A király észrevette, aztán néhány nap múlva már ő sem figyelte, a folyosókon pedig egyre ritkábban fordult elő, hogy valaki félrehúzódjon egy fehér köpeny közeledtére, mert a testőrparancsnoki viseletet az utód egyszerűbbé tette, az angyalszárnyas köpenyt pedig Gellért sírja fölött helyezték el a kápolnában.
A rend ettől nem változott meg.

VI. A rend
A királyi raktárakhoz vezető folyosó hűvösebb volt a vár többi részénél, mert a falak vastagabbra épültek, az ablakok keskenyebbek voltak, a kövek pedig még délután is megtartották a reggel hidegét, amikor Márton lassan végigment rajta az új testőrparancsnok, a gazdasági felügyelő és két írnok társaságában. Az udvar fölött már napok óta szürke ég ült, a külső birtokokról érkező jelentések szerint az idei termés gyengébb lett, a lisztből kevesebb maradt a vártnál, és mielőtt újabb szállítmányokat rendeltek volna, a király látni akarta, pontosan mi van még a raktárakban, ezért nem a tanácsteremben várta a számokat, hanem maga ment le oda, ahol a zsákok, hordók, szárított húsok, olajos korsók és gabonás ládák között minden készletnek megvolt a saját helye, a saját szaga és az a sajátos csendje, amelyet csak a számolás és az időnként megmozdított rakomány tört meg.
A gazdasági felügyelő menet közben sorolta, melyik hombárban mennyi búza maradt, melyik lisztből kellene előbb felhasználni a régebbi készletet, mennyi sózott hús fogyott el a katonák ellátására, és melyik birtokról érkezhet még szekér a következő hét végéig, Márton pedig időnként kérdezett, máskor csak bólintott, miközben a botja tompán koppant a köveken, a testőrparancsnok fél lépéssel mögötte haladt, ugyanazon a helyen, ahol egykor Gellért szokott, bár másképp tartotta magát, másképp mozgott, és egyszerű sötét köpenyt viselt a vállán a régi fehér helyett.
A nagyobb raktárban több asztal állt egymás mellett, rajtuk pergamenek, viaszos táblák, számolókövek, pecsétek és különböző jelzésekkel ellátott zsinegek, amelyekből az írnokok tudták, melyik készlet honnan érkezett és mikor kell felhasználni. Az ablak melletti asztalnál egy őszülő férfi dolgozott lehajtott fejjel, bal kezében tollal, a jobb kabátujjat könyök alatt gondosan visszahajtva és keskeny bőrszíjjal rögzítve, hogy munka közben ne akadjon bele a papírokba, és Márton előbb ezt az üresen maradó oldalt ismerte föl, csak utána az arcot, amelyen az évek ugyanúgy végigmentek, mint az övén.
A férfi észrevette a közeledő csoportot, letette a tollat, fölállt, a visszahajtott jobb kabátujj megmozdult mellette, bal kezét a mellkasához emelte, és meghajolt, aztán már várta is a kérdéseket, mintha a király jelenléte sem változtatna azon, hogy előtte számok, készletek és határidők feküdnek, amelyeket pontosan kell ismerni.
Márton megkérdezte, mennyi búza maradt a nyugati hombárban, a férfi pedig fejből mondta a számot, hozzátéve, mennyit vittek el előző héten a pékségbe, mennyi van még a déli raktárban és melyik tétel romolhat gyorsabban, ha a következő napokban nedvesebb marad a levegő. A király ezután a lisztre kérdezett rá, majd a szárított húsra, a férfi minden alkalommal ugyanazzal a nyugodt pontossággal válaszolt, időnként lehajolt egy pergamenhez, a bal kezével végigfuttatta rajta az ujját, aztán újra fölemelte a fejét, és mire a gazdasági felügyelő a terem túlsó végében lévő készletekhez indult, Márton már tudta, hogy az öregedő írnok többet tart fejben erről a helyről, mint némelyik fiatalabb ember a saját szobájáról.
A többiek lassan továbbmentek a következő sorhoz, ahol két szolga éppen egy hordó tetejét emelte le, a testőrparancsnok velük tartott, a gazdasági felügyelő már újabb számokat mondott, Márton azonban néhány pillanatra még az asztal mellett maradt, és a férfi is ott állt előtte, egyik kezét az asztal szélére téve, a másik helyén a kabát ujja üresen simult a testéhez.
A király tekintete végigment az asztalon fekvő pergameneken, a viasztáblákon, a bal kéz ujjain, amelyek mellett sötét tintafolt húzódott, majd visszatért az arcra, és megkérdezte, mióta dolgozik itt.
A férfi egy pillanatra elgondolkodott, aztán azt mondta, huszonhét éve, felség, előtte a testőrségnél szolgált.
Márton bólintott, mintha erre most emlékezne, pedig már akkor tudta, mielőtt megkérdezte volna, és csak néhány másodperc múlva mondta ki Gellért nevét.
A férfi arcán erre valami alig látható változott, nem mosoly, inkább az a rövid ellazulás, amely akkor jelenik meg az emberen, amikor valakit említenek, akit régen ismert, és azt mondta, igen, Gellért alatt szolgált, még fiatalon, amikor a parancsnok haja többnyire fekete volt, a fehér köpeny pedig újabb, és hozzátette, hogy kemény ember volt, de amit másoktól megkövetelt, azt magától is ugyanúgy megkövetelte.
Márton sokáig nézte a férfit, aztán a raktár túlsó feléről valaki hangosan mondott egy számot, a gazdasági felügyelő visszakérdezett, a szolgák közben odébb gördítették a hordót, és az egész helyiség ugyanúgy folytatta a maga munkáját, mintha a két öregember között semmi különös nem történne.
A király végül azt mondta, sok év telt el azóta.
A férfi bólintott, lenézett az asztalra, bal kezének ujjaival kisimította az egyik pergamen felkunkorodó szélét, majd anélkül, hogy mentegetőzne, elmondta, hogy fiatal volt, az anyja és a húgai éheztek, ő pedig úgy gondolta, néhány zsák liszt és egy kevés hús senkinek nem fog hiányozni, aztán amikor egyszer sikerült, másodszor is megtette, később harmadszor, és attól, hogy a családjának vitte, még tudta, hogy amit elvett, nem az övé.
Márton a visszahajtott jobb kabátujjra nézett, majd arra a bal kézre, amelynek ujjai most már gyorsan és biztosan mozogtak a papíron, és azt mondta, azért másképp is lehetett volna.
A férfi fölemelte a fejét, néhány pillanatig nézte a királyt, aztán lassan megrázta a fejét, mintha nem akarná, hogy Márton ennyi év után olyan terhet vegyen magára, amelyet neki már régen sikerült elhelyeznie valahol az életében, és azt mondta, akkoriban más idők jártak, rendnek kellett lennie, különben mindenki azt visz el, amit akar, a testőrség pedig nem maradhat meg úgy, ha az emberek maguk döntik el, melyik szabály vonatkozik rájuk és melyik nem.
Márton nem válaszolt rögtön.
A raktár túlsó végéből az új testőrparancsnok hangja érkezett, valamit kérdezett a következő készletről, a gazdasági felügyelő pedig már indult is vissza a király felé, a férfi azonban még egyszer a szemébe nézett, és olyan nyugodtan, szinte vigasztalóan mondta, mintha egy régi adósságot akarna levenni róla:
– Tudom, felség, hogy ezt kívánta a rend.
Márton ráemelte fáradt szemeit.
