I. Gyerekkor
A templom előtt még sokáig ott maradtak az emberek mise után.
Az asszonyok kisebb csoportokban álltak a lépcső mellett, kosarukat egyik karjukról a másikra akasztva beszélgettek, a férfiak valamivel távolabb húzódtak, és olyan dolgokról vitatkoztak, amelyek vasárnap délelőtt rendszerint fontosabbnak tűntek, mint hétfő reggel. A tér szélén néhány szekér várakozott, a lovak időnként megrázták fejüket, hámjukon megcsörrentek a fémkarikák, a templom fehér fala pedig visszaverte a késő nyári nap fényét.
A gyerekeknek mindebből csak annyi számított, hogy végre kiengedték őket.
A fiú két másik gyerek után futott végig a téren, megkerülte a kutat, majd hátranézett, mert az egyik üldözője azt kiabálta, hogy csal, és emiatt nem látta meg a templomlépcső aljából kiálló követ.
A lába beleakadt.
Előrebukott, két tenyerével ért földet, térde koppant a kövön.
Az anyja már indult is felé.
– Jaj, istenem! Mutasd!
A fiú még fel sem ült rendesen, amikor az asszony letérdelt mellé, egyik kezével átölelte, a másikkal már a nadrágját próbálta felhúzni a térdén.
– Hol ütötted meg? A kezed? Mutasd a kezed. Fáj?
– Nem.
– A térded biztosan.
– De nem fáj.
– Ne mozogj már egy pillanatig.
A fiú engedelmesen ült a kövön.
A két másik gyerek néhány lépésre megállt. Az egyik vigyorgott, a másik lehajolt, mintha közelebbről szeretné látni, mennyire súlyos a sérülés.
– Nagyot esett – mondta.
– Láttam – felelte az anya.
Letörölte fia tenyeréről a port.
Nem volt rajta seb.
Megnézte a másikat is.
Azon sem.
A térdénél a nadrág kissé kifehéredett a portól, de amikor feljebb húzta az anyagot, a bőr ép volt alatta.
– Látod? – mondta a fiú. – Semmi bajom.
– Attól még megüthetted.
– De mondom, hogy nem ütöttem meg.
– Honnan tudod?
A fiú erre nem tudott mit felelni. Inkább felállt volna, de az anyja még tartotta a karját.
– Várj.
– Anya.
– Csak hadd nézzelek meg.
A fiú sóhajtott, és hagyta.
A templomfal tövében egy vak zarándok ült.
Már a mise előtt is ott volt, hosszú botját maga mellé fektetve, poros köpenyében, lábánál egy kis vászonzsákkal. Nem kéregetett hangosan. Aki dobott elé valamit, annak megköszönte, aki elment mellette, annak nem szólt utána.
Most azonban az asszony felé fordította az arcát. Fehér, világtalan szeme még nappal is fényleni látszott.
– Minden seb, amit elhárítasz róla, megnyílik valaki máson.
Az anya kezében megállt a fiú nadrágjának szára.
– Mit mondott?
A zarándok nem ismételte meg.
A fiú kíváncsian nézett rá.
– Ismer minket?
– Nem – mondta az anya.
– Akkor honnan tudja?
– Semmit sem tud.
Felállt, leporolta a fiú ruháját, aztán kézen fogta.
– Menjünk.
A fiú még hátrafordult a vak ember felé, aki ugyanúgy ült a fal mellett, arcát a nap felé tartva.
Meglátta a tér túlsó oldalán a barátait, akik valamit játszottak.
– Mehetek?
Az anya lenézett rá.
– De ne fuss.
A fiú bólintott.
Aztán futva indult el.
•	
A patak tavasszal hideg volt, nyáron sekély, ősszel pedig annyira tiszta, hogy látni lehetett a kövek között cikázó apró halakat. A falubeli gyerekek ismerték azt a részt, ahol a part alámosódott, és egy öreg fűz vastag ága egészen a víz fölé nyúlt.
Onnan lehetett a legmesszebbre ugrani.
– Gyere már! – kiabáltak neki a vízből.
A fiú mezítláb állt a parton.
Az anyja a ruhákat mosta valamivel lejjebb. Amikor meglátta, hová készül, felállt.
– Onnan biztosan nem.
– Mindenki innen ugrik.
– Mindenki úgy töri magát össze, ahogy akarja.
– De elég mély.
– Pont azért.
– Azt mondtam, hogy veszélyes.
– De mások már ugrottak.
– Az nem jelenti azt, hogy neked is kell.
A fiú még egyszer a többiekre nézett.
Az anyja felvette az ingét a fűből, és a vállára terítette.
– Majd lejjebb bemész. Ott nem sodor annyira.
A fiú nem válaszolt.
A víz felől újabb csobbanás hallatszott.
•	
A malom mögött az egyik nagyobb fiú ellökte, ő visszalökte, mire a másik ököllel vállon ütötte. A fiú meglepetésében inkább hátralépett, mintsem visszaüssön.
Mire eldöntötte volna, mit kellene csinálnia, valaki már hazaszaladt szólni.
Az anyja hamarabb ért oda, mint hogy a második ütés elcsattanhatott volna.
– Mi folyik itt?
A nagyobb fiú azonnal hátrébb húzódott.
– Semmi.
– Láttam azt a semmit.
– Ő kezdte.
A fiú tiltakozni akart.
Az anyja elé állt.
– Menj haza.
– De anya...
– Menj.
– De….
– Azt mondtam, menj haza.
Másnap a nagyobb fiú apja átjött, harmadnap pedig a két család már nem beszélt az egészről.
A fiú és a másik gyerek egy hét múlva ugyanazon az úton mentek el egymás mellett.
Nem verekedtek össze újra.
De nem is lettek barátok.
•	
A kés szépen vitte a mogyorófát.
A fiú látta, hogyan kell tartani, mert sokszor figyelte az idősebb férfiakat, amikor nyelet, sípot vagy apró játékot faragtak. Leült a ház mögötti lépcsőre, egyik térdére támasztotta az ágat, és óvatosan megindította a pengét maga felé.
– Mit csinálsz?
Az anyja hangjára megállt.
– Sípot.
– Add ide.
– Tudom, hogy kell.
– Elhiszem. Add ide.
A fiú a késre nézett.
– Nem vágom meg magam.
– Senki sem azért vágja meg magát, mert akarja.
Elvette tőle a pengét.
– Majd megkérjük a szomszédot, az megcsinálja.
– De én akartam.
– Megmutatja neked, hogyan kell.
– Tudom, hogyan kell.
– Akkor majd együtt csináljátok.
A fiú a félig meghántott ágat nézte.
Később valóban lett belőle síp.
Szépen szólt.
•	
A lovat már majdnem olyan jól ismerte, mint a saját kutyájukat.
A szürke kanca nyugodt állat volt, hagyta, hogy a fiú vakargassa a füle tövét, és ha almát érzett nála, addig böködte az orrával, amíg meg nem kapta.
– Felülhetek rá?
– Egyedül nem.
– Csak az udvaron.
– Leeshetsz.
– Nem fogok.
– Ezt mindenki akkor mondja, amikor még fent van.
A fiú elnevette magát.
– Fogd meg, anya.
Az anyja végül tartotta a kantárt, miközben ő felmászott.
A kanca tett néhány lassú lépést.
A fiú kihúzta magát.
– Engedd el.
– Majd, ha nagyobb leszel.
– Már nagy vagyok.
– Na persze.
– Tényleg.
Az anya mosolygott, de a kantárt nem engedte el.
•	
Az ajtófélfán egyre feljebb kerültek a késsel húzott vonalak.
Előbb az anyja még fölé tudta tenni a tenyerét, aztán már lábujjhegyre kellett állnia hozzá, végül a fiú lehajolt, amikor belépett az alacsony kamraajtón.
Az anya továbbra is tudta, mikor kell kendőt vinni, mert estére lehűl a levegő, melyik úton mély a sár, melyik szomszéd kutyája harap, melyik munka túl nehéz, melyik létra billeg, melyik szerszám csúszhat meg az ember kezében.
A fiú pedig megszokta, hogy ha valamire azt mondja:
– Nem lesz baj.
az anyja rendszerint azt feleli:
– Attól még lehet.
És legtöbbször hagyta.
Nem azért, mert félt.
Mert így egyszerűbb volt.
•	
A földesúr intézője egy szeles reggelen érkezett a faluba három fegyveres emberrel.
A lovakat a kocsma előtt kötötték ki, az intéző pedig bement a bíró házába, ahonnan nem sokkal később a bíróval és egy írnokkal együtt jött ki. Az emberek lassan gyűltek köréjük, előbb csak azok, akik éppen arra jártak, aztán valaki szólt a szomszédjának, más elküldte a gyerekét a férjéért, és mire az írnok kibontotta a papírt, már szinte minden házból állt ott valaki.
Az anya a fiú mellett állt és hallgatták, hogy a földesúr hadba vonul ezért a falunak ki kell állítania a rá eső számú férfit. Miközben az írnok a neveket olvasta, a tömegből sírás és káromkodás hallatszott. Egy idős szikár férfi fiát szólították, a férfi csak állt és olyan erővel szorította az állkapcsát, hogy szinte hallani lehetett a fogai csikordulását.
Aztán elhangzott a fiú neve.
Az anya azonnal megszólalt.
– Ő nem.
Az írnok felnézett a papírból.
– Mi az, hogy nem?
– Nem vihetik.
Az intéző most nézett rá először.
– Hány éves?
Az anya nem válaszolt.
A fiú mondta meg.
Az intéző bólintott.
– Akkor vihetjük.
– Nem katona.
– Egyikük sem az.
– Soha életében nem fogott fegyvert.
– Majd megtanulja.
Az intéző már az írnok felé fordult.
– Következő.
Az anya megfogta a fiú karját.
Erősen.
Ugyanúgy, ahogy a templom előtt, amikor elesett.
A fiú lenézett a kezére.
– Anya.
Az asszony nem engedte el.
– Beszélek velük.
– Mit?
– Valamit.
– Mit?
– Nem tudom. Majd én...
A mondat ott maradt közöttük.
A téren közben tovább olvasták a neveket.

II. A fiúk
Anyám,
megérkeztünk az első táborhelyre, úgyhogy most végre írhatok neked, és mielőtt bármi mást mondanék, semmi bajom. Tudom, hogy ezt kérdeznéd először, ezért gondoltam, jobb, ha rögtön ezzel kezdem. Nem fáztam meg, nem törtem el semmimet, a lábam sem törte fel nagyon a csizma, pedig attól tartottál a legjobban, és rendesen eszem is. Az étel nem olyan, mint otthon, de ezt inkább ne mondd el senkinek, mert itt mindenki úgy beszél róla, mintha az volna a világ legrosszabb dolga, pedig szerintem csak túl sok vizet tesznek mindenbe.
Az út hosszabb volt, mint gondoltam.
A faluból kilencen indultunk, de mire ideértünk, már legalább ötvenen voltunk, mert útközben más falvakból is hozzánk csapták azokat, akiket a földesurak küldtek. Van, aki nálam fiatalabbnak látszik, bár azt mondja, idősebb, és vannak köztük olyanok is, akiknek már gyerekük van otthon. Az egyik ember három fiáról beszél állandóan, de amikor megkérdeztem, hány évesek, azt mondta, nem tudja pontosan, mert „egyik jött a másik után”. Nem hiszem, hogy tényleg nem tudja. Szerintem csak azt akarta, hogy nevessenek rajta.
Sokat nevetnek.
Olyan dolgokon is, amiken nem értem, miért kell.
Az első este az egyik fiú, akit Mártonnak hívnak, azt mondta, hogy aki elsőként alszik el, annak bemázolják az arcát korommal. Azt hittem, csak mondja, de reggel az egyik ember úgy ébredt, hogy az egész homloka fekete volt, és még bajuszt is rajzoltak neki. Mérges lett, mire mindenki még jobban nevetett. Aztán ő is nevetni kezdett, és később ő kente be valaki másnak a nyakát.
Nem értem pontosan, mikor haragszanak és mikor nem.
Néha úgy beszélnek egymással, hogy azt hinnéd, mindjárt megölik a másikat, aztán fél óra múlva ugyanabból a kulacsból isznak.
Márton például tegnap azt mondta egy Péter nevű fiúnak, hogy olyan buta, hogy ha két ajtó közül kellene választania, a falnak menne neki. Péter erre valami olyat válaszolt Márton anyjáról, amit inkább nem írok le neked, mert biztosan megkérdeznéd, hol tanultam ilyen szavakat. Márton felállt, én azt hittem, össze fognak verekedni, de csak vállon lökte Pétert, az meg visszalökte, aztán mindketten leültek.
Később megkérdeztem Mártont, hogy haragszik-e rá.
Először azt sem tudta, kiről beszélek. Amikor mondtam, hogy Péterről, csak nézett rám, aztán megkérdezte, miért haragudna rá. Mondtam, hogy azért, amit az anyjáról mondott, mire Márton azt felelte, hogy Péter mindig ilyen hülyeségeket beszél, és különben is, ha mindenért haragudna rá, amit mond, akkor reggeltől estig haragudhatna.
Azt hiszem, ők barátok.
Furcsa barátság, de talán itt ez normális.
Engem is ugratnak, csak még nem mindig tudom, mikor kellene visszaszólnom. Tegnap Márton megkérdezte, verekedtem-e már, és amikor azt mondtam, egyszer, nagyon érdekelte a dolog. El kellett mesélnem a malom mögötti esetet. Amikor odaértem, hogy te megjelentél, még Péter is odajött meghallgatni, pedig addig a csizmájával foglalkozott.
Azt kérdezték, visszaütöttem-e.
Mondtam, hogy nem volt rá időm.
Márton erre azt mondta, ez nagyon elegáns megfogalmazása annak, hogy az anyám mentett meg.
Nem tudtam, mit mondjak, úgyhogy azt feleltem, hogy ha egyszer megismerne téged, nem nevetne ennyire.
Erre azt mondta, éppen ezért reméli, hogy soha nem találkoztok.
Ezen már én is nevettem.
Ne haragudj érte. Nem rajtad nevettünk. Inkább azon, ahogy mondta.
Van itt egy András nevű ember is, bár róla nem tudom, hogy fiúnak nevezzem-e, mert szerintem jóval idősebb nálam. Nem olyan öreg, mint a molnár, csak olyan, mintha már mindent csinált volna legalább egyszer. Tegnap este ő mutatta meg, hogyan tekerjem a rongyot a lábam köré, hogy ne dörzsölje a csizma. Mondtam neki, hogy nincs rá szükségem, mert eddig sem törte fel, de erre azt mondta, attól még tekerjem körbe.
Ebben nagyon hasonlít rád.
Ezt neki nem mondtam.
Azt mondta, az első napokban mindenki azt hiszi, jó rá a csizmája, aztán amikor már két napja menetel benne, kiderül, hogy mégsem. Azóta úgy csinálom, ahogy mutatta. Tényleg kényelmesebb, csak reggel sokáig tart rendesen feltekerni, és ha rosszul csinálom, lecsúszik. Márton szerint fölösleges ennyit vacakolni vele. Az ő sarkán viszont van egy vízhólyag, úgyhogy szerintem ebben nem neki van igaza.
A tiszta rongyokat is megtaláltam, amiket becsomagoltál. Tényleg túl sokat adtál.
Tegnap az egyik ember megvágta a tenyerét favágás közben, és adtam neki egyet. Ne aggódj, nem volt nagy seb. Sokkal nagyobb hangot csapott miatta, mint amekkora volt. Úgy káromkodott, hogy még azok is nevettek, akik már hallottak itt mindent.
Megkérdezte, honnan van ilyen tiszta rongyom.
Mondtam, hogy az anyám csomagolta.
Azt mondta, akkor köszönjem meg neked.
Úgyhogy köszöni.
Nem tudom a nevét.
Ma lándzsát is kaptunk. Ettől se ijedj meg, mert még nem megyünk csatába, csak tanuljuk, hogyan kell használni. Sokkal nehezebb vele bánni, mint amilyennek látszik. Ha az ember az elejét figyeli, a hátuljával talál el valakit, ha a hátuljára figyel, az eleje megy mindenfelé. Márton majdnem leverte Péter sapkáját, amin persze megint összevesztek, de most már tudom, hogy ez náluk nem feltétlenül jelent semmit.
Az az ember, aki tanít minket, viszont tényleg haragszik mindenkire.
Márton szerint ő csak ilyen.
Egyszer úgy ráordított valamelyik fiúra, hogy még én is kiegyenesedtem, pedig nem is nekem szólt. Azt mondta, ha csatában is úgy fogja a lándzsát, ahogy most, akkor az ellenség helyett saját magát öli meg. A fiú erre nevetett, amit nem kellett volna, mert utána még sokáig külön gyakoroltatták vele.
Az ételről már írtam. Ma valamivel jobb volt, bár lehet, hogy csak éhesebb lettem. Volt benne hús is. Legalábbis Márton szerint hús volt, Péter szerint jobb, ha nem kérdezzük meg, milyen állat volt. Nem értem, miért kell mindent elrontaniuk valami ilyen megjegyzéssel.
Napközben mindenki kiabál, járkál, pakol, valaki mindig keres valamit, amit általában egy másik ember vitt el, de amikor besötétedik, sokkal csendesebb lesz. Most is egy domb oldalában ülök, valamivel távolabb a többiektől. Innen látom a tüzeket. Sok van belőlük, mert már más falvakból is érkeztek emberek, és azt mondják, holnap még többen jönnek.
Nem is gondoltam, hogy ennyi embert össze lehet gyűjteni egy helyre úgy, hogy egyikük sem tudja pontosan, hová megy.
András azt mondja, néhány nap múlva továbbindulunk dél felé. Megkérdeztem, messze van-e, de csak annyit mondott, hogy attól függ, hová küldenek bennünket. Nagyon hasznos válasz volt.
Márton most kiabál, hogy menjek vissza, mert ha sokáig ülök itt egyedül, még azt hiszik, verset írok.
Holnap megpróbálom odaadni a levelet valamelyik szekérrel visszafelé indulónak. Nem tudom, mikor kapod meg, úgyhogy ha később érkezik, mint gondolnád, ne kezdj rögtön valami rosszra gondolni.
Tényleg jól vagyok.
Hiányzol.
A levesed pedig különösen.

III. Az út
Anyám,
megint tudok írni neked. Egy falu mellett álltunk meg, bár nem hiszem, hogy sokáig maradunk, mert már este azt beszélték, hogy reggel továbbindulunk. Mostanában sokkal többet gyalogolunk, mint az elején. Néha egész nap megyünk, máskor délig egyhelyben állunk, mert előttünk valaki nem indult el időben, vagy mögöttünk várni kell a szekerekre. András szerint a hadban az ember mindig siet valahová, ahol aztán órákig várhat.
Jól vagyok. A csizmám sem törte fel a lábamat. Tudom, hogy ezen most mosolyognál, mert már a második levelemben írom, de te csomagoltad azt a sok rongyot, úgyhogy gondoltam, tudni akarod, használom-e. András megmutatta, hogyan kell rendesen körbetekerni a lábat, és tényleg sokat számít. Márton persze kinevetett minket miatta, aztán neki lett hólyagos a sarka. Azóta valamivel kevesebbet nevet.
Egy másik faluból való favágót eltemettünk három nappal ezelőtt, de ne ijedj meg, nem harcban történt.
Jánosnak hívták. Ő volt az, akinek az első táborhelyen odaadtam az egyik tiszta rongyot, amikor favágás közben megvágta a tenyerét. Biztosan emlékszel, írtam róla. Akkor mindenki nevetett rajta, mert úgy káromkodott egy ilyen kis vágás miatt, mintha levágták volna az egész kezét.
Alig akartam elhinni, amikor András szólt, hogy János beteg. Azokkal menetelt, akik előttünk jöttek, és azt mesélte, már másnapra bedagadt a keze, aztán a karja is, a seb körül pedig tűzpiros lett a bőre. Az istennek sem akarta megmutatni a felcsernek, mert azt mondogatta, látott ő már rosszabbat is, és egy ilyen karcolás miatt nem fog nyavalyogni.
Márton szerint így jár minden istenbarma, aki azt hiszi, hogy neki nem eshet baja.
Estére Jánost már két pokróc alatt is rázta a hideg.
Reggel nem ébredt fel.
Az őrmester először azt hitte, csak alszik, mert állítólag többször is megrúgta a csizmáját, mire lehajolt hozzá.
Nekem még mindig furcsa, hogy valaki egy ilyen kis sebtől meghalhat. Láttam azt a vágást. Alig vérzett.
Eltemettük az út mellett, de nem volt idő rendes sírt készíteni neki. Ástunk annyit, amennyit tudtunk, András pedig két ágból keresztet kötött, és leszúrta a földbe. Remélem, nem viszi el a szél. Tudom, hogy Jánosnak már mindegy, de valahogy rossz volna arra gondolni, hogy néhány nap múlva már semmi sem mutatja, hogy ott fekszik.
Márton azóta sem ül arra a helyre a tűznél, ahol János szokott. Nem beszél róla, és más sem. Egyszerűen üresen marad.
Tegnap egy falun mentünk keresztül, és ott történt valami, amit nem nagyon tudok hová tenni.
Már messziről furcsának látszott a hely, mert alig volt ember az utcákon. Főleg öregek, asszonyok és gyerekek néztek minket az ajtókból. Aztán kiderült, hogy a falunak is kellett volna embereket adnia a seregbe, de a hadra fogható férfiak eltűntek. Azt mondták, egy részük az erdőben bujkál, mások már napokkal korábban elszöktek.
A velünk lévő katonák végigkutatták a házakat, a pajtákat és az istállókat.
Nekünk is be kellett nézni néhány helyre. Mártonnal és Péterrel egy nagy pajtát kaptunk, ahol csak széna volt meg néhány tyúk. Péter talált egy korsó bort, és elhozta. Nem szóltam semmit. Nem tudom, miért. Talán mert a többiek is vittek ezt-azt, és egy idő után már úgy tűnt, mintha ez volna a dolgok rendje.
Aztán az utcán megláttam egy asszonyt, aki két kézzel kapaszkodott egy zsák lisztbe.
Az egyik katona el akarta venni tőle. Az asszony sírt, és azt mondta, télire rakta félre, a gyerekeinek kell. A katona nem ütötte meg, csak egyszerűen erősebb volt nála. Kirántotta a zsákot a kezéből, a vállára vette és elment.
Az asszony még sokáig kiabált utána.
Aznap este kenyeret kaptunk.
Nem tudom, abból a lisztből sütötték-e. Valószínűleg nem, hiszen ilyen gyorsan nem is lehetett volna.
Mégis eszembe jutott az asszony, amikor ettem.
Az első falatot alig tudtam lenyelni.
A másodikat már könnyebben.
A harmadiknál pedig éhes voltam.
Ezt furcsa leírni.
Péter később adott egy darab kenyeret egy kisfiúnak abból a faluból. Talán szégyellte magát a bor miatt, bár erről nem beszélt. A gyerek elvette tőle, de meg sem köszönte. Csak nézett bennünket, amíg el nem indultunk.
Szerintem gyűlölt minket.
Pedig én nem tettem vele semmit.
Ma sokkal csendesebben mentünk, mint máskor. Márton és Péter délutánra megint elkezdtek hülyéskedni, de valahogy nem volt ugyanolyan. Jánosról senki sem beszélt, a faluról sem. Inkább arról vitatkoztak, melyikük tudna több gombócot megenni, ha rendes ételt kapnánk egyszer.
Márton szerint tizenkettőt.
Szerintem hazudik.
Most mellettem alszik, úgyhogy ezt nyugodtan leírhatom.
Holnap megint továbbmegyünk. Azt mondják, egyre közelebb vagyunk a sereg fő részéhez, de azt még mindig nem tudom, hol lesz a csata. Néha arra gondolok, hogy talán mire odaérünk, már véget is ér.
Jó volna.
Ne aggódj értem.
Nekem továbbra sincs semmi bajom.

IV. A tölgyfa alatt
Anyám,
ma végre nem megyünk sehová.
Legalábbis ezt mondták reggel, és eddig még senki sem kiabált, hogy szedjük össze a holminkat, úgyhogy talán igaz is marad estig.
Egy nagy réten táborozunk. A mező egyik oldalán erdő kezdődik, a másikon alacsony domb húzódik, és majdnem a közepén áll egy öreg tölgyfa mellette meg egy korhadék. Akkora a törzse, hogy szerintem hárman sem érnénk körül, bár Márton szerint négyen sem, Péter meg azt mondja, ha ennyire érdekel bennünket, este kipróbálhatjuk.
Én most alatta ülök.
Jó itt.
A többiek nagy része alszik vagy a ruháját próbálja megszárítani. Már két napja szemerkélt az eső, és mindenünk nyirkos lett, még az is, amit a zsák mélyére tettünk. Ma viszont kisütött a nap. A tölgy levelei között átjön a fény, és amikor fúj a szél, ide-oda mozognak a világos foltok a papíron. Néha meg kell várnom, míg újra látom, mit írtam.
Ha itthon volnék, te biztosan azt mondanád, ne üljek a földre, mert felfázom.
Vittem magammal a pokrócot.
Látod, tanulok.
Márton azt mondja, azért szeretek ennyire levelet írni, mert olyankor legalább békén hagynak. Ebben lehet valami. Most sem jött ide senki, amióta meglátták nálam a papírt.
Az út egyébként nem lett könnyebb, csak mi szoktuk meg jobban. Már nem számolom, hány mérföldet megyünk egy nap, és azt sem nézem folyton, mikor állunk meg. Reggel felkelünk, összeszedjük, ami a miénk, aztán megyünk addig, amíg azt nem mondják, hogy elég.
András szerint már egészen rendesen tartom a lándzsát.
Múltkor még azt írta volna rólam, hogy saját magamra vagyok a legveszélyesebb.
Most már csak az ellenségre.
Legalábbis remélem.
Egyre több katonával találkozunk. Néha egész csapatok mennek el mellettünk az ellenkező irányba. Némelyikük sebesülteket visz szekéren, de nem kérdezünk tőlük semmit. Ők sem nagyon néznek ránk.
Az egyik szekéren egy fiú ült bekötött fejjel. Körülbelül annyi idős lehetett, mint én. Amikor elhaladt mellettünk, rám nézett, én pedig majdnem intettem neki.
Nem tudom, miért nem tettem.
Tamás sem jön velünk tovább.
Róla még nem írtam, mert nem tartozott szorosan közénk. A mögöttünk haladó csapatból került mellénk néhány napra, amikor összekeveredtek az emberek egy átkelésnél. Nagydarab fiú volt, mindig ő cipelte a nehezebb dolgokat, mert azt mondta, legalább nem kell másokra várnia.
Az eső első napján kezdett köhögni.
Eleinte ezen is nevettek. Mindenki köhög néha, főleg, ha egész nap nedves ruhában gyalogol. Másnap azonban már alig evett, este pedig olyan forró volt a homloka, hogy András rögtön szólt a felcsernek.
Reggel még velünk indult.
Délre már két ember támogatta.
A következő faluban ott hagytuk.
Azt mondták, nem bírja tovább az utat, és jobb neki fedél alatt.
Tegnap jött utánunk egy szekér onnan.
Tamás meghalt.
Nem tudom, miben.
Azt mondták, valami lement a tüdejére.
Furcsa, mert nem volt sebes.
Csak megfázott.
Márton szerint az ember itt mindenféle ostobaságban meg tud halni, ha elég rosszkor történik vele.
János egy vágástól.
Tamás egy köhögéstől.
Én közben egyszer sem voltam beteg.
Még az esőben sem.
Tudom, most azt mondanád, azért, mert rendesen felöltözöm. Igazad lehet. A vastag köpenyt is használom, amit annyira nem akartam elhozni, és most már örülök neki.
Nehogy ebből azt gondold, hogy minden nap történik valami rossz.
Nem történik.
Néha egész nap nem történik semmi.
Tegnap például csak mentünk. Péter talált az út mellett egy félig érett almát, négyfelé vágta, és mindannyian kaptunk belőle. Olyan savanyú volt, hogy Márton még percek múlva is fintorgott, de azért megette a sajátját, aztán megpróbálta elkérni az enyém maradékát.
Nem adtam.
Ma reggel pedig egy nyúl szaladt keresztül a táboron, és vagy húsz ember rohant utána. Senki sem fogta meg. A nyúl eltűnt az erdőben, két katona összeütközött, az egyik beleesett egy bokorba, és szerintem ezen többet nevettünk, mint bármin az elmúlt héten.
Jólesett.
Most megint fúj a szél.
Az öreg tölgy fölöttem egészen halkan zúg, pedig odalent alig mozdul a levegő. Nem tudom, hogyan lehet egy fa ilyen nagy. Biztosan nagyon régóta áll itt.
Arra gondoltam, hány ember ülhetett már alatta.
Talán más katonák is.
Talán olyanok, akik ugyanígy írtak haza.
Ostobaság, tudom.
Csak itt ülve eszembe jut mindenféle.
Ha hazaérek, lemegyek majd a patakhoz is.
Most már biztosan felengednél arra a fűzfára.
Bár azt hiszem, már nem akarnék leugrani róla.
Nem azért, mert félek.
Csak valahogy már nem tűnik olyan fontosnak.
Azt mondják, holnap ismét elindulunk, és utána talán már nem állunk meg sokszor. A nagy sereg nincs messze.
Már hallottunk ágyúkat is.
Nagyon messziről.
Először azt hittem, mennydörög.
András mondta, hogy nem.
Most már tudom, milyen hangja van.
Ne aggódj.
Ma süt a nap, tele a hasam, száraz a ruhám, és egy akkora tölgyfa alatt ülök, hogy szerintem még az eső sem találna meg.
Nekem nincs semmi bajom.

V. Holnap
Anyám,
holnapra azt mondják, elérjük a sereget.
Most már tényleg közel lehetünk, mert egész nap jönnek-mennek körülöttünk a futárok, szekerek haladnak el mellettünk, és délután megint hallottuk az ágyúkat. Sokkal erősebben, mint legutóbb. Márton szerint, ha nagyon figyel az ember, még azt is meg lehet mondani a hangjukból, milyen messze vannak, de szerintem ezt csak kitalálta, mert amikor megkérdeztem, akkor mégis hány mérföld, azt mondta, éppen annyi, hogy jobb, ha ma még nyugodtan alszunk.
Én is ezt fogom tenni.
Ne aggódj értem.
Tudom, hogy amikor ezt olvasod, valószínűleg már százszor végiggondoltad, mi minden történhet velem, de most először érzem igazán, hogy talán fölöslegesen féltettél ennyire.
Sokat tanultunk.
Már nem ügyetlenkedem a lándzsával, és a pajzsot is úgy tudom tartani, hogy nem fárad el rögtön a karom. Tudom, hogyan kell sorban maradni, mikor kell megállni, mikor kell előrelépni, és azt is, hogy ha mellettem valaki elesik, nem szabad rögtön lehajolni hozzá, mert akkor a mögöttem jövő is felbukhat bennem.
Furcsa dolgokat tanul meg az ember.
Az első napokban még azt hittem, mindenki csak azért kiabál velünk, mert szeret kiabálni. Most már értem, miért gyakoroltatnak velünk ugyanazt újra meg újra. Ha ötven ember egyszerre indul meg, nem lehet mindegyik külön okos. Valakinek meg kell mondania, merre menjünk, nekünk pedig azt kell csinálnunk.
Szerintem menni fog.
András is azt mondta, sokkal jobb csapat vagyunk, mint amikor elindultunk. Márton erre természetesen közölte, hogy ő már akkor is kiváló katona volt, csak még senki sem vette észre. Péter szerint most sem vette észre senki.
Ugyanolyan hülyék, mint eddig.
Örülök neki.
Az elején nem értettem, hogyan tudnak állandóan egymással szórakozni, néha egészen durván, most meg már hiányozna, ha egy napig csendben lennének. Már azt is nagyjából tudom, mikor mondanak valamit komolyan, és mikor csak azért, hogy a másik visszaszóljon.
Tegnap én jártam rosszul.
Márton megkérdezte, mit fogok elsőként csinálni, amikor hazamegyek. Azt mondtam, enni.
Erre olyan nevetés tört ki, mintha valami különösen szellemeset mondtam volna, pedig teljesen komolyan gondoltam.
Nem tudod elképzelni, mennyire hiányzik a rendes étel.
Péter szerint az első dolga az lesz, hogy alszik két napot. András csak annyit mondott, megfürdik. Ezen meg mi nevettünk, mert szerintünk neki ehhez három nap is kevés lesz.
Aztán valahogy elkezdtünk arról beszélni, mit csinálunk majd, amikor az egésznek vége.
Furcsa volt.
Eddig mindig csak a következő falut, a következő pihenőt vagy az esti tüzet vártuk. Most meg egyszer csak mindenki hazafelé beszélt.
Mártonnak állítólag van egy lány, akit feleségül akar venni. Eddig egy szót sem mondott róla. Amikor megkérdeztük, miért nem, azt felelte, mert semmi közünk hozzá. Utána még majdnem fél órán át mesélt róla.
Szerintem nagyon szereti.
Péternek nincs senkije, de azt mondja, ha kap pénzt a szolgálatért, vesz egy lovat. Már el is döntötte, milyet, pedig még azt sem tudjuk, kapunk-e pénzt.
András pedig hazamegy a testvéréhez, és rendbe teszi a tetőt.
Én azt mondtam, hazamegyek hozzád.
Most már nevethetsz.
Aztán lemegyek a patakhoz.
Emlékszem arra a fűzre is, ahonnan nem engedtél ugrani. Nem tudom, megvan-e még. Ha igen, talán felmászom rá.
De nem ígérem, hogy leugrom.
Most már értem, hogy néha tényleg fölösleges kockáztatni csak azért, mert a többiek csinálják.
Látod? Ezt is megtanultam.
Talán jobban neveltél, mint gondoltam.
Ma este mindenki korábban lefekszik. Holnap hosszú út lesz, és azt mondták, mire megérkezünk, már sötétedhet. Utána majd kiderül, mi lesz velünk.
Nem félek annyira, mint hittem, hogy fogok.
Inkább kíváncsi vagyok.
Velünk vannak olyanok, akik már harcoltak, és azt mondják, az első alkalom a legrosszabb, utána az ember már tudja, mire számítson. András szerint pedig nem kell hősnek lenni. Csak maradjak a többiek mellett, figyeljek arra, amit mondanak, és ne akarjak egyedül megoldani semmit.
Ebben jó vagyok.
Egész életemben azt tanítottad, hogy vigyázzak magamra.
Most már nem egyedül kell.
Vigyázunk egymásra.
Márton, Péter, András és én.
A többiek is.
Ennyi ember között nehéz elképzelni, hogy éppen velem történjen valami.
Holnap, ha megérkezünk és lesz lehetőségem, megint írok.
Addig se aggódj.
Felkészültünk.
Jó emberek vannak mellettem.
És valamiért tényleg azt érzem, hogy nem lesz semmi baj.

VI. A csatatér
Megérkeztek.
Nem olyan volt, mint elképzelte.
Késő délután érték el a dombot. Az út hosszú, lankás emelkedővel kapaszkodott fölfelé, két oldalán megsárgult fű hajolt a keréknyomok fölé, és ahol a menet eleje már elérte a magasabb részeket, a felvert por vékony fátyolként lebegett az emberek mögött. Egész nap gyalogoltak, ezért a sor rég elveszítette azt a feszességet, amelyet reggel még az őrmesterek kiabálása tartott benne. Néhányan lecsúszott szíjjal vitték a pajzsukat, mások vállukra fektették a lándzsát, a beszélgetések is elhalkultak, mintha a hosszú út lassan minden fölösleges szót kiszedett volna belőlük.
A dombtető közelében aztán az előttük haladók lassítani kezdtek.
Nem érkezett parancs. Nem kiáltott senki, mégis egyre rövidebbek lettek a lépések, míg végül az egész menet megállt. A hátulról érkezők még néhány pillanatig egymásnak torlódtak, valaki bosszúsan szólt előre, hogy mi történt, de választ nem kapott. A fiú Márton válla fölött próbált átnézni, aztán néhány lépéssel kijjebb húzódott az út szélére, ahol a fű alacsonyabb volt.
Onnan már látni lehetett a domb túlsó oldalát.
A vidék nagyobb volt, mint amekkorának odalentről gondolta.
A lejtő szélesen ereszkedett egy hatalmas síkság felé, amely a távolban erdős domboknak ütközött. A nap már alacsonyan járt mögöttük, fénye ferdén ömlött át a vidéken, aranyszínűvé változtatta a magasabban maradt füvet, és hosszú árnyékokat húzott mindenből, ami kiemelkedett a földből. Messze balra egy keskeny vízfolyás kanyargott a mező szélén, partján fák álltak, koronájuk alját már ködös párába vonta a közeledő este. Ha máskor érkeznek ide, talán megállnak csak azért, hogy nézzék.
A síkság közepén azonban a táj elveszítette természetes rendjét.
Először csak a színe volt más.
Nagy, szabálytalan területen a fű nem sárgán vagy fakózölden világított, hanem sötéten feküdt a földön, mintha heves zivatar verte volna le. A napfény ott nem a növények tetején ült meg, hanem a megszaggatott talaj egyenetlenségein tört darabokra. Keréknyomok, paták és emberek lábai olyan sűrűn járták át, hogy helyenként nem maradt más, csak szétnyomott, sáros föld. Az utak sem vezettek már sehova rendesen: egymásba futottak, keresztezték egymást, eltűntek a letaposott mezőben, majd távolabb váratlanul újra előbukkantak.
Ahogy tovább nézte, lassan különváltak benne azok a dolgok, amelyeket első pillantásra csak sötét foltoknak látott.
Egyikük egy szekér volt.
Oldalára dőlve feküdt a mezőn, tengelye ferdén állt az ég felé, az egyik kereke még rajta volt, a másik néhány öllel távolabb hevert. Valami világos anyag szóródott ki mellőle a földre, talán gabona, talán liszt, de a sár és a sok láb már annyira összetaposta, hogy innen nem lehetett megmondani. A szekér mögött még egy állt, annak csak a ponyvája szakadt szét, majd távolabb egy harmadik, amelynek az eleje mélyen belefúródott a földbe, mintha a lovak hirtelen rántották volna félre.
Lovak is feküdtek körülöttük.
Előbb csak a méretük miatt lehetett megkülönböztetni őket a többi alaktól. Nagy, mozdulatlan testek voltak a mezőn, némelyik oldalt feküdt, kinyújtott lábakkal, másik összegörnyedve, nyakát természetellenesen maga alá fordítva. Egy fehér ló messziről különösen tisztán látszott, mert világos teste élesen elvált a sötét földtől. A nyeregtakaró még rajta volt, egyik kengyele a hasa mellett feküdt a sárban. Mellette valami kisebb, sötét alak hevert, amelyet a fiú először ledobott nyeregtáskának gondolt.
Aztán meglátta a csizmát.
Ettől kezdve a mező lassan megtelt emberekkel.
Nem azért, mert addig nem voltak ott. A szemnek kellett idő, amíg megtanulta felismerni őket.
A hosszúkás barna folt, amely két keréknyom között feküdt, egy férfi volt. Távolabb kettő hevert egymás mellett. A következőnél már látni lehetett a világos arcot is, mert hanyatt feküdt, és a lenyugvó nap éppen végigsütött rajta. Azután még több alak vált ki a földből, előbb néhány, majd tucatnyi, végül annyi, hogy a fiú már nem tudta volna megmondani, hol nézett rá először úgy a mezőre, hogy észrevette őket, és mikor váltak egyszerűen a táj részévé.
Nem feküdtek sorban.
A harc nem hagyott olyan rendet maga után, amilyet a kiképzésen tanítottak nekik. Volt, aki magában maradt a nyílt részen, körülötte több ölön át semmi, mások összezsúfolódtak egy sekély árokban vagy egy felborult szekér mellett. Némelyik test úgy feküdt, mintha csak elfáradt volna és leült volna pihenni, aztán oldalra dőlt. Másokon már a távolság sem tudta megszelídíteni azt a mozdulatot, amelyben rájuk talált a halál.
A földön szanaszét heverő hosszú, keskeny vonalakról most már tudta, hogy lándzsák. Egy részük eltört, a világos törésfelület messziről is kirajzolódott a sötét nyeleken. Pajzsok feküdtek közöttük, néhány arccal lefelé, mások felfordulva fogták fel a napot, és időnként olyan erős fénnyel villantak fel, hogy a fiú hunyorogni kényszerült. Kardok pengéje, sisakok, csatok, edények, egy-egy elszórt ruhadarab csillant elő ugyanebből a fényből, olyan tárgyak, amelyeket még aznap reggel emberek vittek magukkal, igazgattak a vállukon, szidtak, ha túl nehezek voltak, vagy keresgéltek, ha nem találták őket.
A mezőn az élők is mozogtak.
Messziről lassúnak látszott minden mozdulatuk. Ketten lehajoltak egy fekvő emberhez, felemelték, és úgy indultak vele a síkság szélén felállított sátrak irányába. Egy másik ember egyedül járt a testek között, időnként megállt, lehajolt, aztán továbbment. Néhányan szekereket húztak a mező belseje felé. Az egyikre már több alakot fektettek egymás mellé, de innen nem lehetett látni, melyikük él még.
A fehér sátrak körül sűrűbb volt a mozgás.
Ott a távolság először csak világos és sötét foltokat mutatott, később azonban ki lehetett venni a földön fekvő emberek hosszú sorát. Voltak, akik ültek, mások oldalukon vagy hátukon feküdtek. Kötések fehérlettek karokon, fejek körül, mellkasokon, bár a vászon sok helyen már olyan sötét volt, hogy csak az érintetlen szélein maradt meg eredeti színe. Egy férfi vödörrel járt közöttük, minden néhány lépés után lehajolt, aztán továbbment a következőhöz. Valahol mellette többen tartottak valakit, akinek mozgásából csak annyi látszott, hogy nagyon szeretett volna elkerülni onnan.
A dombig a hangok késve érkeztek fel.
Nem a csata hangjai voltak. Nem kürt szólt, nem fegyverek csattogtak, és senki sem ordított rohamot. A zaj szétszórtan jött a mezőről: lovak nyerítése, kocsik recsegése, távoli kiáltások, valaki nevének ismételt hívása, aztán egy hosszú, emberi hang, amely egyszer csak kiemelkedett a többiből. Nem lehetett érteni, mit mond. Talán nem is mondott semmit.
A fiú mellett valaki megmozdult, de ő nem fordult oda.
Lent a domb alján, ahol a föld valamivel mélyebben feküdt, a korábbi esők vize még megmaradt a keréknyomokban. A nap fénye vörösesen csillant rajtuk. Ugyanez a szín húzódott végig több sekély árokban is, és ahogy a tekintete követte őket a mező belseje felé, egyre sötétebbé váltak. Az egyik tócsánál egy ember guggolt, két kézzel vizet mert belőle egy sisakba, majd amikor felemelte, mintha meggondolta volna magát, kiöntötte, és továbbment.
A fiú innen már látta, miért.
A föld nem mindenütt volt sáros.
A vörös azokból a helyekből indult, ahol a legtöbb test feküdt.
Keskeny erekben folyt lefelé, összeült az esővízzel, megtöltötte a lovak patája és a szekérkerekek által vájt mélyedéseket, majd lassan felszívódott ugyanabba a földbe, amely néhány ölre onnan még száraz és világos volt.
A nap közben közelebb ért a látóhatárhoz.
A távoli erdő fáinak alsó része már árnyékba merült, koronájuk azonban vöröses fényt kapott. Ugyanaz a fény feküdt végig a mezőn is, és egy pillanatra szinte elfedte a különbséget a természetes és a másik vörös között. Az ég alja lángolt, a felhők széle rézszínű lett, a sárban összegyűlt vér pedig ugyanazt a napot tükrözte vissza.
Valahol messze tüzet gyújtottak.
Először csak egyet.
A fiú azt hitte, az esti táborhoz készítik, mert a nap már valóban közel járt a végéhez. Emberek hordtak fát hozzá, hosszú hasábokat és szétszedett szekérdarabokat. A láng alacsonyan indult, majd amikor újabb fa került rá, hirtelen felcsapott.
Nem sokkal később egy másik helyen is füst emelkedett.
Aztán egy harmadikon.
Az első máglyához ekkor egy szekér érkezett.
A férfiak lassan leemelték róla a rakományt.
A távolság még kegyes volt hozzájuk. Nem mutatott arcokat, nem mutatott sebeket, nem mutatta a ruhák szakadását vagy a kezeket, amelyek néha kilógtak a testek mellől. Csak azt lehetett látni, hogy az emberek, akik a szekérről lekerültek, már nem segítettek azoknak, akik vitték őket.
Egymás mellé fektették őket a fa közé.
Amikor a tűz elérte őket, a láng egy időre alacsonyabb lett, aztán újra magasra csapott.
A szél ekkor fordult a domb felé.
A füst ért fel hozzájuk először.
Keserű volt és nehéz, nedves fával, sárral, trágyával és valamivel, amire a fiú nem ismert rá. Megült a torkában. Az ember ösztönösen rövidebben vett tőle levegőt, de ettől nem lett kevesebb. Többen a szájuk elé húzták a kendőjüket.
Márton nem mondott semmit.
A fiú oldalra nézett rá, talán mert az út során megszokta, hogy Márton mindenre talál valamit, amin nevetni lehet. Most azonban csak állt, egyik kezével a pajzs szélét fogva, és nézte a mezőt. Péter mellette volt, szája kissé nyitva maradt, mintha valamit kérdezni készülne. András az állát lehajtva nézett lefelé, és az arcáról nem lehetett eldönteni, látott-e már ilyet.
A fiú visszafordult a síkság felé.
A csatát egész úton valami mozgó dolognak képzelte. Emberek rohannak, lovak vágtatnak, kardok emelkednek, pajzsok csapódnak össze, zászlók lobognak, és minden olyan gyorsan történik, hogy nincs idő gondolkodni rajta.
Itt semmi sem sietett.
A halottak nem mozdultak. A sebesültek mellett dolgozó emberek elfáradt, kimért mozdulatokkal jártak egyik testtől a másikig. A szekerek lassan döcögtek a sáron keresztül. A gödröt ásó férfiak ugyanazzal a mozdulattal emelték és engedték le az ásót. A máglyák lassan nyelték el azt, amit rájuk tettek. A vér lassan folyt a keréknyomokban.
Az egész vidék ráért.
Csak azoknak fogyott el az idejük, akik odalent feküdtek.
A nap alsó széle hozzáért a távoli dombokhoz. Árnyék kúszott végig a síkságon, először az erdő alját nyelte el, aztán a sátrakat, majd lassan elérte a mező szélét. Ahol már nem sütött a nap, eltűntek a részletek. A föld újra egyetlen sötét felületté kezdett összeolvadni, amelyből itt-ott még kivillant egy fémfelület, megmozdult valaki, vagy fellobbant egy fáklya.
A máglyák azonban egyre világosabbak lettek.
Már nem lehetett őket összetéveszteni a tábor tüzeivel.
Magas lángjuk vörösen világította meg a körülöttük mozgó alakokat, a füst fekete oszlopokban emelkedett föléjük, aztán a szél széthúzta az egész mező fölött. Néha egy-egy lángnyelv olyan magasra csapott, hogy még a dombtetőről is látni lehetett, ahogy belül összerogy a farakás, és szikrák százai indulnak felfelé az este felé.
Lent, a lejtő tövében a sár már csaknem feketének látszott.
A mélyedésekben azonban még megfogta a nap utolsó fényét a vérrel kevert víz, és hosszú, vörös csíkokban húzta végig a földön egészen addig, amíg az árnyék el nem nyelte.
A menet továbbra is a dombon állt.
Senki sem sürgette őket.
Mintha azoknak, akik idehozták őket, fontos lett volna, hogy legyen idejük végignézni.
A fiú előző este még azt írta az anyjának, hogy jó emberek vannak mellette, hogy megtanulták, amit kellett, hogy vigyázni fognak egymásra, és ennyi ember között nehéz elképzelni, hogy éppen vele történjen valami.
Odalent több ezer ember gondolhatta ugyanezt.
A nap eltűnt.
A csatatér fölött lassan besötétedett az ég, a völgyet elborította a füst, és a vérrel keveredett sárból már csak annyi látszott, amennyit a tüzek vörös fénye megmutatott.
A halotti máglyák tovább égtek.
