<main><div class="reader-width reader-top"><a class="back-link" href="index.html">← Színvakság</a></div><header class="reader-width reader-header fade-in"><p class="eyebrow gold">Rózsaszín</p><h1 class="display-title">A gondoskodás rózsaszín színe</h1></header><div class="reader-width"><div class="rule"></div></div><textarea id="story-source" class="story-source" aria-hidden="true">## I. A ház

A folyó ugyanazzal a lassú türelemmel vitte lefelé a vizét a falu mellett, amellyel hosszú emberöltők óta kerülte meg a part köveit és a beléjük kapaszkodó gyökereket, felszínén reggelente még sokáig megmaradt az ég halvány fénye, mielőtt a nap magasabbra kapaszkodott volna, a part mentén sorakozó füzek hosszú ágai pedig néhol olyan mélyre hajoltak, hogy legalsó leveleik minden gyengébb hullámnál hozzáértek a vízhez. A keskeny ösvényeken már korán megindult az élet; valaki korsóval ereszkedett lefelé, más mosnivalót vitt a karján, gyerekek kerülgették egymást a porban, aztán a házak között eltűntek a hangok, hogy valamivel később máshonnan bukkanjanak elő, egy udvarból, egy nyitott ablak mögül vagy a folyóhoz vezető következő lejárónál.

A falu a víztől lassan emelkedő földre kapaszkodott fel, házai között keskeny utak kanyarogtak, kerítések mögül gyümölcsfák koronája hajolt az utcára, a kapuk tövében a reggeli árnyék még akkor is tartotta magát, amikor a tetők cserepeit már felmelegítette a nap. Az alsóbb házakhoz közelebb lehetett hallani a folyót, feljebb már inkább csak a füzek koronája mutatta, merre húzódik, s ha szél érkezett a víz felől, végigfutott a kerteken, megmozdította a kifeszített vásznakat, belenyúlt a nyitott ablakokon át a szobákba, majd valahol a házsorok között elfogyott.

Az egyik utcában, ahol két egymás felé hajló diófa lombja délutánonként csaknem összeért az út fölött, egy világos falú ház állt a többi között. Az utcára két ablaka nézett, alattuk keskeny virágágyás húzódott, amelyben a föld sötétebb maradt a reggeli locsolástól, a kapu és a bejárati ajtó közötti rövid ösvény mellett pedig egy alacsony pad állt, egyik lába alatt lapos kővel, mert a föld ott valamivel mélyebbre süppedt. A tető árnyéka délelőtt még elérte az ablakok felső részét, délutánra azonban végigvonult az egész homlokzaton, és a szobákba már sárgásan érkezett a fény.

A bal oldali ablak mögött egy keskeny szoba feküdt.

Az ágyat a fal mellé tolták, úgy, hogy aki rajta feküdt, oldalra fordítva a fejét kiláthatott az utcára, bár az ablak alsó pereme magasabban húzódott annál, hogy a padlóról sok minden látszódjék rajta keresztül. A szemközti falnál alacsony szekrény állt, tetején fakockák, néhány faragott állat és egy színesre festett labda, amelynek egyik oldaláról már lekopott a vörös festék. A sarokban kis asztal kapott helyet két székkel, az asztalon vastag papírlapok feküdtek egymásra csúszva, mellettük néhány rövidre használt színes rúd, a padlót pedig puha, gyapjúból szőtt szőnyeg borította, amelynek egyik sarka rendszeresen felkunkorodott.

Bence ezt a sarkot minden reggel visszataposta.

Mezítláb járt át rajta, egyik lábát egy kicsit erősebben tette le a másiknál, aztán megállt az ablak alatt, két tenyerét a párkányra tette, és lábujjhegyre emelkedett, ameddig csak tudott. Így már látta az út túlsó szélét, az ott futó kerítést és a fölé hajló lombot, ha pedig valaki elhaladt a ház előtt, néhány pillanatra annak vállát, fejét vagy a kezében vitt kosarat is.

Aznap egy asszony ment el korsóval.

Bence követte a szemével addig, amíg eltűnt az ablak keretének szélénél, aztán még néhány pillanatig ugyanúgy állt, mintha onnan is láthatná, merre folytatja az útját.

– Hé! – kiáltott utána. – Hé! Hall engem?

Az asszony nem jelent meg újra.

Bence leereszkedett a sarkára.

Haja alvás után az egyik oldalon még mindig laposan simult a fejéhez, a másikon felállt egy tincs, amelyet már kétszer hátrasimított a tenyerével, és mindkétszer lassan ugyanoda tért vissza. Az inge túl új volt rajta, a vászon még keményen tört a könyökénél, amikor behajlította a karját, nadrágjának szára pedig valamivel rövidebb lett volna az ideálisnál, ezért ülés közben mindig kilátszott a bokája.

A szoba ajtaja nyitva állt.

Mögötte keskeny folyosó vezetett a ház közepébe, néhány lépés után jobbra nyílt a nagyobb szoba, balra egy kisebb helyiség, amelynek ajtaját többnyire csukva tartották, a folyosó végén pedig az előtér feküdt a bejárati ajtóval. Onnan egy másik irányba fordulva lehetett eljutni a konyháig, amelynek kövezett padlója hűvösebb maradt a szobák deszkáinál, még délután is, és ahol reggeltől estig más-más illat ült meg a levegőben: friss kenyér, főtt tej, hagyma, száradó fűszerek, időnként valami édes, amit Bence még azelőtt megérzett, hogy meglátta volna az asztalon.

Már kívülről tudta, melyik deszka nyikorog a nagy szoba előtt.

Tudta, hogy a folyosó végén lévő kis asztalra kerülnek esténként a kulcsok.

Tudta, hogy a bejárati ajtó vastagabb minden más ajtónál a házban.

És azt is tudta, hogy hiába fordítja el rajta a fémből készült fogantyút, az ajtó nem nyílik ki.

Az első napokban sokáig próbálkozott vele. Két kézzel markolta meg, ránehezedett egész testsúlyával, egyszer széket is húzott oda, hogy magasabbról férjen hozzá, de a széklába olyan hangosan csikordult végig a padlón, hogy a nő kijött a konyhából.

Bence akkor az ajtó előtt állt.

– Haza akarok menni.

A nő megállt néhány lépésre tőle.

Középkorú asszony volt, barna hajában néhány világosabb szállal, amelyeket reggelente lazán összefogott a tarkóján, délutánra azonban rendszerint kiszabadult közülük néhány, és az arcához simult. A kötényén lisztes ujjnyomok maradtak.

– Már felébredtél?

– Engedjen ki.

A nő elmosolyodott.

– Mindjárt kész lesz az ebéd.

– Nem érdekel. Haza akarok menni.

Bence hangja a végére elvékonyodott, amitől még dühösebb lett, ezért ököllel egyszer rácsapott az ajtóra.

A nő odalépett hozzá.

– Jól van.

Bence hátrált egyet.

– Ne érjen hozzám.

Az asszony leguggolt előtte, és kisimította a homlokába hullott haját.

– Semmi baj.

– Anyukámat akarom.

A nő keze egy pillanatra megállt a hajában, aztán lassan végigsimított rajta újra, a füle mögé igazította a kósza tincset, majd felállt.

– Gyere. Kapsz enni.

Bence ott maradt az ajtónál.

Az asszony néhány lépés után visszanézett rá, aztán továbbment a konyha felé.

A fiú még egy ideig a kilincsen tartotta a kezét.

A konyhából tányér halk koppanása hallatszott, majd a nő hangja, ugyanazzal a csendes, nyugodt dallammal, ahogy máskor is szólt hozzá.

– Gyere.

Bence levette a kezét az ajtóról.

A folyosón végigmenve a nagy szoba nyitott ajtajánál egy pillanatra megtorpant. A délelőtti fény már elérte a szőnyeg szélét, a kanapé mellett álló kis asztalon két üres csésze maradt az előző estéről, a karosszék háttámláján pedig ott feküdt a férfi összehajtott felsőruhája. Az egész ház olyan rendezett és megszokott volt körülötte, mintha hosszú évek óta ugyanígy telnének benne a reggelek.

Bence még csak huszonhárom napja lakott ott.

Mindet megszámolta.

## II. A napok

A huszonharmadik nap reggelije sem különbözött sokban az előzőktől, csak a tej tetején képződött vékony hártya bosszantotta Bencét jobban, mint máskor, ezért a kanál hegyével hosszú ideig próbálta a csésze széléhez terelni, míg végül sikerült egyetlen összegyűrt darabban kiemelnie, és óvatosan a tányér mellé tette. A nő közben kenyeret vágott a konyhaasztal másik végén, az első szeletet vastagabbra hagyta, a másodikat már vékonyabbra szelte, aztán amikor észrevette a csésze mellett fekvő tejhártyát, közelebb hajolt, belenézett, és Bence arcára pillantott.

– Nem kérem.

Az asszony elvette előle a csészét, egy másikat tett a helyére, abból töltött neki, majd a saját ujjával leszedte a tetején maradt apró fehér foltot.

– Így jó lesz.

– Én haza akarok menni.

A nő letette elé a kenyeret.

– Tessék.

Bence nem nyúlt hozzá rögtön, csak nézte a tányér szélén végigfutó kék vonalat, amely egy helyen megszakadt egy régi csorbulásnál, és eszébe jutott, hogy otthon is volt egy hasonló tányérjuk, azon virágok futottak körbe, apró piros levelekkel, és az anyja mindig a polc legfelső részére tette, mert azt mondta, ünnepre való. Már többször megpróbálta elmagyarázni, merre van az otthonuk, beszélt a kútról, amelynél az út elkanyarodott, a szomszéd magas kerítéséről, a nagy eperfáról, amelynek egyik ága átnyúlt az udvaruk fölé, még arról a repedésről is a ház falán, amely télen vékony fekete vonalnak látszott, nyáron pedig szinte eltűnt a vakolat színében. A nő minden alkalommal meghallgatta, néha leült mellé, néha munka közben pillantott rá, és amikor Bence hangja sírásba csúszott, odament hozzá, végigsimított a hátán vagy kisimította a haját a szeméből.

Bence eleinte azt hitte, ha elég pontosan mondja el, egyszer csak megértik.

A huszonharmadik napra már inkább azért mondta, mert félt, hogy ha abbahagyja, valami elkezd eltűnni belőle.

– Az anyukámnak barna kendője van – mondta most is. – Kicsi kék virágok vannak rajta. A szélén meg van szakadva. Ő biztos keres engem.

A nő a tűzhely mellől ránézett.

– Egyél, amíg meleg.

Bence leszakított egy darabot a kenyérből.

A férfi valamivel később érkezett a konyhába, már felöltözve, haját nedves kézzel hátrasimítva, egyik kezében az övét tartotta, amelyet menet közben csatolt magára. Amikor meglátta Bencét az asztalnál, megsimította a fiú feje búbját, aztán a nő mögé lépett, és lopott egy darabot a frissen vágott kenyérből.

– Az neked van? – kérdezte Bence.

A férfi rámosolygott, beleharapott.

– Jó reggelt.

– Maga tudja, hol lakom?

A férfi a nő felé fordult.

– Ma is korán kezdte?

– Már az ajtónál volt, mire felkeltem.

– Nem az ajtónál voltam. Ki akartam menni.

A férfi egy pillanatra Bencére nézett, aztán a szék támlájára tette a kezét.

– Lassan megszokhatná.

– Nem maradok itt.

A nő odatolta a férfinak a kenyeres tányért.

– Hagyd.

– Semmit sem csináltam.

– Tudom.

A férfi újabb szeletet vett, majd mielőtt kiment volna, két ujjal megbökte Bence vállát.

– Egyél.

Bence összeráncolta a homlokát.

– Maga mindig ezt mondja.

A férfi már az előtérben járt, amikor még visszaszólt a nőnek, hogy aznap később ér haza; közben a kabát zizegése és a kulcsok csörrenése töltötte meg az előteret. Bence azonnal felállt.

A széklába végigkarcolta a konyha kövét, a nő pedig még utána szólt, de ő már a folyosón futott. Mire az előtérbe ért, a férfi egyik kezével a kilincset tartotta, a másikkal a kulcsot fordította el.

– Vigyen magával!

A férfi hátranézett.

Bence két lépésre állt tőle, mezítláb, félig megevett kenyérrel a kezében.

– Csak egyszer. Nem megyek el. Megígérem.

A férfi elmosolyodott, lehajolt hozzá, tenyerével végigdörzsölte a fiú haját, amitől az alvás óta makacsul felálló tincs még jobban szétterült.

– Maradj szépen.

– Csak az utcáig. Nem szaladok el.

A férfi kiegyenesedett, kinyitotta az ajtót, és egyetlen pillanatra bejutott rajta az utca reggeli levegője, a nedves föld, valamilyen füst és a közeli pékségből vagy konyhából kiszökő sült tészta szaga. Bence megmozdult felé, de a nő már mögötte állt, és a vállára tette a kezét.

– Gyere reggelizni.

– Csak látni akarom, hol vagyok.

Az ajtó becsukódott.

A kulcs kívül megfordult benne.

Bence még sokáig nézte a fa erezetét azon a helyen, ahol a férfi eltűnt mögötte, aztán megette a kezében maradt kenyeret, mert közben megéhezett.

A délelőttök rendszerint lassabban teltek. A nő ilyenkor a konyhában dolgozott, ruhát hajtogatott, söpört, vizet hozott a hátsó helyiségből, időnként pedig eltűnt a hálószobában, ahová Bence ritkán követte. A fiú szabadon járhatott a többi helyiség között, és az első napokban szinte mindent megvizsgált, amihez hozzáfért: megszámolta a nagy szoba polcain sorakozó könyveket, végighúzta az ujját a faragott láda mintáin, benézett az asztal alá, felmászott a kanapéra, hogy elérje az ablakot, kinyitotta a konyhaszekrény alsó ajtajait, ahol cserépedényeket, zsákba kötött lisztet és hagymát talált, egyszer pedig olyan sokáig nézte a falióra ingáját, hogy azt hitte, sikerül majd észrevennie azt az egyetlen pillanatot, amikor egyik oldalról a másikra fordul.

A ház idővel már nem tartogatott számára sok meglepetést, és ettől egyre fontosabbak lettek az apró változások.

Ha a nő másik terítőt tett az asztalra, Bence rögtön észrevette.

Ha a férfi sáros cipővel érkezett haza, tudta, hogy odakint esett.

Ha a nagy szoba ablakán túl sokáig billegett egy ág, kitalálta, hogy szeles nap van, és olyankor odaült a párkány alá, mert néha egy-egy száraz levél sodródott fel az üveghez.

A nő hamar megtanulta, hogy Bence szeret rajzolni. Az első néhány papíron szinte mindig ugyanaz jelent meg: egy ház, mellette fa, a ház előtt négy alak. Az egyik magasabb volt a többinél, a következőnek hosszú ruhát rajzolt, közöttük két kisebb figura állt, az egyik Bence, a másik az öccse, akinek a fejét eleinte mindig túl nagyra sikerült rajzolnia.

Az asszony egyszer sokáig nézte az egyik képet.

– Ez az otthonom – mondta Bence. – Ez anya. Ez apa. Ez meg Marci. Ő hatéves, de azt mondja, már hét, mert nem akar kicsi lenni.

A nő ujjával megérintette az egyik rajzolt alakot.

– Szép.

– Nem magát rajzoltam.

Az asszony mosolya megmaradt.

Bence felnézett rá.

A nő megsimogatta a haját, aztán az asztalon hagyta a rajzot, és visszament a konyhába.

Délutánonként gyakran együtt ültek a nagy szobában. A nő varrt vagy foltozott, Bence pedig a szőnyegen épített a fakockákból, eleinte csak azért, mert nem volt más dolga, később már azért, mert rájött, hogy a hosszúkás darabokat egymásra fektetve olyan hidat tud építeni, amely alatt a legnagyobb faragott állat is átfér. Az állatok között volt ló, kutya, kecske és valami széles hátú, rövid lábú lény, amelyről Bence nem tudta eldönteni, mit akart ábrázolni a faragó; ezt rendszerint a híd őrének tette meg.

Egyik délután a torony ledőlt, amikor a nő felállt, és a szoknyája széle hozzáért az egyik kockához.

Bence felszisszent.

– Ne!

A nő azonnal megállt.

A fél torony még egy pillanatig tartotta magát, aztán három felső darab is lecsúszott, az egyik egészen a kanapé lábáig gurult.

– Ezt egész délután építettem.

A nő leguggolt mellé, felvette a leesett darabokat, és egyenként Bence elé tette őket.

– Megcsináljuk.

– Ne nyúljon hozzá.

Bence gyorsan a nő keze elé tette a sajátját, és magához húzta a szétszóródott kockákat. Az asszony megállt.

Bence összeszedte a kockákat, újra kezdte az alsó sort, és néhány percig egyikük sem szólt. A nő végül visszaült a helyére, de amikor a torony másodszor már magasabb lett az elsőnél, lehajolt, megnézte, és elmosolyodott.

Este a férfi gyakran a nagy szobában ült velük. Bence hamar felismerte a kulcs hangját, amikor a zárban fordult, és néhány nappal korábban észrevette magán, hogy ilyenkor mindig felemeli a fejét.

Ez bosszantotta.

A huszonharmadik nap estéjén is így történt.

A férfi belépett, letette a kabátját, cipőjéről leverte az út porát, és mire a nagy szobába ért, Bence már megint a kockák mellett ült. A férfi megállt mögötte, majd a fakockákból emelt építményre mutatott.

– Ez meg mi?

Bence a fakockákból emelt falra mutatott.

– Ház.

A férfi lehajolt, egyik kezét a térdére támasztotta, és közelebbről nézte meg az építményt.

– Jó nagy lett.

Bence a két oldalfal között hagyott nyílásra mutatott.

– Van benne szoba is.

A férfi a legfelső kockához nyúlt.

– Ne! Az tartja.

Bence gyorsan a kéz és a torony közé tette a tenyerét. A férfi megállt, aztán mindkét kezét felemelte maga elé.

– Jól van, jól van.

Leült mellé a szőnyegre, bár a térde láthatóan nem szerette a mozdulatot, és kisvártatva felvett egy hosszúkás darabot. Bence megrázta a fejét, kivette a kezéből, visszatette a kupacba, majd egy rövidebbet nyomott a férfi tenyerébe.

A férfi megnézte a darabot, aztán Bencére pillantott.

– Akkor ezt.

Bence az oldalfal egyik üres helyére mutatott. A férfi odaillesztette a kockát, a fiú pedig rögtön a következő után nyúlt.

Ezután már szinte szavak nélkül haladtak: a férfi választott, Bence hol bólintott, hol megrázta a fejét, néha elvette tőle a darabot és másikat adott a kezébe, a férfi pedig egy idő után olyan eltúlzott óvatossággal várta meg minden mozdulat előtt Bence jelzését, hogy a fiú végül elnevette magát.

A férfi is.

A nő a karosszékből nézte őket, tűje közben tovább járt a vászonban, öltésről öltésre, egészen addig, amíg a ház egyik fala ismét össze nem dőlt, ezúttal Bence könyökétől.

A férfi nevetett fel először.

Bence néhány pillanatig sértetten nézett rá, aztán ő is.

Később, amikor már az ágyában feküdt, a nő leült mellé. Bence az oldalára fordult, hátat mutatva neki, de amikor az asszony végigsimított a haján, nem húzódott el.

– Maga szerint anya még keres?

A nő lassan mozgatta tenyerét a fején.

– Aludj.

– Szerintem igen.

A kéz tovább simogatta.

– Apa biztos mindenhová elment. Ő mindig megtalál mindent.

– Aludj szépen – mondta halkan a nő.

A halk hang addigra már összefolyt benne az álommal.

Még hallotta, ahogy az asszony feláll, eligazítja rajta a takarót, majd az ajtó felé indul, és mielőtt a folyosó sötétebb csendje elnyelte volna a lépteit, Bence félálomban az ajtó felé nyújtotta a kezét, és utána szólt.

– Ne csukja be teljesen.

A nő megállt.

Az ajtó keskeny résnyire nyitva maradt.

Bence ezen keresztül sokáig látta a nagy szobából kiszűrődő meleg világosságot, és hallotta a férfi mélyebb, a nő halkabb hangját, ahogy egymással beszélgettek; a mondatok ritmusa lassan összekeveredett benne az álommal.

Aznap éjjel először nem számolta végig újra a huszonhárom napot.

## III. Az eső

Az eső a harmincadik nap hajnalán érkezett meg a folyó felől, előbb csak a füzek leveleit fordította meg a szél, aztán a háztetőkön is megszólaltak az első cseppek, ritkán és külön-külön, hogy rövid idő múlva már összefüggő zúgás töltse meg az utcát, a kerítések alján vékony erekben induljon meg a víz, a diófák ágain összegyűlt nedvesség pedig nagyobb cseppekben hulljon le az alattuk sötétedő földre.

Bence az ágyából hallgatta.

Az ilyen reggeleket otthon szerette, mert az anyja ilyenkor később engedte ki őket az udvarra, Marci pedig rendszerint már felöltözés előtt az ablakhoz húzott egy széket, hogy megnézze, mekkorák lettek a tócsák. Ha elég sok víz gyűlt össze, délután papírhajókat hajtogattak, és végigküldték őket az út szélén futó árokban, amíg valamelyik el nem akadt egy fűcsomóban vagy fel nem borult egy kövön.

Bence sokáig feküdt mozdulatlanul, aztán kibújt a takaró alól, és az ablakhoz ment.

Az utca most egészen más volt, mint napsütésben. A por eltűnt, a kerítésdeszkák megsötétedtek, az ereszről egyenletes sugárban folyt le a víz, és az út túlsó oldalán álló bokor levelei minden nagyobb csepp alatt megrezdültek. Egy férfi futott el az ablak előtt, kabátját a feje fölé tartva; csak a vállát és az egyik karját lehetett látni, aztán ő is eltűnt.

Bence az üvegre tette a tenyerét.

Hideg volt.

– Marci ilyenkor már kint lenne – mondta.

A szoba nem válaszolt.

Később a konyháig eljutott, de a reggeli felét sem ette meg. A kenyér száraznak tűnt, pedig ugyanabból a cipóból vágták, amelyből előző este még két szeletet is kért, a tejnek pedig olyan szaga volt, amit máskor észre sem vett.

A nő a tűzhely mellett állt, amikor Bence félretolta a tányért.

Ránézett.

– Nem kérem.

Az asszony odalépett, megérintette a tányért, majd Bence homlokára tette a tenyerét.

A fiú hátrahúzta a fejét.

– Mit csinál?

A nő újra hozzáért, ezúttal rövidebben, aztán az asztalon maradt ételre nézett.

– Nem vagy éhes?

– Mondtam, hogy nem kérem.

Az asszony levette a tányért, helyére egy bögre vizet tett, és néhány pillanatig még ott maradt mellette.

Bence ivott.

A víz jólesett.

Délelőtt megpróbált játszani, de a kockák valahogy nem akartak a helyükön maradni. Kétszer is rossz darabot tett a fal tetejére, harmadszorra pedig csak ült a szőnyegen, kezében egy hosszúkás fakockával, és nem jutott eszébe, mit akart építeni belőle.

A nő a nagy szobában ruhát hajtogatott.

Bence végül odavitte neki a kockát.

– Ezt maga szerint hová tegyem?

Az asszony elvette, megforgatta az ujjai között, aztán visszaadta neki.

– Szép.

– Nem azt kérdeztem.

A nő tovább hajtogatta a ruhát.

Bence még ott állt mellette egy darabig, aztán leült a kanapé szélére. A feje nehéznek érződött, a szoba melege pedig egyre sűrűbben ült körülötte, ezért felhúzta maga mellé a lábát, hátát a karfának támasztotta, és nézte, ahogy az asszony egymásra rakja a vászondarabokat.

Egy inget félbehajtott.

Aztán még egyszer.

Elsimította rajta a gyűrődést.

Bence lehunyta a szemét.

Amikor újra kinyitotta, már takaró volt rajta.

A nő a mellette álló széken ült, varrás helyett csak összekulcsolt kézzel, és néha Bence arcára nézett.

– Mennyi az idő?

Az asszony közelebb hajolt.

– Felébredtél?

– Hol van a bácsi?

– Pihenj még – mondta a nő, aztán megint Bence homlokára tette a kezét.

Ezúttal nem húzódott el.

A tenyér hűvös volt.

Bence néhány pillanatig még nyitva tartotta a szemét, aztán ismét elaludt.

Délutánra a láz erősebb lett. Az eső közben sem hagyott alább, a csatornák megteltek, az udvaron álló hordó pereméről időnként túlcsordult a víz, bent pedig a nő többször rakott a tűzre, bár Bence egyszer fázott, máskor melege volt, és mindkettő miatt panaszkodott.

A férfi a szokottnál korábban jött haza.

Az ajtó nyitására Bence most nem emelte fel a fejét. A kanapén feküdt, arccal a háttámlának fordulva, és csak a férfi hangjáról tudta, hogy megérkezett.

A két felnőtt sokáig beszélt egymással a konyhában, miközben az eső egyenletesen verte az ablakot.

– Reggel óta alig evett – mondta a nő. – Dél óta egyre melegebb.

– Mióta alszik?

– Nem sokkal dél után feküdt le.

Bence a kanapéról csak a hangjuk váltakozását hallotta, a nő csendesebb mondatainak és a férfi mélyebb hangjának ritmusát; nem sokkal később lépések közeledtek felé.

A férfi leült a kanapé mellé.

– Na.

Bence nem fordult meg.

A férfi hátára tette a kezét.

– Maga is ezt csinálja?

A férfi elmosolyodott, aztán a tenyerét Bence homlokára tette.

– Meleg.

– Mindenki a homlokomat fogdossa.

A férfi felnevetett.

– Na, legalább beszél.

Bence visszafordult a háttámla felé.

Néhány perc múlva a férfi már nem volt ott, de este, amikor Bence felébredt, ő hozta be a tálat. Valamilyen leves volt benne, vékonyra vágott zöldséggel és apró húsdarabokkal, a tetején pedig néhány sárga zsírcsepp úszott.

A férfi az asztalra tette.

– Ebből enni kell.

Bence megrázta a fejét.

– Nem kérem.

– Egész nap nem ettél.

Bence ismét megrázta a fejét.

– Nem vagyok éhes.

A férfi kifújta a levegőt, és a nőre nézett.

– Mondtam.

Az asszony elvette tőle a tálat, leült Bence mellé, és az ölében tartotta.

– Csak egy kicsit.

Bence elfordította a fejét, és megrázta.

– Nem.

A nő nem nyújtotta felé a kanalat.

Várt.

Bence becsukta a szemét, aztán néhány perc múlva megint kinyitotta. A leves még mindig ott volt. A férfi időközben átült a karosszékbe, kezében könyvvel, de egyetlen oldalt sem lapozott.

– Ha megeszem, kiengednek?

A nő rámosolygott.

– Finom.

Bence a tálra nézett.

– Csak az ajtót nyissák ki.

A nő megkeverte a levest.

– Még meleg.

Bence végül felült, elvette tőle a kanalat, és evett néhány falatot.

A férfi a könyv fölött ránézett.

– Na végre.

Bence nem nézett fel.

A levesből öt kanállal evett, a hatodikat már nem kérte. A nő nem próbálta rábeszélni, visszavitte a tálat a konyhába, aztán hideg vízbe mártott egy kendőt, kicsavarta, és Bence homlokára tette.

A fiú először összerezzent.

Aztán jólesett.

Az este hátralévő részében többször cserélte rajta.

Az éjszaka közepén Bence arra ébredt, hogy nem tudja, hol van.

A szoba sötét volt, csak az ablakon túl derengett valami halvány világosság, az eső pedig még mindig verte a tetőt, de álmában más hangja volt, közelebbi, erősebb, mintha a víz már a szobában folyna, és valaki a folyosóról kiabálná a nevét.

Bence felült.

– Anya?

A ház csendes maradt.

– Anya!

Lerúgta magáról a takarót, kiszállt az ágyból, és kiment a folyosóra.

A deszkák hűvösek voltak a talpa alatt. A nagy szoba sötétlett, a konyha felől csak a tűzhely parazsának gyenge fénye derengett, a folyosó másik oldalán azonban a többnyire csukva tartott ajtó most résnyire nyitva maradt.

Bence odament.

Ez volt a házaspár hálószobája.

Korábban csak néhányszor látott be ide, amikor a nő ágyneműt hozott ki vagy a férfi reggel öltözött. A szoba kisebb volt, mint képzelte, benne széles ággyal, két oldalt egy-egy alacsony asztallal, a fal mellett ládával és egy magas szekrénnyel, amelynek tetején Bence számára ismeretlen tárgyak sorakoztak. Az egyik sarokban szék állt, rajta a férfi ruhája.

Bence az ajtóban maradt.

– Anya?

A nő megmozdult az ágyban.

Felült.

Néhány pillanat múlva már ott állt előtte, hálóruhája fölé takarót húzva a vállára, és mielőtt Bence bármit mondhatott volna, lehajolt hozzá.

– Mi történt?

– Rosszat álmodtam.

Az asszony a fiú arcára tette a kezét.

– Már jobb.

– Anyáról álmodtam.

A nő megsimította a haját.

Bence egy pillanatig még állt előtte, aztán váratlanul közelebb lépett, homlokát az asszony hasának támasztotta, és két kezével belemarkolt a hálóruha anyagába.

A nő lehajolt hozzá.

Nem mondott semmit.

Csak simogatta.

Bence sírása eleinte hangosabban tört elő, aztán lassan elcsendesedett, a keze azonban még sokáig nem engedte el a ruhát.

A férfi közben felébredt.

Az ágyban ülve nézte őket, majd félrehúzta magán a takarót.

– Hozd ide.

A nő Bencére nézett, aztán az ágyra.

Bence nem tudta, mit akar.

– Nem akarok egyedül lenni.

Az asszony felemelte a takarót.

Bence bemászott közéjük.

A férfi arrébb húzódott, aztán amikor Bence lába hozzáért, összerándult a takaró alatt. – Jéghideg a lába – morogta a nőnek, de közben ráterítette Bencére a takaró szélét is. A fiú a nő felé fordult, a térdét felhúzta, és néhány perc múlva már csak az esőt hallotta, meg mögötte a férfi lassúbb lélegzetét.

A nő keze még akkor is a haján pihent, amikor elaludt.

Reggel Bence ébredt elsőnek.

Egy ideig mozdulatlanul feküdt közöttük.

A nő arca közel volt hozzá, alvás közben idősebbnek látszott, a szája mellett húzódó két vonal mélyebb lett, néhány hajszál pedig az arcára tapadt. Bence nézte, aztán óvatosan kihúzta magát a takaró alól.

Az ajtóhoz érve visszafordult.

A férfi még mindig aludt.

A nő szeme kinyílt.

Bence megállt.

– Csak visszamegyek a szobámba.

Az asszony rámosolygott, majd becsukta a szemét.

Bence kiment a folyosóra.

A láza már alig maradt meg, a feje könnyebb volt, és mire a saját szobájába ért, az eső is gyengült. Az ablakhoz húzta a széket, felmászott rá, és most már jóval többet látott az utcából, mint a padlóról.

A víz még futott az út szélén.

Az egyik árokban valami fehér sodródott lefelé.

Bence hunyorogva nézte, amíg közelebb nem ért.

Egy összeázott papírdarab volt, egyik sarka felhajolva, és ahogy vitte a víz, egy pillanatra egészen olyan alakot vett fel, mint egy apró hajó.

Bence addig követte a szemével, amíg el nem tűnt a kerítés mögött.

Marcinak eszébe jutott volna ugyanez.

Ezen elmosolyodott.

Aztán észrevette, hogy már nem sír.

## IV. A várakozás

Néhány nappal az eső után a nő reggeli után levette a kötényét, összehajtva a konyhaasztal szélére tette, majd bement a hálószobába, és amikor újra előjött, már azt a sötétebb ruháját viselte, amelyet Bence addig csak egyszer látott rajta. A haját is gondosabban összefogta, a tarkóján maradt néhány rövid szálat nedves ujjal simította a többi közé, végül az előtér faláról levette a kendőjét.

Bence a nagy szoba küszöbén ült, hátát az ajtófélfának támasztva, előtte egy papírlapon félig elkészült ház állt. A tetőt vörösre színezte, az egyik oldalon már ott volt az eperfa is, a másikra Marci alakját kezdte rajzolni, amikor meghallotta a kulcsok csörrenését.

Letette a színes rudat.

A nő az előtérben a vállára terítette a kendőt.

– Hová megy?

Az asszony lenézett rá, elmosolyodott, aztán végigsimított a fején.

Bence felállt.

– Én is mehetek?

A nő közben lehajolt, megigazította az inge egyik félrefordult gallérját, aztán a bejárati ajtó felé fordult.

– Vigyen magával. Nem fogok elszaladni.

A kulcs a zárba csúszott.

Bence egészen közel ment hozzá.

Amikor az ajtó kinyílt, megérezte az utcáról beáramló levegőt, a még nedves föld szagát és valami frissen sült tésztáét, amely olyan gyorsan eltűnt, hogy mire újra beleszagolt volna, a nő már kilépett. Bence utána mozdult, aztán megtorpant a küszöbnél.

Az asszony még visszafordult hozzá, felemelte egyik kezét. – Maradj itthon szépen – mondta ugyanazzal a nyugodt hanggal, amelyen reggelente az ételt tette elé vagy este a takarót igazította rajta, majd becsukta az ajtót.

A kulcs kívül fordult el.

Bence egy darabig mozdulatlanul állt.

Aztán tenyerét a fára tette.

– Mikor jön vissza?

A háta mögött a férfi dolgozott tovább.

A nagy szoba asztalán egy régi faládika feküdt szétszedve, oldalai egymás mellé sorakoztatva, mellettük néhány keskeny fadarab, szögek és egy kis kés. A férfi már reggel óta ugyanazzal az egyik sarokkal bajlódott, időnként közelebb tartva a szeméhez, máskor az asztalra fektetve és hosszú, egyenletes mozdulatokkal csiszolva rajta.

Bence visszament hozzá.

– Tudja, hová ment?

A férfi felnézett.

Néhány pillanatig nézte Bencét, aztán az asztal túlsó oldalán álló székre ütögette két ujjával a tenyerét.

Bence nem ült le.

– Én csak azt kérdeztem, mikor jön vissza.

A férfi ismét a ládikához fordult.

Bence még ott maradt mellette, aztán lassan visszament az előtérbe.

Aznap délelőtt a ház nagyobbnak tűnt.

A nő nélkül a konyhában nem csörrentek egymáshoz az edények, nem hallatszott víz a tálban, nem nyílt ki újra meg újra valamelyik szekrény ajtaja, és senki nem ment végig a folyosón annyiszor, hogy lépteinek irányából már előre lehessen tudni, melyik helyiség következik. A férfi csak időnként mozdult meg a nagy szobában, széke megnyikordult, a kés végigsercent a fán, aztán hosszú ideig megint csak az óra járása maradt.

Bence először folytatta a rajzot.

Marcinak két lábat rajzolt, aztán kiradírozta az egyiket, mert túl hosszú lett, újrarajzolta, majd az egész papírt félretolta. Átment a nagy szobába, benézett az asztal alá, pedig pontosan tudta, mi van ott, utána ivott a konyhában, végigjárta a folyosót, megállt a bejárati ajtónál, majd visszatért a szobájába.

A következő alkalommal már leült az előtér kis padjára.

A pad szélén egy keskeny repedés futott végig, amelyet eddig nem vett észre. Körmével végigkaparta, aztán megpróbálta belenyomni az ujját, de túl vékony volt hozzá.

A férfi kijött a nagy szobából, amikor meglátta ott, megtorpant. Bencére nézett, aztán a konyha felé intett.

– Nem vagyok éhes.

Bence megrázta a fejét.

A férfi még egyszer intett, majd továbbment.

Bence maradt.

Később mégis utánament, mert a konyhából étel szaga érkezett.

Ebédnél a férfi két tányért tett az asztalra, leült az egyikhez, a másikat Bence elé húzta. A fiú villájával szétnyomott egy darab főtt zöldséget, megkóstolta, fintorgott, aztán inkább kenyeret tört mellé.

A férfi egy darabig figyelte.

Bence meglátta.

– Nem szeretem.

Megrázta a fejét, és arrébb tolta a tányért.

A férfi közelebb húzta hozzá a kenyeret.

Bence abból evett.

Délután a férfi ismét a ládikával foglalkozott, Bence pedig már nem ment vissza a saját szobájába. Előbb a kanapé szélén ült, aztán közelebb húzódott az asztalhoz, végül a férfi mellé állt, és figyelte, hogyan csúszik egymásba két keskenyre faragott darab.

A férfi észrevette a tekintetét.

Kiválasztott két másikat, Bence elé tette őket, majd a kezével megmutatta, hogyan illenek össze.

Bence elvette.

Elsőre fordítva próbálta.

A férfi megfordította az egyiket.

Másodszorra becsúszott a helyére.

Bence felnézett.

A férfi elmosolyodott.

A következő két darabot már maga választotta ki. Az egyik nem illett a másikhoz, ezért erősebben próbálta összenyomni őket, mire a férfi rögtön odanyúlt, kivette a kezéből, és másikat adott helyette.

– Nem törtem volna el.

A férfi mutatóujjával megfenyegette, de közben mosolygott.

Bence összehúzta a szemét.

– Maga sem tudja rendesen megcsinálni.

A férfi tovább dolgozott.

Bence ott maradt mellette.

Egy idő után már ő adogatta a szögeket, bár kétszer rosszat választott, és a férfi mindkétszer visszatette a többi közé. Harmadszorra jó méretűt adott.

A férfi megveregette a vállát.

Bence igyekezett úgy tenni, mintha ez különösebben nem érdekelné.

Az óra többször is ütött, mire újra eszébe jutott az ajtó.

A nő még mindig nem jött vissza.

Bence kiment az előtérbe.

Most már nem ült le, csak állt a zár előtt és hallgatózott. Odakintről néha lépések érkeztek, egyszer szekér gördült végig az utcán, valamivel később két ember beszélt el a ház előtt, aztán újra csak a távoli hangok maradtak.

Bence tenyerét az ajtóra tette.

– Jöjjön már vissza.

A férfi a nagy szoba ajtajában jelent meg.

Bence hátranézett rá.

– Maga szerint visszajön?

A férfi odalépett hozzá.

Egy pillanatig az ajtót nézte, aztán Bence vállára tette a kezét, gyengén megszorította, és visszafelé intett a szoba irányába.

Bence nem mozdult.

– Én tudom, hogy visszajön.

A férfi még ott állt mellette.

– Csak sokáig van.

A kéz még egyszer végigsimított a vállán, aztán eltűnt róla.

Bence végül visszament vele a nagy szobába.

A ládika már majdnem elkészült. A férfi visszatette az egyik oldalát, beillesztette az utolsó kis faéket, aztán Bence felé fordította.

A fiú megtapogatta a megjavított sarkot.

– Ezt én is csináltam.

A férfi bólintott.

Bence erre elmosolyodott.

Nem sokkal később megszólalt a zár.

A fiú olyan gyorsan fordult meg, hogy a széke felborult mögötte.

Végigfutott a nagy szobán, a folyosón, és mire az ajtó kinyílt, már az előtér közepén állt.

A nő egyik karján kosár lógott, a másik kezében összekötött csomagot tartott. Haja a füle mellett kiszabadult a kendő alól, az arcát megcsípte a kinti levegő.

Bence először csak nézte.

Az asszony letette a csomagot.

A fiú odafutott hozzá.

– Sokáig volt.

Átölelte a derekát.

A nő karja szinte azonnal köré zárult, tenyere végigsimított a hátán, aztán a haján.

Bence néhány pillanatig erősen kapaszkodott belé.

– Nem vártam magát.

A nő lehajtotta a fejét, arcát egy pillanatra Bence hajához érintette.

A férfi közben kijött a nagy szobából.

– Délelőtt háromszor is visszaült az ajtóhoz – mondta a férfi.

A nő felnézett rá.

– Ennyire várt?

– Még ebéd után is visszament.

A férfi az előtér kis padja felé mutatott, aztán Bencére, és elmosolyodott. Az asszony szája sarkában is megjelent a mosoly.

Bence elengedte.

– Mit mondott rólam?

Egyikük sem válaszolt neki.

A férfi átvette a kosarat, a nő pedig levette a kendőjét.

Bence utánuk ment a konyhába.

A kosárból kenyér, sajt, néhány alma és egy kisebb vászoncsomag került elő. A nő ezt utoljára bontotta ki, és amikor a kendő szétnyílt az asztalon, egy tenyérnyi faragott hajó feküdt benne.

Keskeny teste világos fából készült, az oldalába vékony vonalakat karcoltak, közepén apró árbóc állt, rajta összehajtott vászondarabbal.

Bence közelebb hajolt.

A nő a hajót felé tolta.

– Nekem?

Bence magára mutatott.

Az asszony mosolyogva még közelebb tolta.

A fiú felvette.

Sokáig forgatta a kezében, végighúzta az ujját a hajó oldalán, megérintette az apró árbócot, majd óvatosan letette, nehogy feldőljön.

– Marcinak is tetszene.

A nő megsimította a haját.

Bence ezúttal nem húzódott el.

Este a kis hajót a párnája mellé tette. Lefekvés után még egyszer felvette, megvizsgálta az alját is, aztán olyan helyet keresett neki az ágy melletti kis asztalon, ahonnan reggel rögtön megláthatja.

A nő ott ült mellette.

Bence a takarót az álláig húzta.

– Holnap ne menjen el ilyen sokáig.

Az asszony lassan végigsimított a haján.

– Jó éjszakát.

Bence már majdnem becsukta a szemét, amikor a nő felállt.

– Az ajtót hagyja úgy.

A fiú az ajtó felé mutatott.

Az asszony csak addig húzta be, ameddig más estéken is.

A folyosóról keskeny világosság maradt a padlón.

Bence nézte még egy ideig, aztán a kis fahajó felé fordította a fejét.

Aznap már nem az járt a fejében, hányadik napja van a házban.

Az járt a fejében, hogy a nő reggel is ott lesz-e.

## V. A szokás

A napok ezután úgy kezdtek egymás mellé simulni, hogy Bence egy idő után már nem mindegyiket tudta külön felidézni. Reggelente ugyanaz a halk nesz ébresztette a konyha felől, a nő léptei végigmentek a folyosón, víz csobbant a tálba, valahol fedő koppant az edény széléhez, később pedig megérkezett az étel illata, amelyből Bence már az ágyban fekve ki tudta találni, érdemes-e gyorsan felkelnie, vagy maradhat még néhány percig a takaró alatt.

A kis fahajó az ágya melletti asztalon maradt. Első este még olyan óvatosan tette le, mintha egyetlen rossz mozdulattól eltörhetne, néhány nappal később már magával vitte a nagy szobába, úsztatta a szőnyeg szálai között, kikötőt épített neki a fakockákból, egyszer pedig a konyhában is megjelent vele, és addig tologatta az asztalon, míg a nő egy tányért tett elé.

Az asszony elvette a hajót a kenyér mellől, és a polcra rakta.

– Az enyém.

Bence azonnal érte nyúlt.

A nő csak a forró tál felé intett, aztán visszatolta elé a kanalat.

Bence összeráncolta a homlokát, de amikor a gőz megcsapta az arcát, leült. Evés után felállt, a polcra mutatott, majd a saját mellkasára.

A nő elmosolyodott, levette a hajót, és a kezébe adta.

Bence elégedetten vitte vissza a nagy szobába.

A férfi ezt az ajtóból nézte, aztán a nőre pillantott.

– Már enni is magával hozza.

– Mindenhová – felelte az asszony, és felnevetett.

– Mi olyan vicces?

Egyikük sem válaszolt.

Bence egy darabig gyanakodva figyelte őket, aztán a hajóval továbbment.

A házban már nem kellett gondolkodnia, merre forduljon. Sötétben is megtalálta volna a konyhát, tudta, hogy a nagy szoba előtt melyik deszka ad halk nyekkenést a talpa alatt, azt is, hogy az előtér kis padjának jobb széle kevésbé billeg, ha arra ül, és pontosan ismerte azt a helyet az utcai ablaknál, ahová a széket kell húzni ahhoz, hogy a párkányra könyökölve a legtöbbet lássa odakintről.

Reggelente ugyanaz az asszony járt el a ház előtt két nagy korsóval. Bence már messziről felismerte a lépteit, aztán a kendőjét, amikor áthaladt az ablak előtt. Néha utána kiáltott.

Az asszony egyszer sem fordult vissza.

Egy idő után Bence már csak akkor szólt, ha nagyon közel ment el.

Máskor egyszerűen követte a szemével, míg eltűnt.

Az utca hangjai lassan olyan ismerőssé váltak, mint a ház belseje. Délelőtt rendszerint elment egy szekér, amelynek egyik kereke minden fordulatnál halkabban koppant a többinél. Valahonnan nem messze kalapács hangja érkezett, három-négy gyors ütés után mindig rövid szünettel. Dél felé gyerekek rohantak végig az úton; soha nem lehetett egész alakjukat látni, csak fejek bukkantak fel az ablak alsó pereme fölött, vállak, egy magasra lendülő kar, egyszer pedig egy labda ugrott át a kerítés fölött, majd rögtön eltűnt.

Bence aznap sokáig maradt az ablaknál.

Amikor a gyerekhangok távolabb értek, lecsúszott a székről, elővette a papírokat, és rajzolni kezdett.

A házukat rajzolta.

Ezúttal tovább dolgozott rajta, mint máskor. A tető fölé füstöt húzott, az udvar egyik oldalára odatette az eperfát, amelynek vastagabb ága nyáron egészen a fal fölé nyúlt, a kerítés mellé három tyúkot rajzolt, bár a harmadik inkább hasonlított nagy lábú madárra, mint arra a vörös tollú tyúkra, amelyet fel akart idézni.

A ház előtt négy alak állt.

Az egyik férfinak széles vállat rajzolt.

Mellette az anyja hosszú ruhát kapott, fejére pedig barna kendőt, amelynek szélén Bence apró kék pontokat tett egymás mellé.

A két kisebb alak közül az egyik ő volt.

A másiknak szándékosan nagyobb fejet rajzolt, mert Marci mindig mérges lett, amikor Bence úgy rajzolta le, hogy alacsonyabb nála.

Bence sokáig nézte a képet.

Aztán a saját alakját áthúzta egyetlen vonallal.

Nem tetszett neki.

Új papírt vett elő.

Másodszorra csak a házat rajzolta le, az eperfát és három alakot előtte.

Amikor elkészült, bevitte a konyhába.

A nő az asztal mellett ült, valamilyen zöldséget tisztított, héjai egy tálban gyűltek a keze mellett.

Bence elé tette a rajzot.

– Ez az otthonom.

Ujjával a házra mutatott.

– Itt laktam.

A nő letette a kést.

Bence az anyjára mutatott.

– Ő az anyukám.

A nő közelebb húzta magához a papírt.

– Ez apa.

Bence a következő alakra tette az ujját.

– Ő meg Marci.

Az asszony sokáig nézte a rajzot, aztán Bencére pillantott, és végigsimított a haján.

– Nem itt lakom – mondta Bence.

Megérintette a rajzolt házat.

– Itt.

A nő mosolygott.

Bence megfogta a papír egyik szélét, mintha vissza akarná venni, az asszony azonban felállt vele, átment a nagy szobába, és az egyik polc fölött a falhoz illesztette. Néhány pillanat múlva előkerült két apró tű, és a rajz ott maradt a falon.

Bence megállt alatta.

– Mit csinál?

A nő hátralépett egyet, megnézte a képet, aztán Bencére mosolygott.

A fiú felnézett a falra.

Az eperfa egyik ága ferdébbre sikerült, mint szerette volna, az apja egyik karja túl hosszú lett, Marci feje pedig még így is nagy volt, de messzebbről valahogy szebbnek látszott az egész.

– Az az én házam.

A nő megsimogatta a vállát, aztán visszament a konyhába.

Bence még maradt.

A rajz egész délután ott volt.

Amikor késő délután megcsörrent a kulcs a bejárati ajtóban, Bence még mindig a szőnyegen ült a kis fahajó mellett, amelynek a fakockákból épített kikötője időközben három fallal, egy híddal és egy olyan toronnyal is kiegészült, amelynek semmi különösebb szerepe nem volt azon kívül, hogy a fiú szerint kikötőhöz torony is kell. A férfi cipőjének hangját már az előtérből felismerte, a kabát súrlódását is, ahogy leemelte a válláról, ezért fel sem nézett addig, amíg a lépések el nem halkultak mögötte.

A férfi a nagy szoba közepén állt meg.

Tekintete előbb Bencére esett, aztán följebb csúszott a falra, ahol a rajz a polc fölött függött, a vörös tetős házzal, az eperfával és a három egymás mellett álló alakkal. Közelebb ment hozzá, fejét kissé oldalra billentette, majd hátraszólt a konyhába.

– Ezt ma rajzolta?

– Délelőtt – felelte a nő az edények mellől. – Behozta nekem a konyhába.

Az asszony kilépett az ajtón, kezét a kötényébe törölve odament hozzá, és egy ideig egymás mellett nézték a rajzot.

– Mindig ugyanazokat rajzolja – mondta a nő, és rámutatott az eperfára, aztán az egyik alakra.

A férfi elmosolyodott.

Bence kezében megállt a hajó.

Tudta, hogy a képről beszélnek. A tekintetük újra meg újra visszatért rá, egyszer a férfi is felé fordult, majd megint a falhoz, és ettől a fiúban lassan ugyanaz a feszültség gyűlt össze, amely akkor szokott, amikor a felnőttek úgy beszéltek róla, hogy közben ő is ott állt közöttük.

– Az az otthonom.

A férfi lenézett rá.

Bence felállt, odament a falhoz, és az ujjával megérintette a rajzolt házat.

– Itt laktam.

A férfi közelebb hajolt, követve a mozdulatát.

Bence az apjára mutatott, aztán az anyjára, végül a kisebb alakra.

– Apa. Anya. Marci.

Az arcokat sorban érintette meg az ujjával, mintha azzal, hogy mindegyiknek nevet ad, közelebb tudná hozni őket a szobához, a falhoz, ehhez a két felnőtthöz, akik olyan figyelmesen nézték ugyanazokat a vonalakat, mégsem látták bennük azt, amit ő.

A férfi bólintott.

Ez az apró mozdulat olyan gyors reményt ébresztett Bencében, hogy szinte egyszerre kezdett beszélni és mutatni, a háztól a kép széléig húzta az ujját, aztán az ajtó felé intett, majd ismét a házra.

– Oda akarok visszamenni. Érti? Oda.

A férfi kiegyenesedett, a nőre nézett. – Megint az ajtót mutatja – mondta neki.

Az asszony odalépett Bencéhez, lehajolt hozzá, egyik kezét a vállára tette, a másikkal pedig megsimította a haját, aztán homlokon csókolta.

Bence arcáról olyan gyorsan tűnt el a remény, mintha valaki elfújta volna.

– Nem ezt mondtam.

A nő továbbra is ott maradt mellette, hüvelykujjával elsimította a fiú szemöldöke fölé hullott tincset.

– Haza akarok menni.

– Jól van, kicsim. Mindjárt eszünk.

Az asszony ugyanazzal a halk dallammal beszélt hozzá, amelyen este az ágya mellett szokott, amikor Bence már félálomban feküdt. A fiú ekkor nem próbálta harmadszor is elmagyarázni; kibújt a keze alól, visszament a fakockákhoz, leült közéjük, a kis hajót pedig olyan sokáig igazgatta a kikötő mellett, amíg sikerült pontosan párhuzamosra állítania a két fal között.

A rajz egész este ott maradt fölötte.

Vacsoránál is látta, ha a nagy szoba felé fordította a fejét, később pedig, amikor a nő elrakta az edényeket, a férfi a karosszékében olvasott, ő pedig újra a szőnyegen ült, időnként felnézett rá. A falon kisebbnek tűnt, mint amikor az asztalon feküdt előtte; a ház körül túl sok lett az üres hely, az alakok arca pedig olyan messzire került, hogy a kék pontok az anyja kendőjén már alig látszottak.

Később a nő megállt a nagy szoba ajtajában, és az ágy felé intett.

– Ideje lefeküdni.

Bence addigra már eldöntötte, hogy nem akarja ott hagyni.

Nem ment rögtön a szobájába.

A fal elé húzta azt a széket, amelyet korábban az ablakhoz használt, két kézzel megfogta a háttámláját, hogy ne csikorduljon végig túl hangosan a padlón, aztán felmászott rá. A rajz felső sarkát tartó tű elsőre nem engedett, a papír megfeszült alatta, mire Bence megtámasztotta a tenyerével, és óvatosabban próbálta kihúzni. A második már könnyebben kijött.

A férfi könyve lapjai fölött figyelte.

A nő is megállt a konyhaajtóban.

Egyikük sem ment oda.

Bence leszedte a képet, a tűket a polcra tette, aztán leereszkedett a székről, a rajzot pedig két kézzel a mellkasához fogta. Ahogy elhaladt a házaspár előtt, még egyszer rájuk nézett.

– Ez az enyém.

A papírt magához szorítva végigment a folyosón.

A nő csak valamivel később követte.

Bence addigra az ágya mellett talált helyet a rajznak, a fal és a kis asztal között, úgy támasztva oda, hogy fekve is lássa rajta a tetőt és az eperfát. A nő az ajtóból nézte egy ideig, aztán belépett, leült az ágy szélére, és amikor pillantása a papírra esett, Bence rögtön felkönyökölt.

– Ne tegye vissza.

A rajz felé mutatott, majd határozottan megrázta a fejét.

– Itt marad.

Tenyerét maga mellé tette az ágyra.

A nő tekintete végigment a mozdulatokon, aztán visszatért Bence arcára. Nem nyúlt a képhez. Csak közelebb ült hozzá, és ujjait lassan végighúzta a haján, a homlokától egészen a feje búbjáig.

Bence még mindig a rajzot figyelte.

– Maga mindig ezt csinálja.

Az asszony keze újra végigjárt ugyanazon az úton.

A fiú szája sarkában valami alig észrevehető mozdult.

– Anyukám is szokta.

Az eperfa az ágy mellől egészen másnak látszott, mint a fal magasából. Ilyen közelről újra látszottak a barna kendő szélén a kék pontok, az apja hosszabbra sikerült karja, Marci túl nagy feje és az a kis folt is a ház oldalán, ahol Bence egyszer rossz színnel kezdte el a falat, aztán megpróbálta átrajzolni.

A nő még sokáig ott ült.

Amikor végül felállt, Bence már a párnáján feküdt, arcát félig a takaró széléhez fordítva. Az asszony megigazította rajta a vásznat, aztán elindult az ajtó felé.

Bence nem szólt utána.

Az ajtó ugyanabban a keskeny résben maradt nyitva, amelyen esténként bejutott hozzá a folyosó világossága, s a rajz egészen addig látható maradt az ágy mellett, amíg a szoba lassan bele nem simult az éjszakába.

Reggel a papír ugyanott állt.

Bence ébredés után rögtön odanézett, aztán felült, megigazította, mert éjszaka az egyik sarka lecsúszott a fal mellől. Amikor a nő később bejött hozzá, a rajzra pillantott, majd Bencére, de továbbment az ablakhoz, és széthúzta előtte a függönyt.

A következő reggelen a kép még mindig ott volt az ágy mellett.

És néhány nappal később, amikor Bence már úgy kelt fel, hogy előbb nyúlt a kis fahajóért, mint hogy ellenőrizte volna a papírt, a vörös tetős ház továbbra is ugyanott őrizte azt a helyet, ahová minden este vissza akart jutni.

## VI. A séta

Az első igazán meleg reggel úgy érkezett meg a faluba, hogy már napkelte után sem maradt sokáig hűvös a folyó felől érkező levegő, a házak előtt fellocsolt földből lassan felszállt a nedvesség illata, a kerítések fölött pedig olyan élénken zöldellt minden, mintha az esős napok után egyszerre több fényt kaptak volna a levelek. Bence az ablakhoz húzott széken térdelt, könyökével a párkányra támaszkodott, és azt a keskeny darabot figyelte az utcából, amelyet innen látni lehetett; egy tyúk kapirgált a szemközti kerítés tövében, időnként egészen eltűnt a fű között, aztán újra előbukkant, valamivel távolabbról pedig gyerekhangokat sodort felé a reggel.

Már nem kiáltott utánuk minden alkalommal.

Aznap azonban sokáig hallatszottak, közeledtek, majd valahol a ház előtt futottak el, és az ablak alsó szélén egy pillanatra megjelent egy barna fej, utána egy másik, aztán egy kéz, amely magasra emelt valamit, talán botot vagy vesszőt. Bence megfeszítette a lábát, hogy még magasabbra kerüljön, de mire az arcát az üveghez nyomta, már csak a hangok távolodtak.

– Én is tudok futni – mondta utánuk.

A szobából kilépve rögtön észrevette, hogy valami eltér a megszokott reggeltől.

A férfi nem készülődött úgy, mint más napokon, amikor hamarosan elment; egyszerűbb ruhát viselt, az ingujját könyökig felhajtotta, és az előtérben állva egy hosszú, keskeny bőrszíjat vizsgált, végighúzva rajta az ujját, majd próbából megmozgatva a végén lévő fémkapcsot. A nő mellette egy kisebb csomagot tartott, benne kendő, kulacs és valami vászonba csavart ennivaló, a fal mellett pedig Bence cipője állt, gondosan egymás mellé téve.

Bence megállt a folyosón.

A cipőre nézett.

Aztán az ajtóra.

Aztán újra a cipőre.

– Megyünk valahová?

A nő észrevette, mosolyogva intett neki, majd a padra mutatott.

Bence olyan gyorsan ért oda, hogy az egyik cipőt majdnem felrúgta. Leült, felkapta, és már húzta volna a lábára, amikor rájött, hogy fordítva tartja; megfordította, belebújt, a másikkal pedig még ügyetlenebbül boldogult, mert közben folyamatosan az ajtót figyelte, mintha attól félne, hogy mire elkészül, meggondolják magukat.

A nő letérdelt elé, megkötötte az egyik fűzőt.

– Én is meg tudom.

Bence elhúzta a lábát, a másikat már maga kötötte meg, bár az egyik hurok kétszer akkora lett, mint a másik.

A férfi közben a bőrszíjat egy szélesebb, puhább darabhoz csatolta, amely több pántból állt, és amikor Bence felállt, odalépett hozzá vele.

A fiú mosolya eltűnt.

– Az meg mi?

A férfi a kezében tartotta előtte, aztán Bence mellkasára mutatott.

– Nem.

A fiú megrázta a fejét.

A nő leguggolt mellé, kezével végigsimított a vállán. – Semmi baj. Mindjárt indulunk – mondta halk, nyugodt hangon, a másik kezével pedig megérintette a pántot, majd saját mellkasa előtt mutatta, hogyan kerül majd rá.

Bence az ajtóra nézett.

A férfi a kulcsokat tartotta a másik kezében.

A fiú még egyszer a szíjra pillantott.

– Ha ezt felveszem, kimehetek?

Az ajtó felé mutatott, aztán magára.

A nő elmosolyodott.

Bence lassan felemelte a karját.

– Jó. De csak azért, mert kimegyünk.

A pánt puha volt, nem szorította, a mellkasán és a vállán futott körbe, a férfi két ujjal minden csat alatt ellenőrizte a helyet, aztán a hosszabb szíjat a háta mögött kapcsolta hozzá. Bence megfordult, próbálta meglátni, pontosan hová került, majd húzott rajta egyet.

A férfi keze követte a mozdulatot.

– Ezt nem szeretem.

Bence homlokát ráncolva nézett rá, aztán megint az ajtóra pillantott.

A nő már ott állt.

A kulcs belesiklott a zárba.

Bence lélegzete megakadt.

Az ajtó kinyílt.

Ezúttal senki nem lépett ki előtte rögtön, senki nem csukta vissza, és a küszöbön túl nemcsak egy keskeny szelet látszott az utcából. Ott volt az egész kapuig vezető rövid ösvény, két oldalán az ágyásokkal, a pad, amelyet eddig csak az ablakból lehetett részben látni, a ház falán végigfutó napfény, aztán a nyitott kapun túl az út.

Bence nem mozdult.

Huszonhárom napig számolta, mennyi ideje van a házban, utána lassan abbahagyta, most pedig egyszerre úgy állt az ajtóban, mintha az egész idő csak azért telt volna el, hogy ez a néhány lépés ilyen hosszú legyen.

A nő kiment az udvarra.

Bence követte.

A cipője alatt először kavics roppant.

Lenézett rá.

Aztán a virágágyásra, a fal tövében húzódó keskeny földsávra, a padra, a diófa egyik ágára, amely sokkal nagyobbnak látszott innen, mint az ablakból, és mire a kapuhoz értek, már annyi minden került egyszerre a szeme elé, hogy egyiknél sem tudott sokáig megállni.

Az utca szélesebb volt, mint képzelte.

A házak nem egymás után sorakozó ablakokból és tetőrészletekből álltak, hanem udvaruk volt, kapujuk, fáik, egymásba futó árnyékaik; a földút egyik oldalán sekély árok húzódott, benne még maradt egy kevés víz az előző napok esőiből, a távolban pedig a tetők fölött fehér torony emelkedett, harangja éppen akkor szólalt meg, amikor Bence kilépett a kapun.

A fiú megállt.

Ismerte ezt a hangot.

Nem ezt a harangot, talán, de a reggeli harangok hangját, azt, ahogy az ember a házak között hallja őket, és abból tudja, hogy mások is felkeltek, ajtókat nyitnak, vizet visznek, tüzet raknak, valahol egy asszony már kenyeret dagaszt, egy gyerek pedig valószínűleg azt próbálja elhitetni az anyjával, hogy nincs ideje megmosakodni.

Bence szeme megtelt könnyel.

– Haza tudnék menni innen.

Előrelépett.

A szíj enyhén megfeszült mögötte.

Megtorpant.

Hátranézett a férfira, aki a végét lazán a kezében tartotta.

– Engedjen el.

A férfi mosolygott. – Jól van – mondta, majd elindult az utcán.

A szíj meglazult.

Bence ment utánuk.

Eleinte minden kapunál benézett, minden kereszteződésnél megpróbálta megjegyezni, merre fordulnak, és kétszer is hátranézett, hogy felismerné-e a házat, ha vissza kellene találnia. A nő mellett haladt, időnként valamivel előrébb, aztán vissza, mert a szíj hossza éppen annyit engedett, hogy a keskeny út egyik szélétől a másikig eljusson.

A folyót előbb hallotta meg, mint meglátta.

A házak között lefelé vezető utca végén megjelent a víz halvány csíkja, aztán ahogy közelebb értek, egyre szélesebb lett, előtte a füzek hosszú ágai mozogtak, a part mentén asszonyok álltak korsóval és ruhával, valamivel távolabb gyerekek futottak a sekélyebb rész közelében.

Bence gyorsított.

A férfi kezében a szíj újra megfeszült.

A fiú megtorpant, aztán visszanézett rá.

– Ott vannak gyerekek.

A férfi a folyó felé pillantott, majd továbbindult a part menti úton.

Bence még nézte a gyerekeket.

Az egyik éppen követ dobott a vízbe.

A másik utána kiáltott valamit.

Bence válaszolt volna, de közben valaki szembe jött velük.

Először csak a nő tűnt fel neki.

Középkorú volt, világos ruhában, fején kendővel, egyik kezében kis kosárral. Amikor közelebb ért, a Bencével sétáló nő rámosolygott, és mindketten lassítottak.

Aztán Bence meglátta a mellette haladó gyereket.

Nagyjából vele egykorú lány lehetett, talán valamivel magasabb, haja két rövid fonatban lógott a válla mellé. Világos ruhát viselt, lábán puha cipőt, mellkasán pedig ugyanaz a széles pánt futott végig, amely Bencén.

A hátából hosszú bőrszíj vezetett az asszony kezéhez.

Bence nézte.

A lány is őt nézte.

– Téged is elvittek? – kérdezte Bence.

A lány pillantása egy pillanatra a mellette álló asszonyra siklott.

– Nem emlékszem. Kicsi voltam.

Bence még mondott volna valamit, de a két felnőtt közben megállt egymással szemben.

– Végre kisütött a nap – mondta a Bence mellett álló nő.

– Ideje volt. A felső utcában tegnap még állt a víz az árokban.

Az idegen asszony ezután Bencére pillantott.

– Ő az új?

A nő megsimította Bence haját.

– Nemrég került hozzánk.

Az idegen közelebb hajolt hozzá.

Bence hátrált fél lépést.

– Maga érti, amit mondok?

Az asszony elmosolyodott.

– Hát te milyen szép vagy.

Bence arca megváltozott.

– Kérem. Segítsen.

Az idegen nő továbbra is mosolygott.

Bence közelebb lépett hozzá, amennyit a szíj engedett.

– Elvittek otthonról. Anyukám és apukám biztos keres. Kérem, mondja meg nekik, hogy engedjenek el.

A férfi és a nő mögötte csendben vártak.

Az idegen asszony felnevetett, aztán a Bence mellett álló nőre nézett.

– Milyen beszédes.

A nő büszkén végigsimított Bence haján.

– Egész nap jár a szája.

Az asszony még egyszer lehajolt hozzá.

Ujjai óvatosan megsimították Bence arcának szélét.

– Nagyon szép ember.

Bence nem mozdult.

Az idegen asszony kiegyenesedett.

– Mióta van nálatok?

A folyó ugyanazzal a lassú türelemmel vitte tovább a vizét a füzek alatt, amellyel hosszú emberöltők óta kerülte meg a part köveit és a beléjük kapaszkodó gyökereket.</textarea><article id="story-body" class="reader-width story-body"></article><div class="reader-width reader-return"><a class="back-link" href="index.html">← Vissza a Színvaksághoz</a></div></main>
