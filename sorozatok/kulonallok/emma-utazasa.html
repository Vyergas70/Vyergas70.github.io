<main><div class="reader-width reader-top"><a class="back-link" href="index.html">← Különállók</a></div><header class="reader-width reader-header fade-in"><p class="eyebrow gold">2. rész</p><h1 class="display-title">Emma utazása</h1></header><div class="reader-width"><div class="rule"></div></div><textarea id="story-source" class="story-source" aria-hidden="true">
Lehet-e szabad az, akit mindig megóvnak a rossz döntéseitől?

Az Emma utazása egy hazafelé vezető út története. Emma egy számára még idegen hajón indul el a csillagok között, egyetlen állandó társával, Ádámmal, a hajó mesterséges intelligenciájával.

Ádám mindig pontosan arra válaszol, amit kérdeznek tőle. Csakhogy az ember nem mindig tudja, mit kellene megkérdeznie. Emma lassan megtanulja, hogy egy igaz válasz sem feltétlenül jelenti azt, amit hallani vélünk — és hogy egészen más valakire rábízni magunkat, mint átengedni neki a döntést arról, mi szolgálja a javunkat.

Útjuk során különböző világokkal és életformákkal találkoznak, amelyek más és más oldalról teszik próbára mindazt, amit Emma addig a veszteségről, a szabadságról, a biztonságról és az önálló döntés jogáról gondolt. Közben nemcsak a hajót tanulja meg egyre jobban használni, hanem kérdezni is.

Az Emma utazása lassan építkező science fiction arról, hogy a gondoskodás mikor válik irányítássá, mennyit ér a biztonság, ha más határozza meg számunkra az elfogadható kockázatot — és hogy jogunk van-e olyan döntést meghozni, amelyről valaki más biztosan tudja, hogy árthat nekünk.

Ha valaki jobban látja nálunk a döntéseink következményeit, joga lesz-e ettől helyettünk dönteni?
