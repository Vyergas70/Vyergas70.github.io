Mennyit ér a titkos énünk háboríthatatlansága?


A Zakariás titka finom melankóliával átitatott történet az emberi elszigeteltségről és a kapcsolódás vágyáról. Egy monoton életet élő férfi a csillagok között olyan világgal találkozik, ahol a fájdalom és az öröm nem csupán az egyéné, hanem közös tapasztalattá válhat.

A történet hangulata egyszerre álomszerű és nyugtalanítóan intim, miközben lassan elbizonytalanítja azokat a határokat, amelyekről természetesnek vesszük, hogy elválasztanak bennünket egymástól. Ez a science fiction kevésbé a technológiáról, mint inkább az emberi közelség, az egyéniség és a szabadság határairól szól.

Mennyire rémülnénk meg attól, ha valaki nemcsak azt látná bennünk, amit látni engedünk, hanem azt is, amit nap mint nap egyre mélyebbre ásunk magunkban? Ha nincs hova rejtőznie az énnek, az közelebb hoz bennünket egymáshoz — vagy inkább eltaszít?
